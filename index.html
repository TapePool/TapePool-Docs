on tapeout.net), push reports, sweep agents, repay, flag with evidence and seize after the windows. If the guardian key leaked, the worst case is paused borrows, suspended passes or a switched-off feed, and the owner undoes each in one transaction and rotates the key.\u003c/p>","zh":{"group":"运行机制","title":"keeper 与守护者","lead":"一个链下机器人按时完成日常工作。它的密钥只能拉下三个制动，别无其他权限。","body":"\u003ch2>keeper 做什么\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">工作\u003c/th>\u003cth class=\"\">链\u003c/th>\u003cth class=\"\">时间\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">领取贷款中矿机的收益\u003c/td>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">产出足以还清债务时立即领取（每 10 分钟检查一次），否则在到期前最后一小时领取，之后只要仍有欠款，每 72 小时领取一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">领取被没收凭证的收益\u003c/td>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">每周\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">把矿机代理中的 BEM 归集到资金池\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">有 BEM 待归集时，每 10 分钟\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">推送矿机报告\u003c/td>\u003ctd class=\"\">BSC 到 X Layer\u003c/td>\u003ctd class=\"\">借款人请求时，有次数限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">标记受损贷款\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">证据充分时\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">监控 TapeOut 合约\u003c/td>\u003ctd class=\"\">两条链\u003c/td>\u003ctd class=\"\">用已最终确认的读取，把实现合约槽位与审阅过的值进行比较\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">通知所有者\u003c/td>\u003ctd class=\"\">链下\u003c/td>\u003ctd class=\"\">通过 Telegram 机器人\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>它运行在托管服务上，只持有 gas（BNB 和 OKB），从不持有资金池资金。它还为应用提供只读数据：份额价值历史和持仓信息。\u003c/p>\n\u003ch2>守护者的制动\u003c/h2>\n\u003cp>keeper 的密钥同时也是\u003cstrong>守护者\u003c/strong>（guardian）。它只能做三件事，每件都立即生效，且只有所有者能撤销：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>暂停借款。\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>暂停某台矿机的筛查通过记录。\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>关闭矿机数据源。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">keeper 检测到\u003c/th>\u003cth class=\"\">它立即\u003c/th>\u003cth class=\"\">随后所有者\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">凭证、矿机金库或 PodMining 的实现合约发生变化\u003c/td>\u003ctd class=\"\">暂停借款并关闭数据源\u003c/td>\u003ctd class=\"\">审查变更，在数据重新可信后恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">BSC 上的电路执行合约发生变化\u003c/td>\u003ctd class=\"\">暂停借款\u003c/td>\u003ctd class=\"\">审查执行合约和筛查前提\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">某台矿机被强制取回\u003c/td>\u003ctd class=\"\">暂停该矿机的通过记录、推送报告，并标记持有它的贷款\u003c/td>\u003ctd class=\"\">永久撤销通过记录，或在误报时解除暂停\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>以上任何情况下，进行中的贷款都会继续。任何制动都不会影响还款、提取、标记或没收。\u003c/p>\n\u003ch2>如果 keeper 停止运行\u003c/h2>\n\u003cp>除了制动之外，它做的事都不需要它的密钥。任何人都可以领取矿机收益（在 tapeout.net 上）、推送报告、归集、还款、凭证据标记，并在窗口期后执行没收。即使守护者密钥泄露，最坏的结果也只是借款被暂停、通过记录被暂停或数据源被关闭，所有者用一笔交易即可逐项撤销，并更换密钥。\u003c/p>"}},{"id":"admin","group":"Trust and safety","title":"Who can change what","lead":"Tightening is instant, loosening waits 48 hours in a public queue, a new credit rule waits 7 days. No one can move pool funds or vouchers.","body":"\u003ch2>Roles\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Role\u003c/th>\u003cth class=\"\">Can\u003c/th>\u003cth class=\"\">Cannot\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>Owner\u003c/strong> (a dedicated, hand-signed browser wallet)\u003c/td>\u003ctd class=\"\">Every lever below, within hard bounds and delays. Release the brakes.\u003c/td>\u003ctd class=\"\">Move pool BEM, reserve BEM or vouchers; change an open loan; change the asset; mint shares; upgrade a contract; renounce ownership\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Guardian\u003c/strong> (the keeper's key)\u003c/td>\u003ctd class=\"\">Pause borrows, suspend a pass, switch off the feed\u003c/td>\u003ctd class=\"\">Undo any brake, veto owner changes, stop deposits or seizes, move anything\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Anyone\u003c/strong>\u003c/td>\u003ctd class=\"\">Sweep, repay, claim late BEM, flag and seize with evidence, push reports, execute a queued change after its delay\u003c/td>\u003ctd class=\"\">Add collateral to someone else's agent, send funds anywhere except the defined paths\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"ok\">\u003cstrong>There is no function that moves pool BEM, reserve BEM or vouchers at the owner's or the guardian's request.\u003c/strong> The contracts are not upgradeable.\u003c/div>\n\u003ch2>Delays\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Change\u003c/th>\u003cth class=\"\">Delay\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Lower a cap, pause borrows, switch off the feed, suspend or revoke a pass\u003c/td>\u003ctd class=\"\">Instant\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Raise a cap, change a fee, the minimums, the late fee, the reserve terms or the operating fee\u003c/td>\u003ctd class=\"\">48 hours, in a public queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A new screen pass\u003c/td>\u003ctd class=\"\">48 hours before it counts\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A new credit rule (policy swap)\u003c/td>\u003ctd class=\"\">7 days, with borrows paused meanwhile\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>A queued change shows its new value and time in an event. After the delay, anyone can execute it, within a 7-day window; after that it lapses and must be queued again.\u003c/li>\n\u003cli>Hard bounds are checked when a change is queued and again when it executes.\u003c/li>\n\u003cli>Every change applies to new loans only.\u003c/li>\n\u003cli>Ownership moves in two steps, and renouncing ownership is disabled, so the restore levers can never be lost.\u003c/li>\n\u003c/ul>\n\u003ch2>Hard bounds in code\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Parameter\u003c/th>\u003cth class=\"\">Bound\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Flat fee, 7 days\u003c/td>\u003ctd class=\"\">0.25% to 3%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Flat fee, 14 days\u003c/td>\u003ctd class=\"\">0.5% to 6%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Minimum fee\u003c/td>\u003ctd class=\"\">0.001 to 0.1 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Minimum advance\u003c/td>\u003ctd class=\"\">0.001 to 1 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Late fee\u003c/td>\u003ctd class=\"\">0 to 0.3% per day\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Reserve share / reserve cap\u003c/td>\u003ctd class=\"\">up to 50% / up to 20%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Operating fee per term\u003c/td>\u003ctd class=\"\">0 to 0.5 OKB\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Borrow cap\u003c/td>\u003ctd class=\"\">up to 90% of assets\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Per-borrower cap\u003c/td>\u003ctd class=\"\">up to 50% of assets\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The launch values sit at the low end: 0.25% and 0.5% fees, 0.001 BEM minimum fee, 0 late fee, 0 OKB operating fee.\u003c/p>\n\u003ch2>Trust outside TapePool\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>TapeOut's 3-of-5 multisig\u003c/strong> can upgrade the RIG vouchers and the rig vault on BSC, and can rescue a rig. TapePool cannot stop that. When the keeper sees an upgrade, it pauses new borrows; a rescue is treated as impairment.\u003c/li>\n\u003cli>\u003cstrong>LayerZero\u003c/strong> carries rig data from BSC to X Layer, and the BEM bridge relies on it too. If it stops, new borrows stop; open loans keep repaying.\u003c/li>\n\u003cli>\u003cstrong>PodMining\u003c/strong> is sealed (no owner). The keeper still watches its implementation.\u003c/li>\n\u003cli>\u003cstrong>The app\u003c/strong> builds your transactions and your wallet signs them. Check every request in your wallet.\u003c/li>\n\u003c/ul>","zh":{"group":"信任与安全","title":"谁可以修改什么","lead":"收紧立即生效，放宽需在公开队列中等待 48 小时，更换信用规则需等待 7 天。没有任何人能转移资金池资金或凭证。","body":"\u003ch2>角色\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">角色\u003c/th>\u003cth class=\"\">可以\u003c/th>\u003cth class=\"\">不可以\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>所有者\u003c/strong>（一个专用、手动签名的浏览器钱包）\u003c/td>\u003ctd class=\"\">下表中的所有操作，均在硬性边界和等待期之内；解除制动。\u003c/td>\u003ctd class=\"\">转移资金池 BEM、准备金 BEM 或凭证；修改进行中的贷款；更换资产；增发份额；升级合约；放弃所有权\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>守护者\u003c/strong>（keeper 的密钥）\u003c/td>\u003ctd class=\"\">暂停借款、暂停通过记录、关闭数据源\u003c/td>\u003ctd class=\"\">撤销任何制动、否决所有者的变更、阻止存款或没收、转移任何资产\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>任何人\u003c/strong>\u003c/td>\u003ctd class=\"\">归集、还款、领取迟到的 BEM、凭证据标记与没收、推送报告、在等待期满后执行已排队的变更\u003c/td>\u003ctd class=\"\">向他人的矿机代理添加凭证；把资金转到既定路径之外的任何地方\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"ok\">\u003cstrong>没有任何函数可以按所有者或守护者的请求转移资金池 BEM、准备金 BEM 或凭证。\u003c/strong>合约不可升级。\u003c/div>\n\u003ch2>等待期\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">变更\u003c/th>\u003cth class=\"\">等待期\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">调低上限、暂停借款、关闭数据源、暂停或撤销通过记录\u003c/td>\u003ctd class=\"\">立即生效\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">调高上限，修改费用、最低金额、滞纳金、准备金参数或运营费\u003c/td>\u003ctd class=\"\">48 小时，公开排队\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">新的筛查通过记录\u003c/td>\u003ctd class=\"\">登记 48 小时后生效\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">新的信用规则（更换信用规则合约）\u003c/td>\u003ctd class=\"\">7 天，期间暂停借款\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>排队中的变更会通过事件公开新值和生效时间。等待期满后，任何人都可以在 7 天窗口内执行它；逾期未执行即失效，需要重新排队。\u003c/li>\n\u003cli>硬性边界在变更排队时和执行时各检查一次。\u003c/li>\n\u003cli>所有变更只适用于新的贷款。\u003c/li>\n\u003cli>所有权需分两步转移，放弃所有权的函数已禁用，因此恢复类操作永远不会丢失。\u003c/li>\n\u003c/ul>\n\u003ch2>代码中的硬性边界\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">参数\u003c/th>\u003cth class=\"\">边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">固定费用，7 天\u003c/td>\u003ctd class=\"\">0.25% 至 3%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">固定费用，14 天\u003c/td>\u003ctd class=\"\">0.5% 至 6%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">最低费用\u003c/td>\u003ctd class=\"\">0.001 至 0.1 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">最低借款金额\u003c/td>\u003ctd class=\"\">0.001 至 1 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">滞纳金\u003c/td>\u003ctd class=\"\">每天 0 至 0.3%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">准备金比例 / 准备金上限\u003c/td>\u003ctd class=\"\">最高 50% / 最高 20%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">每个期限的运营费\u003c/td>\u003ctd class=\"\">0 至 0.5 OKB\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">借款上限\u003c/td>\u003ctd class=\"\">最高为资产的 90%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">单个借款人上限\u003c/td>\u003ctd class=\"\">最高为资产的 50%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>上线时的参数都处于低端：费用 0.25% 和 0.5%，最低费用 0.001 BEM，滞纳金 0，运营费 0 OKB。\u003c/p>\n\u003ch2>TapePool 之外的信任\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>TapeOut 的 3/5 多签\u003c/strong>可以升级 RIG 凭证和 BSC 上的矿机金库，也可以强制取回矿机。TapePool 无法阻止。keeper 发现升级时会暂停新的借款；强制取回按受损处理。\u003c/li>\n\u003cli>\u003cstrong>LayerZero\u003c/strong> 把矿机数据从 BSC 传到 X Layer，BEM 跨链桥同样依赖它。如果它停止，新的借款会停止，进行中的贷款继续还款。\u003c/li>\n\u003cli>\u003cstrong>PodMining\u003c/strong> 已封存（没有所有者）。keeper 仍会监控它的实现合约。\u003c/li>\n\u003cli>\u003cstrong>应用\u003c/strong>为您构建交易，由您的钱包签名。请在钱包中核对每一个请求。\u003c/li>\n\u003c/ul>"}},{"id":"risks","group":"Trust and safety","title":"Risks","lead":"TapePool is new software. Read these risks before you supply or borrow.","body":"\u003ch2>If you supply BEM\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>A rig can fail.\u003c/strong> If a rig behind a loan is revoked, stopped or rescued, the loan can default. The pool then takes the vouchers of that loan, and a small loss reserve covers part of the gap. Lenders carry the rest. Every rig needs a screen pass before it can borrow; that lowers the risk but does not remove it.\u003c/li>\n\u003cli>\u003cstrong>Withdrawals use idle BEM.\u003c/strong> You can withdraw only BEM that is not lent out. While loans are open, you may wait for repayments. They come from mining, over 7 or 14 days.\u003c/li>\n\u003cli>\u003cstrong>Loans can run late.\u003c/strong> A rig mines less when the network grows. A late loan keeps repaying from its rig and is never sold off. There is no late fee until at least December 7, 2026, so a late loan earns lenders nothing extra.\u003c/li>\n\u003cli>\u003cstrong>Deposits stop while a loan is in trouble.\u003c/strong> When a loan is flagged, its unpaid principal comes out of the share value at once. New deposits stop until the loan is resolved. Withdrawals keep working, at the lower value.\u003c/li>\n\u003cli>\u003cstrong>Everything is in BEM.\u003c/strong> Fees and losses are counted in BEM. Nothing here protects you from a fall in the BEM price.\u003c/li>\n\u003cli>\u003cstrong>A few miners hold most rigs.\u003c/strong> Caps limit how much one borrower can take. Trouble at one large miner can still reach a large part of the pool.\u003c/li>\n\u003c/ul>\n\u003ch2>If you borrow\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Your rig repays first.\u003c/strong> While the loan is open, your rig's mined BEM goes to the pool until the debt is paid. After that you get the rest and take your voucher back.\u003c/li>\n\u003cli>\u003cstrong>A slow rig is never seized. A failed rig can be.\u003c/strong> If your rig is revoked, stopped or rescued, anyone can flag the loan. You then have 72 hours to repay in full. After that the pool can take every voucher in that loan's agent. The app gives each rig its own agent, so one rig's problem does not reach your other rigs.\u003c/li>\n\u003cli>\u003cstrong>Fees are not refunded.\u003c/strong> The BEM fee is flat, and repaying early does not lower it. An operating fee in OKB, if it is ever above 0, is never refunded either.\u003c/li>\n\u003cli>\u003cstrong>Harvest before you borrow.\u003c/strong> BEM your rig mined before the loan, if it is not harvested first, is paid to the agent and goes toward the debt. The app offers a harvest first.\u003c/li>\n\u003c/ul>\n\u003ch2>Who can change what\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>The TapePool owner\u003c/strong> can lower caps at once. Every other change, fees included, waits 48 hours in a public queue, within hard limits in the code. A new credit rule waits 7 days, and new borrows pause while it waits. No one can move pool funds or vouchers.\u003c/li>\n\u003cli>\u003cstrong>The keeper\u003c/strong> harvests rigs, sweeps the mined BEM into the pool and flags failed rigs. Its key can pull only three brakes: pause new borrows, switch off the rig data feed, and suspend a rig. Only the owner can release them. If the keeper stops, anyone can do its work.\u003c/li>\n\u003cli>\u003cstrong>TapeOut's multisig\u003c/strong> controls the rig vouchers, the rig vault on BSC and the circuits that judge rigs. It can upgrade them or rescue a rig, and TapePool cannot stop that. When the keeper sees an upgrade, it pauses new borrows.\u003c/li>\n\u003cli>\u003cstrong>LayerZero\u003c/strong> carries rig data from BSC to X Layer. If that path stops, new borrows stop. Open loans keep repaying.\u003c/li>\n\u003cli>\u003cstrong>The app\u003c/strong> builds your transactions, and your wallet signs them. Check every request in your wallet.\u003c/li>\n\u003c/ul>\n\u003cp>Details: \u003ca href=\"#admin\">Who can change what\u003c/a>, \u003ca href=\"#late-and-impaired\">Late loans and impairment\u003c/a>, \u003ca href=\"#share-value\">Share value, fees and losses\u003c/a>.\u003c/p>","zh":{"group":"信任与安全","title":"风险","lead":"TapePool 是一款新软件。存入或借款前，请先阅读以下风险。","body":"\u003ch2>如果您存入 BEM\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>矿机可能出问题。\u003c/strong>如果某笔贷款背后的矿机被撤销、停止，或被 TapeOut 多签强制取回（rescue），这笔贷款可能违约。资金池随后没收这笔贷款的凭证，损失准备金承担部分缺口，其余由出借人承担。每台矿机借款前都必须通过筛查，这能降低风险，但不能消除风险。\u003c/li>\n\u003cli>\u003cstrong>提款由闲置 BEM 支付。\u003c/strong>您只能提取尚未借出的 BEM。贷款进行期间，您可能需要等待还款。还款来自挖矿产出，期限为 7 天或 14 天。\u003c/li>\n\u003cli>\u003cstrong>贷款可能逾期。\u003c/strong>全网算力增长时，矿机产出会减少。逾期的贷款会继续用矿机产出还款，不会被拍卖。至少在 2026 年 12 月 7 日前不收滞纳金，因此逾期贷款不会给出借人带来额外收入。\u003c/li>\n\u003cli>\u003cstrong>贷款出问题时，存款暂停。\u003c/strong>一笔贷款被标记为受损后，其未偿本金会立即从份额价值中扣除。新存款暂停，直到这笔贷款处理完毕。提款照常进行，但按扣除后的较低价值计算。\u003c/li>\n\u003cli>\u003cstrong>一切以 BEM 计价。\u003c/strong>费用和损失都以 BEM 计算。这里没有任何机制能保护您免受 BEM 价格下跌的影响。\u003c/li>\n\u003cli>\u003cstrong>少数矿工持有大部分矿机。\u003c/strong>上限会限制单个借款人可借的金额，但一位大矿工出问题，仍可能影响资金池的很大一部分。\u003c/li>\n\u003c/ul>\n\u003ch2>如果您借款\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>矿机产出优先还款。\u003c/strong>贷款进行期间，矿机挖出的 BEM 先用于还款，直到债务还清。之后剩余的 BEM 归您，您也可以取回凭证。\u003c/li>\n\u003cli>\u003cstrong>产出慢的矿机绝不会被没收，受损的矿机可能会被没收。\u003c/strong>如果您的矿机被撤销、停止或被强制取回，任何人都可以标记这笔贷款。您随后有 72 小时补救窗口来全额还款。超过之后，资金池可以没收这笔贷款所在矿机代理中的全部凭证。应用为每台矿机创建独立的矿机代理，一台矿机出问题不会牵连您的其他矿机。\u003c/li>\n\u003cli>\u003cstrong>费用不退还。\u003c/strong>BEM 费用是固定费用，提前还款不会减少费用。OKB 运营费如果将来大于 0，同样不予退还。\u003c/li>\n\u003cli>\u003cstrong>借款前先领取收益。\u003c/strong>借款前矿机已挖出、但尚未领取的 BEM，会付给矿机代理并用于还款。应用会提示您先领取。\u003c/li>\n\u003c/ul>\n\u003ch2>谁可以修改什么\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>TapePool 所有者\u003c/strong>可以立即调低上限。其他任何变更（包括费用）都需在公开队列中等待 48 小时，并受代码中的硬性边界约束。新的信用规则需等待 7 天，等待期间新借款暂停。没有任何人能转移资金池资金或凭证。\u003c/li>\n\u003cli>\u003cstrong>keeper\u003c/strong> 负责领取矿机收益、把挖出的 BEM 归集到资金池，并标记受损矿机。它的密钥只能拉下三个制动：暂停新借款、关闭矿机数据源、暂停某台矿机。只有所有者能解除。如果 keeper 停止运行，任何人都可以接手它的工作。\u003c/li>\n\u003cli>\u003cstrong>TapeOut 的多签\u003c/strong>控制矿机凭证、BSC 上的矿机金库以及评判矿机的电路。它可以升级这些合约或强制取回矿机，TapePool 无法阻止。keeper 发现升级时会暂停新借款。\u003c/li>\n\u003cli>\u003cstrong>LayerZero\u003c/strong> 把矿机数据从 BSC 传到 X Layer。如果这条通道停止，新借款会停止，进行中的贷款继续还款。\u003c/li>\n\u003cli>\u003cstrong>应用\u003c/strong>为您构建交易，由您的钱包签名。请在钱包中核对每一个请求。\u003c/li>\n\u003c/ul>\n\u003cp>详见：\u003ca href=\"#admin\">谁可以修改什么\u003c/a>、\u003ca href=\"#late-and-impaired\">逾期贷款与受损矿机\u003c/a>、\u003ca href=\"#share-value\">份额价值、费用与损失\u003c/a>。\u003c/p>"}},{"id":"contracts","group":"Reference","title":"Contract addresses","nav":"Contracts","lead":"The contracts TapePool deployed on X Layer and BSC. Compare an address here with the one in your wallet before you sign.","body":"\u003cp>These are the contracts in use today. Each address links to the block explorer of its chain: OKLink for X Layer, BscScan for BSC. Check the chain as well as the address: the rig data reporter is on BSC, every other contract is on X Layer.\u003c/p>\n\u003ch2>X Layer: the pool\u003c/h2>\n\u003cp>Deployed on November 16, 2026. Borrowing opened on November 18, 2026.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Contract\u003c/th>\u003cth class=\"\">Address\u003c/th>\u003cth class=\"\">What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003ccode>TapePool\u003c/code> (tpBEM)\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x1a9A9850D597D8e3a03AFae48E3ac8E2D4aeC9d7\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x1a9A9850D597D8e3a03AFae48E3ac8E2D4aeC9d7\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">The pool. You deposit BEM here and receive tpBEM; this is also the tpBEM token address to add to your wallet.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>AgentFactory\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xA9014E27dD17ea30E4Fa4f71934645b9DCEF8ac8\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xA9014E27dD17ea30E4Fa4f71934645b9DCEF8ac8\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Creates Rig Agents. Each agent is a separate contract with its own address, owned by one borrower.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigAgent\u003c/code> implementation\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x0D4BA9992B2b887ea1f55E59925339547C772259\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x0D4BA9992B2b887ea1f55E59925339547C772259\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">The code every Rig Agent runs. Each agent is a clone of it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>CreditPolicy\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xBBFe498158b6A234f4f63B17673f6e8226656D34\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xBBFe498158b6A234f4f63B17673f6e8226656D34\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Checks every advance against the policy circuit and its Solidity mirror.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigScreen\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xc2bBc2f2EC90e16f8a9619D26A51144Eb0AC1744\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xc2bBc2f2EC90e16f8a9619D26A51144Eb0AC1744\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Registry of screen passes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>TapeLens\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xFcc669BC9cCa397CB01804035D5Be981d7389ef2\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xFcc669BC9cCa397CB01804035D5Be981d7389ef2\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Read-only helper: how much a rig can borrow, and why a borrow would be refused.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Rig data receiver\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xc94C9Cc912203c29C2c1b3534e0852BF4aFAeA10\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xc94C9Cc912203c29C2c1b3534e0852BF4aFAeA10\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Receives rig reports from BSC over LayerZero. Locked: no owner, no LayerZero delegate.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>X Layer: the policy circuit\u003c/h2>\n\u003cp>TapePool's own TapeOut processor, \"Tape Pool Policy\", holds the credit rule as circuit ID \u003cstrong>1\u003c/strong> (44 NAND gates). See \u003ca href=\"#credit-rule\">The credit rule\u003c/a>.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Contract\u003c/th>\u003cth class=\"\">Address\u003c/th>\u003cth class=\"\">What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Circuits contract of \"Tape Pool Policy\"\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xdc76f123838b5398A173D215a2c8338Ad189C9a8\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xdc76f123838b5398A173D215a2c8338Ad189C9a8\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Holds the policy circuit, ID 1. \u003ccode>CreditPolicy\u003c/code> evaluates it on every advance.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Transistors contract of \"Tape Pool Policy\"\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x05264cF3862266165401d3961935D0D230bC8fd6\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x05264cF3862266165401d3961935D0D230bC8fd6\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">The transistor contract of the same processor.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>BSC\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Contract\u003c/th>\u003cth class=\"\">Address\u003c/th>\u003cth class=\"\">What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Rig data reporter\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://bscscan.com/address/0xD54673E73448584E86C61f45203ab507F3F2c3eC\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xD54673E73448584E86C61f45203ab507F3F2c3eC\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">Reads each rig on BSC and sends its report to the receiver on X Layer. Locked: no owner, no LayerZero delegate.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The RIG vouchers, the BEM token and the rig vault are TapeOut's contracts, not TapePool's. See \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">TapeOut\u003c/a>.\u003c/p>","zh":{"group":"参考","title":"合约地址","nav":"合约地址","lead":"TapePool 在 X Layer 和 BSC 上部署的合约。签名前，请将钱包中显示的地址与本页核对。","body":"\u003cp>以下是当前正在使用的合约。每个地址都链接到所在链的区块浏览器：X Layer 使用 OKLink，BSC 使用 BscScan。请同时核对链和地址：矿机数据源报告合约在 BSC 上，其余合约都在 X Layer 上。\u003c/p>\n\u003ch2>X Layer：资金池\u003c/h2>\n\u003cp>2026 年 11 月 16 日部署，2026 年 11 月 18 日开放借款。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">合约\u003c/th>\u003cth class=\"\">地址\u003c/th>\u003cth class=\"\">作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003ccode>TapePool\u003c/code>（tpBEM）\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x1a9A9850D597D8e3a03AFae48E3ac8E2D4aeC9d7\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x1a9A9850D597D8e3a03AFae48E3ac8E2D4aeC9d7\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">资金池。您在这里存入 BEM 并获得 tpBEM；这也是添加到钱包的 tpBEM 代币地址。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>AgentFactory\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xA9014E27dD17ea30E4Fa4f71934645b9DCEF8ac8\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xA9014E27dD17ea30E4Fa4f71934645b9DCEF8ac8\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">创建矿机代理。每个矿机代理都是独立的合约，有自己的地址，归一位借款人所有。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigAgent\u003c/code> 实现合约\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x0D4BA9992B2b887ea1f55E59925339547C772259\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x0D4BA9992B2b887ea1f55E59925339547C772259\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">所有矿机代理运行的代码，每个矿机代理都是它的克隆。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>CreditPolicy\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xBBFe498158b6A234f4f63B17673f6e8226656D34\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xBBFe498158b6A234f4f63B17673f6e8226656D34\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">每笔借款都由它对照信用规则电路及其 Solidity 镜像进行核对。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigScreen\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xc2bBc2f2EC90e16f8a9619D26A51144Eb0AC1744\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xc2bBc2f2EC90e16f8a9619D26A51144Eb0AC1744\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">筛查通过记录的登记合约。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>TapeLens\u003c/code>\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xFcc669BC9cCa397CB01804035D5Be981d7389ef2\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xFcc669BC9cCa397CB01804035D5Be981d7389ef2\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">只读辅助合约：一台矿机可借多少，以及借款会因何被拒绝。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">矿机数据源接收合约\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xc94C9Cc912203c29C2c1b3534e0852BF4aFAeA10\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xc94C9Cc912203c29C2c1b3534e0852BF4aFAeA10\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">通过 LayerZero 接收来自 BSC 的矿机数据。已锁定：没有所有者，也没有 LayerZero 委托人。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>X Layer：信用规则电路\u003c/h2>\n\u003cp>信用规则保存在 TapePool 自己的 TapeOut 处理器 “Tape Pool Policy” 中，电路 ID 为 \u003cstrong>1\u003c/strong>（44 个 NAND 门）。详见\u003ca href=\"#credit-rule\">信用规则\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">合约\u003c/th>\u003cth class=\"\">地址\u003c/th>\u003cth class=\"\">作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">“Tape Pool Policy” 的 Circuits 合约\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0xdc76f123838b5398A173D215a2c8338Ad189C9a8\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xdc76f123838b5398A173D215a2c8338Ad189C9a8\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">保存信用规则电路（ID 1）。每笔借款都由 \u003ccode>CreditPolicy\u003c/code> 调用它进行计算。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">“Tape Pool Policy” 的 Transistors 合约\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://www.oklink.com/xlayer/address/0x05264cF3862266165401d3961935D0D230bC8fd6\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0x05264cF3862266165401d3961935D0D230bC8fd6\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">同一处理器的晶体管合约。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>BSC\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">合约\u003c/th>\u003cth class=\"\">地址\u003c/th>\u003cth class=\"\">作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">矿机数据源报告合约\u003c/td>\u003ctd class=\"\">\u003ca class=\"addr\" href=\"https://bscscan.com/address/0xD54673E73448584E86C61f45203ab507F3F2c3eC\" target=\"_blank\" rel=\"noreferrer\">\u003ccode>0xD54673E73448584E86C61f45203ab507F3F2c3eC\u003c/code>\u003c/a>\u003c/td>\u003ctd class=\"\">在 BSC 上读取每台矿机的数据，并把报告发送到 X Layer 上的接收合约。已锁定：没有所有者，也没有 LayerZero 委托人。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>RIG 凭证、BEM 代币和矿机金库是 TapeOut 的合约，不属于 TapePool。详见 \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">TapeOut\u003c/a>。\u003c/p>"}},{"id":"faq","group":"Reference","title":"FAQ","lead":"Short answers to the questions miners and lenders ask most.","body":"\u003ch2>General\u003c/h2>\n\u003cdetails>\u003csummary>Is TapePool an official TapeOut product?\u003c/summary>\u003cdiv>\u003cp>No. TapePool is an independent project built in the TapeOut ecosystem and running on X Layer. It uses TapeOut's rigs, vouchers and circuits.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Is the app live?\u003c/summary>\u003cdiv>\u003cp>Yes. The app is at \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>, the contracts are live on X Layer mainnet and borrowing is open. See \u003ca href=\"#status\">Status and roadmap\u003c/a> and \u003ca href=\"#contracts\">Contract addresses\u003c/a>.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Can a fall in the BEM price get my rig liquidated?\u003c/summary>\u003cdiv>\u003cp>No. The debt is in BEM and repaid in BEM, and there is no price oracle or auction. Only a rig proven impaired on chain can be seized, after a 72-hour window to repay. See \u003ca href=\"#late-and-impaired\">Late loans and impairment\u003c/a>.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Does TapePool promise lenders a return?\u003c/summary>\u003cdiv>\u003cp>No. Lenders receive a share of the fees borrowers actually pay, released over 7 days, and carry the losses the reserve does not cover. Past share-value growth says nothing about the future.\u003c/p>\u003c/div>\u003c/details>\n\u003ch2>Borrowing\u003c/h2>\n\u003cdetails>\u003csummary>Why does my rig need 3 days and a screen pass?\u003c/summary>\u003cdiv>\u003cp>Revocation is the main way a loan can fail. The screen proves the official test vectors cannot revoke the rig, and the age rule is a second line behind it. See \u003ca href=\"#screen\">Revocation screen\u003c/a>.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>What happens if my rig mines less than expected?\u003c/summary>\u003cdiv>\u003cp>Nothing bad. A shortfall at maturity is not a default. The voucher stays in the agent and keeps repaying, and the keeper harvests every 72 hours until the debt is cleared. The late fee is 0 today.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Can I repay early to pay less?\u003c/summary>\u003cdiv>\u003cp>You can repay early at any time, but the flat fee stays the same. It is the whole cost of the advance.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Do I need BNB?\u003c/summary>\u003cdiv>\u003cp>Only if you harvest yourself or push a rig report yourself on BSC. The keeper pushes reports for you, and through December 31, 2026 it pays the LayerZero fees of pushes and scheduled harvests. On X Layer you need OKB for gas.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Why does the advance go to my wallet and not to the agent?\u003c/summary>\u003cdiv>\u003cp>The pool always sends the advance to the agent's borrower, recorded by the factory. Nothing in a call can redirect it.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>I bridged my rig straight to my agent. Is it collateral?\u003c/summary>\u003cdiv>\u003cp>Not yet. A voucher that lands without the hook (bridging mints without it) is not registered. Use \u003cem>Register\u003c/em> on the Rigs page while no loan is open, or take it back. Always bridge to your own wallet first.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>BEM arrived in my agent after I took the voucher back. Is it lost?\u003c/summary>\u003cdiv>\u003cp>No. Use \u003cem>Claim late BEM\u003c/em>; it sends that BEM to you. See \u003ca href=\"#repay\">Repayment and release\u003c/a>.\u003c/p>\u003c/div>\u003c/details>\n\u003ch2>Lending\u003c/h2>\n\u003cdetails>\u003csummary>Why can't I withdraw everything right now?\u003c/summary>\u003cdiv>\u003cp>Withdrawals use idle BEM, the part that is not lent out. Loans repay from mining over 7 or 14 days. At least 30% of the pool stays idle when each loan is made.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>Why are deposits closed?\u003c/summary>\u003cdiv>\u003cp>Either the supply cap is reached, or a loan is flagged and marked doubtful. Deposits reopen when the loan is resolved. Withdrawals stay open.\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>I supplied to an earlier TapePool pool. What now?\u003c/summary>\u003cdiv>\u003cp>Earlier pools are retired but not locked: anyone holding shares in them can still withdraw.\u003c/p>\u003c/div>\u003c/details>","zh":{"group":"参考","title":"常见问题","lead":"矿工和出借人最常问的问题，简短作答。","body":"\u003ch2>综合\u003c/h2>\n\u003cdetails>\u003csummary>TapePool 是 TapeOut 官方产品吗？\u003c/summary>\u003cdiv>\u003cp>不是。TapePool 是一个独立项目，构建于 TapeOut 生态，运行在 X Layer 上，使用 TapeOut 的矿机、凭证和电路。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>应用上线了吗？\u003c/summary>\u003cdiv>\u003cp>已上线。应用地址为 \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>，合约已在 X Layer 主网运行，借款已开放。详见\u003ca href=\"#status\">进展与路线图\u003c/a>和\u003ca href=\"#contracts\">合约地址\u003c/a>。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>BEM 价格下跌会影响我的贷款吗？\u003c/summary>\u003cdiv>\u003cp>不会。债务以 BEM 计价、以 BEM 偿还，无预言机，无拍卖，因此 BEM 价格波动不会触发清算。只有在链上被证明受损的矿机才可能被没收，而且之前有 72 小时补救窗口。详见\u003ca href=\"#late-and-impaired\">逾期贷款与受损矿机\u003c/a>。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>TapePool 向出借人承诺回报吗？\u003c/summary>\u003cdiv>\u003cp>不承诺。出借人分享借款人实际支付的费用（分 7 天释放），并承担损失准备金未能覆盖的损失。过去的份额价值增长不代表未来。\u003c/p>\u003c/div>\u003c/details>\n\u003ch2>借款\u003c/h2>\n\u003cdetails>\u003csummary>为什么矿机需要满 3 天并通过筛查？\u003c/summary>\u003cdiv>\u003cp>被撤销是贷款出问题的主要原因。筛查证明官方测试向量无法撤销这台矿机，年龄要求是它之后的第二道防线。详见\u003ca href=\"#screen\">撤销风险筛查\u003c/a>。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>矿机产出低于预期会怎样？\u003c/summary>\u003cdiv>\u003cp>不会有不利后果。到期时仍有欠款不算违约，凭证留在矿机代理中继续还款，keeper 每 72 小时领取一次，直到债务还清。目前滞纳金为 0。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>提前还款能少付费用吗？\u003c/summary>\u003cdiv>\u003cp>您可以随时提前还款，但固定费用不变。费用就是全部成本，提前还款不会减少费用。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>我需要 BNB 吗？\u003c/summary>\u003cdiv>\u003cp>只有在您自己领取收益或自己在 BSC 上推送矿机报告时才需要。keeper 会替您推送报告；截至 2026 年 12 月 31 日，推送和计划内领取的 LayerZero 费用也由它承担。在 X Layer 上，您需要 OKB 支付 gas。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>为什么借款发放到我的钱包，而不是矿机代理？\u003c/summary>\u003cdiv>\u003cp>资金池始终把借款发放给工厂合约记录的该矿机代理的借款人，任何调用参数都无法更改收款地址。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>我把矿机直接跨链到了矿机代理，它算借款依据吗？\u003c/summary>\u003cdiv>\u003cp>暂时不算。跨链铸造凭证时不会触发登记，所以这张凭证处于未登记状态。请在没有进行中贷款时，在矿机页面上使用\u003cem>登记凭证\u003c/em>，或把它取回。请始终先跨链到自己的钱包。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>取回凭证后，矿机代理里又到账了 BEM，会丢失吗？\u003c/summary>\u003cdiv>\u003cp>不会。使用\u003cem>领取迟到的 BEM\u003c/em> 即可转给您。详见\u003ca href=\"#repay\">还款与取回凭证\u003c/a>。\u003c/p>\u003c/div>\u003c/details>\n\u003ch2>出借\u003c/h2>\n\u003cdetails>\u003csummary>为什么我不能立即提取全部金额？\u003c/summary>\u003cdiv>\u003cp>提款由未借出的 BEM 支付。贷款依靠挖矿产出在 7 天或 14 天内偿还。每笔贷款发放时，资金池至少保持 30% 闲置。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>为什么存款关闭了？\u003c/summary>\u003cdiv>\u003cp>要么达到了供应上限，要么有贷款被标记并记为存疑。贷款处理完毕后存款会重新开放，提取始终开放。\u003c/p>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>我曾在早期的 TapePool 资金池存款，现在怎么办？\u003c/summary>\u003cdiv>\u003cp>早期资金池已停用但没有锁定：仍持有份额的用户可以照常提取。\u003c/p>\u003c/div>\u003c/details>"}},{"id":"glossary","group":"Reference","title":"Glossary","lead":"The words these docs and the app use.","body":"\u003cdl class=\"glossary\">\n\u003cdt>Advance\u003c/dt>\u003cdd>The BEM a borrower receives. Also called the principal.\u003c/dd>\n\u003cdt>Backstop\u003c/dt>\u003cdd>The address holding the owner's seed shares, fixed at deploy. Total lending can never exceed the value of those shares.\u003c/dd>\n\u003cdt>Base power\u003c/dt>\u003cdd>A rig's verified weight without its design bonus. The only power TapePool lends against.\u003c/dd>\n\u003cdt>BEM\u003c/dt>\u003cdd>The token TapeOut rigs mine on BSC. On X Layer, a bridged version (an OFT with 8 decimals) is the pool's asset.\u003c/dd>\n\u003cdt>Bridge fee\u003c/dt>\u003cdd>0.5% of harvested BEM, kept by the BEM bridge when it reaches X Layer.\u003c/dd>\n\u003cdt>Credit rule\u003c/dt>\u003cdd>The public TapeOut circuit (Tape Pool Policy, circuit ID 1) that decides whether an advance is allowed. See \u003ca href=\"#credit-rule\">The credit rule\u003c/a>.\u003c/dd>\n\u003cdt>Cure window\u003c/dt>\u003cdd>The 72 hours after a flag in which the borrower can repay in full and keep the rigs.\u003c/dd>\n\u003cdt>Debt\u003c/dt>\u003cdd>Advance plus flat fee (plus any late fee). The cap of 85% or 80% applies to the whole debt.\u003c/dd>\n\u003cdt>Debt bucket\u003c/dt>\u003cdd>The debt as a share of expected output in 5% steps, as the circuit reads it.\u003c/dd>\n\u003cdt>Design bonus\u003c/dt>\u003cdd>Extra weight a rig gets for its design. Usually lost within hours, so it never counts toward a loan.\u003c/dd>\n\u003cdt>Doubtful\u003c/dt>\u003cdd>The remaining principal of a flagged loan, removed from the share value until the loan is resolved.\u003c/dd>\n\u003cdt>Expected base output\u003c/dt>\u003cdd>What a rig's base power is expected to mine over the term, after network growth and the bridge fee. See \u003ca href=\"#terms\">Terms and fees\u003c/a>.\u003c/dd>\n\u003cdt>Flag\u003c/dt>\u003cdd>A call, open to anyone, that marks a loan whose rig is proven impaired on chain. Starts the cure window.\u003c/dd>\n\u003cdt>Guardian\u003c/dt>\u003cdd>The keeper's key, which can pull three brakes and nothing else.\u003c/dd>\n\u003cdt>H\u003c/dt>\u003cdd>The unit of rig power.\u003c/dd>\n\u003cdt>Harvest\u003c/dt>\u003cdd>The BSC call that collects a rig's mined BEM and bridges it to whoever held the voucher when the harvest was sent.\u003c/dd>\n\u003cdt>Idle BEM\u003c/dt>\u003cdd>BEM in the pool that is not lent out and not in the reserve. Withdrawals and advances come from it.\u003c/dd>\n\u003cdt>Impaired\u003c/dt>\u003cdd>A rig that is revoked, stopped, rescued, out of the vault's custody or without base power, as shown by on-chain evidence.\u003c/dd>\n\u003cdt>Keeper\u003c/dt>\u003cdd>The team's off-chain bot: harvests, sweeps, report pushes and flags. Holds gas only.\u003c/dd>\n\u003cdt>LayerZero\u003c/dt>\u003cdd>The cross-chain messaging system that carries rig reports and the BEM bridge between BSC and X Layer.\u003c/dd>\n\u003cdt>Loss reserve\u003c/dt>\u003cdd>20% of each fee, up to 5% of pool assets, kept to absorb write-offs.\u003c/dd>\n\u003cdt>Maturity\u003c/dt>\u003cdd>Start of the loan plus 7 or 14 days. Derived from the term, never chosen by the borrower.\u003c/dd>\n\u003cdt>OKB\u003c/dt>\u003cdd>X Layer's gas token.\u003c/dd>\n\u003cdt>PodMining\u003c/dt>\u003cdd>TapeOut's mining contract on BSC. It verifies rigs and can revoke one through a challenge with an official test vector.\u003c/dd>\n\u003cdt>Release\u003c/dt>\u003cdd>The borrower-only call that returns the vouchers to the borrower's wallet once the debt is zero.\u003c/dd>\n\u003cdt>Rig\u003c/dt>\u003cdd>A TapeOut circuit that mines BEM on BSC.\u003c/dd>\n\u003cdt>Rig Agent\u003c/dt>\u003cdd>A small contract owned by one borrower that holds vouchers, carries one loan and passes harvests to the pool.\u003c/dd>\n\u003cdt>RIG voucher\u003c/dt>\u003cdd>The ERC-721 token on X Layer that stands for a bridged rig. Its holder receives the rig's harvests.\u003c/dd>\n\u003cdt>Screen pass\u003c/dt>\u003cdd>The owner's on-chain record that a rig matches every official test vector of its task. Counts 48 hours after it is recorded.\u003c/dd>\n\u003cdt>Seize\u003c/dt>\u003cdd>After the cure window, the call that moves a loan's vouchers to the pool, with evidence the rig is still impaired.\u003c/dd>\n\u003cdt>Sweep\u003c/dt>\u003cdd>The permissionless call that moves an agent's BEM into the pool: late fee, flat fee, then principal.\u003c/dd>\n\u003cdt>TapeOut Safe\u003c/dt>\u003cdd>TapeOut's 3-of-5 multisig, which can upgrade the vouchers and the rig vault and rescue a rig.\u003c/dd>\n\u003cdt>tpBEM\u003c/dt>\u003cdd>The pool's share token (ERC-4626, 14 decimals). Its value in BEM grows with fees paid.\u003c/dd>\n\u003cdt>X Layer\u003c/dt>\u003cdd>OKX's EVM network (chain 196) where the pool, the agents and the credit rule live.\u003c/dd>\n\u003c/dl>","zh":{"group":"参考","title":"术语表","lead":"本文档和应用中使用的术语。","body":"\u003cdl class=\"glossary\">\n\u003cdt>借款金额（advance）\u003c/dt>\u003cdd>借款人收到的 BEM，也称本金。\u003c/dd>\n\u003cdt>兜底份额（backstop）\u003c/dt>\u003cdd>持有所有者种子份额的地址，部署时固定。借出总额永远不能超过这部分份额的价值。\u003c/dd>\n\u003cdt>基础算力（base power）\u003c/dt>\u003cdd>矿机去掉设计加成后的已验证权重。TapePool 只按基础算力计算借款额度。\u003c/dd>\n\u003cdt>BEM\u003c/dt>\u003cdd>TapeOut 矿机在 BSC 上挖出的代币。在 X Layer 上，资金池的资产是跨链后的版本（OFT，8 位小数）。\u003c/dd>\n\u003cdt>跨链费\u003c/dt>\u003cdd>领取的 BEM 到达 X Layer 时，由 BEM 跨链桥扣除的 0.5%。\u003c/dd>\n\u003cdt>信用规则（credit rule）\u003c/dt>\u003cdd>判定借款能否发放的公开 TapeOut 电路（Tape Pool Policy，电路 ID 1）。详见\u003ca href=\"#credit-rule\">信用规则\u003c/a>。\u003c/dd>\n\u003cdt>补救窗口（cure window）\u003c/dt>\u003cdd>贷款被标记后的 72 小时，借款人可在此期间全额还款并保住矿机。\u003c/dd>\n\u003cdt>债务（debt）\u003c/dt>\u003cdd>借款金额加固定费用（以及可能产生的滞纳金）。85% 或 80% 的上限针对整笔债务。\u003c/dd>\n\u003cdt>债务分档\u003c/dt>\u003cdd>电路读取的债务占预期产出比例，每档 5%。\u003c/dd>\n\u003cdt>设计加成（design bonus）\u003c/dt>\u003cdd>矿机因设计获得的额外权重，通常不到一天就会消失，因此从不计入借款额度。\u003c/dd>\n\u003cdt>存疑（doubtful）\u003c/dt>\u003cdd>被标记贷款的剩余本金，在贷款处理完毕前从份额价值中扣除。\u003c/dd>\n\u003cdt>预期基础产出\u003c/dt>\u003cdd>矿机的基础算力在期限内预计挖出的 BEM，已计入全网增长和跨链费。详见\u003ca href=\"#terms\">借贷条款与费用\u003c/a>。\u003c/dd>\n\u003cdt>标记（flag）\u003c/dt>\u003cdd>任何人都可以调用的操作，用于标记矿机在链上被证明受损的贷款，并开始补救窗口。\u003c/dd>\n\u003cdt>守护者（guardian）\u003c/dt>\u003cdd>keeper 的密钥，只能拉下三个制动，别无其他权限。\u003c/dd>\n\u003cdt>H\u003c/dt>\u003cdd>矿机算力的单位。\u003c/dd>\n\u003cdt>领取收益（harvest）\u003c/dt>\u003cdd>BSC 上的操作：收集矿机挖出的 BEM，并跨链支付给发起领取时的凭证持有人。\u003c/dd>\n\u003cdt>闲置 BEM\u003c/dt>\u003cdd>资金池中既未借出、也不在准备金中的 BEM。提款和借款都从这里支付。\u003c/dd>\n\u003cdt>受损矿机（impaired）\u003c/dt>\u003cdd>链上证据显示被撤销、已停止、被强制取回、不在金库托管中或没有基础算力的矿机。\u003c/dd>\n\u003cdt>keeper\u003c/dt>\u003cdd>团队运行的链下机器人，负责领取收益、归集、推送报告和标记，只持有 gas。\u003c/dd>\n\u003cdt>LayerZero\u003c/dt>\u003cdd>在 BSC 与 X Layer 之间传递矿机报告和 BEM 跨链的跨链消息系统。\u003c/dd>\n\u003cdt>损失准备金（loss reserve）\u003c/dt>\u003cdd>每笔费用的 20%，上限为资金池资产的 5%，用于承担核销损失。\u003c/dd>\n\u003cdt>到期时间（maturity）\u003c/dt>\u003cdd>借款时间加 7 天或 14 天，由期限决定，借款人不能自选。\u003c/dd>\n\u003cdt>OKB\u003c/dt>\u003cdd>X Layer 的 gas 代币。\u003c/dd>\n\u003cdt>PodMining\u003c/dt>\u003cdd>TapeOut 在 BSC 上的挖矿合约。它验证矿机，并可以用官方测试向量发起 challenge 撤销矿机。\u003c/dd>\n\u003cdt>取回凭证（release）\u003c/dt>\u003cdd>只有借款人可以调用的操作：债务为零后，把凭证转回借款人的钱包。\u003c/dd>\n\u003cdt>矿机（rig）\u003c/dt>\u003cdd>在 BSC 上挖 BEM 的 TapeOut 电路。\u003c/dd>\n\u003cdt>矿机代理（Rig Agent）\u003c/dt>\u003cdd>归属于一位借款人的小型合约：持有凭证、承载一笔贷款，并把领取的收益转给资金池。\u003c/dd>\n\u003cdt>RIG 凭证\u003c/dt>\u003cdd>代表已跨链矿机的 ERC-721 代币（NFT），位于 X Layer 上。持有人接收该矿机领取的收益。\u003c/dd>\n\u003cdt>筛查通过记录（screen pass）\u003c/dt>\u003cdd>所有者在链上登记的记录，表明矿机与其任务的全部官方测试向量一致，登记 48 小时后生效。\u003c/dd>\n\u003cdt>没收（seize）\u003c/dt>\u003cdd>补救窗口结束后，凭矿机仍然受损的证据，把这笔贷款的凭证转入资金池的操作。\u003c/dd>\n\u003cdt>归集（sweep）\u003c/dt>\u003cdd>无需许可的操作：把矿机代理中的 BEM 转入资金池，依次支付滞纳金、固定费用和本金。\u003c/dd>\n\u003cdt>TapeOut 多签\u003c/dt>\u003cdd>TapeOut 的 3/5 多签，可以升级凭证和矿机金库，也可以强制取回矿机。\u003c/dd>\n\u003cdt>tpBEM\u003c/dt>\u003cdd>资金池的份额代币（ERC-4626，14 位小数），以 BEM 计的价值随已支付的费用增长。\u003c/dd>\n\u003cdt>X Layer\u003c/dt>\u003cdd>OKX 的 EVM 网络（链 ID 196），资金池、矿机代理和信用规则都运行在这里。\u003c/dd>\n\u003c/dl>"}}];

function render(force) {

  article.querySelectorAll('h2').forEach((h, i) => { h.id = p.id + '-' + i; const a = document.createElement('a'); a.href = '#' + p.id + '/' + i; a.textContent = h.textContent; toc.append(a); });
  article.querySelectorAll('figure img').forEach((img) => { img.loading = 'lazy'; img.decoding = 'async'; img.tabIndex = 0; img.title = t.zoom; });
  nav.querySelectorAll('a').forEach((a) => a.dataset.page === p.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const i = pages.indexOf(p);
  $('pager').innerHTML = (i > 0 ? `<a href="#${pages[i - 1].id}"><small>${t.prev}</small>${view(pages[i - 1]).title}</a>` : '<span></span>') + (i < pages.length - 1 ? `<a class="next" href="#${pages[i + 1].id}"><small>${t.next}</small>${view(pages[i + 1]).title}</a>` : '<span></span>');
  closeMenu();
  if (anchor !== undefined && /^\d+$/.test(anchor)) requestAnimationFrame(() => $(p.id + '-' + anchor)?.scrollIntoView());
  else if (changed && !force) window.scrollTo(0, 0);
  if (changed) $('content').focus({ preventScroll: true });
  $('copy').textContent = t.copy;
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem('tp-lang', l === 'zh' ? 'cn' : 'en'); } catch {}
  const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u);
  paintChrome(); render(true);
}
document.querySelectorAll('.lang-switch button').forEach((b) => { b.onclick = () => setLang(b.dataset.lang); });
paintChrome();
window.addEventListener('hashchange', () => render()); render();
document.querySelector('.skip').onclick = (e) => { e.preventDefault(); $('content').focus(); $('content').scrollIntoView(); };
$('menu').onclick = () => { const open = document.body.classList.toggle('menu-open'); $('menu').setAttribute('aria-expanded', String(open)); };
$('scrim').onclick = closeMenu;
// search (in the current language)
function search() {
  const q = input.value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const matches = searchIndex().filter((p) => { const hay = (p.title + ' ' + p.lead + ' ' + p.plain).toLowerCase(); return words.every((w) => hay.includes(w)); });
  const results = $('results'); results.replaceChildren();
  if (!matches.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = T().noResults(input.value.trim()); results.append(e); return; }
  matches.forEach((p) => {
    const a = document.createElement('a'); a.className = 'result'; a.href = '#' + p.id;
    const g = document.createElement('small'); g.textContent = p.group;
    const t = document.createElement('strong'); t.textContent = p.title;
    const x = document.createElement('p'); const pos = words.length ? p.plain.toLowerCase().indexOf(words[0]) : -1;
    x.textContent = pos >= 0 ? (pos > 40 ? '…' : '') + p.plain.slice(Math.max(0, pos - 40), pos + 150).trim() + '…' : p.lead;
    a.append(g, t, x); a.onclick = () => { dialog.close(); if (current.id === p.id) render(); }; results.append(a);
  });
}
function openSearch() { dialog.showModal(); input.value = ''; search(); input.focus(); }
$('search-open').onclick = openSearch; $('search-close').onclick = () => dialog.close();
input.addEventListener('input', search);
input.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); document.querySelector('.result')?.focus(); } if (e.key === 'Enter' && !e.isComposing) document.querySelector('.result')?.click(); });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); dialog.open ? dialog.close() : openSearch(); } if (e.key === 'Escape') closeMenu(); });
for (const d of [dialog, $('zoom-dialog')]) d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
// image zoom
const zoom = $('zoom-dialog');
function openZoom(img) { $('zoom-img').src = img.currentSrc || img.src; $('zoom-img').alt = img.alt; zoom.showModal(); }
article.addEventListener('click', (e) => { const img = e.target.closest('figure img'); if (img) openZoom(img); });
article.addEventListener('keydown', (e) => { const img = e.target.closest?.('figure img'); if (img && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openZoom(img); } });
$('zoom-close').onclick = () => zoom.close();
// copy page as text
$('copy').onclick = async () => {
  const b = $('copy'), v = view(current), t = T(); const text = v.title + '\n\n' + v.lead + '\n\n' + textOf(v.body.replace(/<\/(p|li|h2|h3|tr|figcaption|dd|summary)>/g, '</$1>\n\n'));
  try { await navigator.clipboard.writeText(text); b.textContent = t.copied; }
  catch { const r = document.createRange(); r.selectNodeContents(article); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = t.selected; }
  setTimeout(() => { b.textContent = T().copy; }, 2200);
};
