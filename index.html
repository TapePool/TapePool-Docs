<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Documentation for TapePool, the BEM lending pool on X Layer for TapeOut miners: how lending and borrowing work, the public credit-rule circuit, terms and fees, repayment, risks and who can change what. English and 中文.">
<meta name="color-scheme" content="light dark">
<title>TapePool Docs</title>
<script>
// Theme and language before first paint. Language: ?lang=zh|en, then the saved choice ('tp-lang', the key the
// TapePool app and landing use too), then the browser languages (the first zh-* before any en-* selects Chinese).
try{const t=localStorage.getItem('tapepool-docs-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}
// The app stores Chinese as 'cn'; the landing links use ?lang=zh. Both are accepted.
(function(){const norm=(v)=>v==='zh'||v==='cn'?'zh':v==='en'?'en':null;let l=norm(new URLSearchParams(location.search).get('lang'));if(!l){try{l=norm(localStorage.getItem('tp-lang'))}catch{}}
if(!l){l='en';for(const x of navigator.languages||[navigator.language||'']){const s=String(x).toLowerCase();if(s.startsWith('zh')){l='zh';break}if(s.startsWith('en'))break}}
document.documentElement.lang=l==='zh'?'zh-CN':'en';document.documentElement.dataset.lang=l})();
</script>
<style>
/* TapePool Docs. Brand: Tape Navy #1B2B54, Deep Navy #15234A, Pool Blue #2E9BDA (graphics and large type only on light). */
@font-face{font-family:Sora;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/sora-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}

:root{
  --header:64px;
  /* the centered frame: sidebar, article and contents rail share it; the gutter is the empty space on each side */
  --frame:1480px;
  --gutter:max(0px,calc((100vw - var(--frame)) / 2));
  --bg:#ffffff;--panel:#f5f8fc;--raised:#edf2f8;--line:#dbe3ee;
  --text:#1f2a44;--strong:#1b2b54;--muted:#5a6784;
  --accent:#1a6aa3;--pool:#2e9bda;--tint:#e9f4fb;--tint-line:#bfdcf0;
  --warn:#8a5a12;--warn-bg:#fdf5e6;--warn-line:#efd7a6;
  --danger:#a52a22;--danger-bg:#fdeeee;--danger-line:#f0c2be;
  --ok:#17784a;--ok-bg:#e8f6ee;
  --shadow:0 1px 2px rgba(27,43,84,.06),0 6px 24px rgba(27,43,84,.06);
  /* the app's blueprint grid: an 80px major and a 16px minor grid */
  --grid-major:rgba(27,43,84,.065);--grid-minor:rgba(27,43,84,.028);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0b1530;--panel:#0f1a3a;--raised:#142247;--line:#22335e;
    --text:#dfe6f3;--strong:#f3f6fc;--muted:#97a6c6;
    --accent:#62bdf0;--pool:#2e9bda;--tint:#10284a;--tint-line:#1e4a78;
    --warn:#f0c77d;--warn-bg:#2a2414;--warn-line:#5a4a22;
    --danger:#ff9b93;--danger-bg:#2e1518;--danger-line:#6a2a2e;
    --ok:#5fd59a;--ok-bg:#0f2a22;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
    --grid-major:rgba(111,195,236,.075);--grid-minor:rgba(111,195,236,.03);
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0b1530;--panel:#0f1a3a;--raised:#142247;--line:#22335e;
  --text:#dfe6f3;--strong:#f3f6fc;--muted:#97a6c6;
  --accent:#62bdf0;--pool:#2e9bda;--tint:#10284a;--tint-line:#1e4a78;
  --warn:#f0c77d;--warn-bg:#2a2414;--warn-line:#5a4a22;
  --danger:#ff9b93;--danger-bg:#2e1518;--danger-line:#6a2a2e;
  --ok:#5fd59a;--ok-bg:#0f2a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  --grid-major:rgba(111,195,236,.075);--grid-minor:rgba(111,195,236,.03);
  color-scheme:dark;
}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo-dark{display:block}:root:not([data-theme=light]) .logo-light{display:none}}
:root[data-theme=dark] .logo-dark{display:block}:root[data-theme=dark] .logo-light{display:none}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--text);font:15.5px/1.75 Sora,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
/* the app's grid, fixed to the viewport, so the page, the header and the sidebar draw the same lines */
body,.topbar,.sidebar{background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px;background-position:-1px -1px;background-attachment:fixed}
button,input{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
code,kbd,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{font-size:.86em;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}

/* header */
.topbar{height:var(--header);position:fixed;inset:0 0 auto;z-index:30;background-color:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 calc(var(--gutter) + 24px);gap:16px}
.brand{display:flex;align-items:center;gap:12px;color:var(--strong)}
.brand:hover{text-decoration:none}
.brand .logo{height:32px;width:auto}
.brand small{font-size:14px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;font-weight:400}
.header-end{margin-left:auto;display:flex;align-items:center;gap:10px}
.control{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;line-height:1.4}
.control:hover{border-color:var(--muted);color:var(--strong)}
.search-open{width:240px;display:flex;align-items:center;gap:8px;text-align:left}
.search-open .search-label{flex:1}
.mobile-menu{width:34px;height:32px;padding:0;place-items:center}
kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:var(--bg)}
.mobile-menu{display:none}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
.lang-switch button{border:0;background:none;color:var(--muted);font-size:13px;line-height:1.4;padding:4px 10px;border-radius:6px}
.lang-switch button:hover{color:var(--strong)}
.lang-switch button[aria-pressed=true]{background:var(--tint);color:var(--strong);font-weight:600}
.theme-button{width:34px;height:32px;padding:0;display:inline-grid;place-items:center}
a.badge:hover{text-decoration:none;border-color:var(--pool)}
.addr code{font-size:12.5px;white-space:nowrap;overflow-wrap:normal}
.table-wrap:has(.addr) td{min-width:140px}
.addr:hover{text-decoration:none}.addr:hover code{border-color:var(--pool)}
.launch{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600;white-space:nowrap}
.launch:hover{background:var(--accent);border-color:var(--strong);color:var(--bg);text-decoration:none}
.theme-icon{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
:root[data-lang=zh] body{font-family:Sora,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif}
:root[data-lang=zh] article{line-height:1.85}
:root[data-lang=zh] em{font-style:normal;font-weight:600;color:var(--strong)}
:root[data-lang=zh] .breadcrumb,:root[data-lang=zh] .nav-group h2,:root[data-lang=zh] .toc b{letter-spacing:.4px}
.skip{position:fixed;top:-60px;left:15px;background:var(--accent);color:var(--bg);padding:9px 16px;z-index:100;border-radius:6px}
.skip:focus{top:8px}

/* sidebar */
.sidebar{position:fixed;top:var(--header);bottom:0;left:var(--gutter);width:280px;padding:26px 18px 18px;border-right:1px solid var(--line);background-color:var(--bg);z-index:20;display:flex;flex-direction:column}
.nav-scroll{overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-right:4px}
.nav-group{margin-bottom:22px}
.nav-group h2{margin:0 0 6px;padding:0 10px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav-group a{display:block;padding:5px 10px;margin:1px 0;border-radius:7px;color:var(--text);font-size:14px;line-height:1.45;border-left:2px solid transparent}
.nav-group a:hover{background:var(--panel);text-decoration:none;color:var(--strong)}
.nav-group a[aria-current=page]{background:var(--tint);color:var(--strong);font-weight:600;border-left-color:var(--pool)}
.sidebar-foot{border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.foot-title{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.external-link{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;color:var(--text)}
.sidebar-foot .edition{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}
.scrim{display:none}

/* layout */
.shell{padding:var(--header) calc(var(--gutter) + 24px) 0 calc(var(--gutter) + 280px);display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:40px}
main{width:100%;max-width:844px;justify-self:center;padding:36px 32px 60px;min-width:0;outline:none}
.article-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.breadcrumb{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--pool);font-weight:600}
article{max-width:780px}
article h1{font-size:34px;line-height:1.2;letter-spacing:-.6px;color:var(--strong);margin:4px 0 12px;font-weight:600}
.lead{font-size:18px;line-height:1.6;color:var(--muted);margin:0 0 28px}
article h2{font-size:22px;letter-spacing:-.3px;color:var(--strong);margin:44px 0 12px;padding-top:4px;font-weight:600}
article h3{font-size:16.5px;color:var(--strong);margin:28px 0 8px;font-weight:600}
article p{margin:0 0 16px}
article ul,article ol{padding-left:22px;margin:0 0 18px}
article li{margin:5px 0}
article li::marker{color:var(--muted)}
strong{color:var(--strong);font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}

/* tables */
.table-wrap{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel);color:var(--strong);font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;white-space:nowrap}
.source{font-size:12.5px;color:var(--muted);margin:-12px 0 20px}

/* callouts */
.note,.warn,.danger,.ok{border:1px solid var(--tint-line);background:var(--tint);border-radius:10px;padding:14px 16px;margin:18px 0 22px;font-size:14.5px}
.note>:last-child,.warn>:last-child,.danger>:last-child,.ok>:last-child{margin-bottom:0}
.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.warn strong:first-child{color:var(--warn)}
.danger{border-color:var(--danger-line);background:var(--danger-bg)}
.danger strong:first-child{color:var(--danger)}
.ok{border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:var(--ok-bg)}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--panel)}
.badge.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}
.badge.soon{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.badge.plan{color:var(--accent);border-color:var(--tint-line);background:var(--tint)}
.tag{display:inline-block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;border-radius:5px;padding:1px 7px;vertical-align:1px;white-space:nowrap}
.tag.live{color:var(--ok);background:var(--ok-bg)}
.tag.soon{color:var(--warn);background:var(--warn-bg)}
.tag.plan{color:var(--accent);background:var(--tint)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 26px}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel);color:var(--text);transition:border-color .15s,transform .15s}
.card:hover{text-decoration:none;border-color:var(--pool);transform:translateY(-1px)}
.card strong{display:block;font-size:15.5px;margin-bottom:4px}
.card p{margin:0 0 8px;font-size:14px;color:var(--muted);line-height:1.55}
.card small{color:var(--accent);font-weight:600;font-size:13px}

/* steps */
ol.steps{list-style:none;counter-reset:s;padding:0;margin:18px 0 24px}
ol.steps>li{counter-increment:s;position:relative;padding:2px 0 14px 46px;margin:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--tint);border:1px solid var(--tint-line);color:var(--accent);font:600 13px/28px "JetBrains Mono",monospace;text-align:center}
ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1px;background:var(--line)}
ol.steps>li>strong:first-child{display:block;margin-bottom:2px}

/* video */
.video{position:relative;aspect-ratio:16/9;margin:18px 0 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* figures */
figure{margin:22px 0 28px}
figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:zoom-in;background:var(--panel)}
figure.narrow img{max-width:min(100%,480px)}
figure.medium img{max-width:min(100%,620px)}
figcaption{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.55}
figcaption .sample{display:inline-block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pair figure{margin:0}

/* formulas */
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;margin:14px 0 20px}
pre code{background:none;border:0;padding:0;font-size:inherit}

/* definitions */
dl.glossary{margin:10px 0 24px}
dl.glossary dt{font-weight:600;color:var(--strong);margin-top:16px}
dl.glossary dd{margin:3px 0 0;color:var(--text)}

/* faq */
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}
details summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--strong);list-style:none;position:relative;padding-right:40px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";position:absolute;right:16px;top:9px;font-size:20px;color:var(--muted)}
details[open] summary::after{content:"−"}
details>div{padding:0 16px 6px}

/* pager, toc, footer */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:780px;margin-top:48px}
.pager a{border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--strong);font-weight:600;font-size:14.5px}
.pager a:hover{border-color:var(--pool);text-decoration:none}
.pager a.next{text-align:right}
.pager small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.updated{max-width:780px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
.toc{position:sticky;top:calc(var(--header) + 32px);align-self:start;padding-top:40px;font-size:13px;max-height:calc(100vh - var(--header) - 40px);overflow:auto}
.toc b{display:block;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.toc nav a{display:block;color:var(--muted);padding:4px 0 4px 10px;border-left:1px solid var(--line);line-height:1.45}
.toc nav a:hover{color:var(--strong);border-left-color:var(--pool);text-decoration:none}
.toc-note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.toc-note span{display:block}
.toc-note .toc-note-body{color:var(--text);margin:2px 0 4px}

/* search dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--bg);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,32,.55);backdrop-filter:blur(2px)}
#search-dialog{width:min(640px,calc(100vw - 32px));margin-top:10vh}
.search-head{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.search-head input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel);outline:none}
.search-head input:focus{border-color:var(--pool)}
.results{max-height:55vh;overflow:auto;padding:8px}
.result{display:block;padding:10px 12px;border-radius:8px;color:var(--text)}
.result:hover,.result:focus{background:var(--panel);text-decoration:none;outline:none}
.result small{color:var(--pool);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.result strong{display:block}
.result p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.empty{padding:14px;color:var(--muted)}
.search-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--muted)}
#zoom-dialog{max-width:min(1400px,96vw);max-height:94vh;background:var(--panel);padding:10px}
#zoom-dialog img{display:block;max-width:100%;max-height:calc(94vh - 70px);margin:0 auto;border-radius:8px}
.zoom-close{display:block;margin:0 0 8px auto}

/* responsive */
@media (min-width:1480px){.sidebar{border-right-color:transparent}}
@media (max-width:1180px){.shell{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:900px){
  .mobile-menu{display:inline-grid}
  .sidebar{transform:translateX(-100%);transition:transform .2s;width:290px;z-index:40}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,14,32,.5);z-index:35;border:0}
  .sidebar{left:0}
  .shell{padding:var(--header) 0 0}
  main{max-width:none;padding:26px 16px 50px}
  .search-open{width:auto}.search-open kbd{display:none}
  .brand small{display:none}
  .topbar{padding:0 14px;gap:10px}
}
@media (max-width:640px){
  article h1{font-size:27px}.lead{font-size:16.5px}
  .cards,.pair,.pager{grid-template-columns:1fr}
  .search-open{width:34px;height:32px;padding:0;justify-content:center}.search-open .search-label{display:none}
  .topbar{gap:8px}.header-end{gap:6px}.brand .logo{height:26px}.launch{display:none}
  .lang-switch button{padding:4px 8px;white-space:nowrap}
  th,td{padding:8px 10px}
}
@media print{.topbar,.sidebar,.toc,.pager,.article-top,.skip{display:none}.shell{margin:0;padding:0;display:block}main{padding:0;max-width:none}}

</style>
</head>
<body>
<a class="skip" href="#content" data-i18n="skip">Skip to content</a>
<header class="topbar">
  <button class="control mobile-menu" id="menu" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>

<script>
const pages = [{"id":"overview","group":"Start here","title":"TapePool","nav":"Overview","lead":"A BEM lending pool on X Layer for TapeOut miners. Bridge your rig to X Layer and borrow against what it will mine.","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge live\">X Layer mainnet\u003c/span>\u003cspan class=\"badge\">BEM · tpBEM\u003c/span>\u003cspan class=\"badge\">7- and 14-day terms\u003c/span>\u003cspan class=\"badge\">Credit rule on a TapeOut circuit\u003c/span>\u003c/div>\n\u003cp>\u003cstrong>TapePool is a lending pool built in the TapeOut ecosystem and running on X Layer.\u003c/strong> Lenders deposit BEM. Miners who bridged a TapeOut rig to X Layer borrow BEM against the output that rig is expected to mine, and the rig repays the loan by itself while it mines. The app is at \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Lenders\u003c/strong> deposit BEM and receive \u003cstrong>tpBEM\u003c/strong>, an ERC-4626 share. Its value grows as borrowers pay fees.\u003c/li>\n\u003cli>\u003cstrong>Borrowers\u003c/strong> move a rig's RIG voucher into their own \u003cstrong>Rig Agent\u003c/strong> contract and take a BEM advance for 7 or 14 days.\u003c/li>\n\u003cli>\u003cstrong>Repayment is automatic.\u003c/strong> While the agent holds the voucher, every harvest of the rig pays its BEM to the agent, and anyone can sweep that BEM into the pool: the fee first, then the principal. When the debt is cleared, the borrower takes the voucher back.\u003c/li>\n\u003cli>\u003cstrong>The credit rule is a public TapeOut circuit.\u003c/strong> Whether an advance is allowed is decided by a NAND circuit taped out on X Layer and evaluated on chain. Anyone can read and verify the rule, and no one can change it quietly.\u003c/li>\n\u003cli>\u003cstrong>A BEM price drop never triggers liquidation.\u003c/strong> The debt is in BEM and is repaid in BEM. There is no price oracle and no auction. A slow rig is never seized; only a rig proven impaired on chain (revoked, stopped, rescued or with no base power) can be, after a 72-hour window to repay. See \u003ca href=\"#late-and-impaired\">Late loans and impairment\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/loan-flow.png\" alt=\"Diagram: a rig on BSC mines BEM; its RIG voucher sits in the Rig Agent on X Layer; the credit rule allows the advance; harvests pay BEM into the agent, which is swept into the pool; at debt zero the voucher goes back to the miner.\">\u003cfigcaption>How a loan works: the rig mines on BSC, the loan lives on X Layer.\u003c/figcaption>\u003c/figure>\n\u003ch2>Start with the essentials\u003c/h2>\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"#how-it-works\">\u003cstrong>How it works\u003c/strong>\u003cp>The roles, the two chains and the loop from voucher to repayment.\u003c/p>\u003csmall>Read the overview\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#supply\">\u003cstrong>Lend BEM\u003c/strong>\u003cp>Supply BEM, receive tpBEM, and withdraw idle BEM at any time.\u003c/p>\u003csmall>For lenders\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#borrow\">\u003cstrong>Borrow against a rig\u003c/strong>\u003cp>Every step of a first advance, from a ready rig to the borrow transaction.\u003c/p>\u003csmall>For miners\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#terms\">\u003cstrong>Terms and fees\u003c/strong>\u003cp>Debt caps, the flat fee, minimums and worked examples.\u003c/p>\u003csmall>Know the numbers\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#risks\">\u003cstrong>Risks\u003c/strong>\u003cp>What can go wrong for lenders and borrowers, and who can change what.\u003c/p>\u003csmall>Read before you deposit\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#status\">\u003cstrong>Status and roadmap\u003c/strong>\u003cp>What runs on mainnet today and what is still coming.\u003c/p>\u003csmall>See where we are\u003c/small>\u003c/a>\n\u003c/div>\n\u003ch2>Who it is for\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">You are\u003c/th>\u003cth class=\"\">What TapePool gives you\u003c/th>\u003cth class=\"\">Start here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">A TapeOut miner with a rig bridged to X Layer\u003c/td>\u003ctd class=\"\">BEM now, against what the rig will mine over 7 or 14 days. The rig keeps mining and repays the loan.\u003c/td>\u003ctd class=\"\">\u003ca href=\"#eligibility\">Is my rig eligible?\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A BEM holder on X Layer\u003c/td>\u003ctd class=\"\">A share of the fees miners pay, through tpBEM.\u003c/td>\u003ctd class=\"\">\u003ca href=\"#supply\">Supply and withdraw\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Anyone\u003c/td>\u003ctd class=\"\">A public credit rule you can verify, and permissionless repayment calls you can run yourself.\u003c/td>\u003ctd class=\"\">\u003ca href=\"#credit-rule\">The credit rule\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"warn\">TapePool is new software. Read \u003ca href=\"#risks\">Risks\u003c/a> before you supply or borrow, and check TapePool's contracts against \u003ca href=\"#contracts\">Contract addresses\u003c/a>. Nothing in these docs is financial advice.\u003c/div>","zh":{"group":"快速开始","title":"TapePool","nav":"概述","lead":"X Layer 上面向 TapeOut 矿工的 BEM 借贷池。将矿机跨链到 X Layer，以它未来的挖矿产出借款。","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge live\">X Layer 主网\u003c/span>\u003cspan class=\"badge\">BEM · tpBEM\u003c/span>\u003cspan class=\"badge\">7 天与 14 天期限\u003c/span>\u003cspan class=\"badge\">信用规则运行在 TapeOut 电路上\u003c/span>\u003c/div>\n\u003cp>\u003cstrong>TapePool 是一个 BEM 借贷池，构建于 TapeOut 生态，运行在 X Layer 上。\u003c/strong>出借人存入 BEM；已将 TapeOut 矿机跨链到 X Layer 的矿工，以矿机预期的挖矿产出借入 BEM，矿机在挖矿的同时自动偿还贷款。应用地址：\u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>出借人\u003c/strong>存入 BEM，获得 \u003cstrong>tpBEM\u003c/strong>。tpBEM 是您在资金池中的份额（ERC-4626），借款人每支付一笔费用，它以 BEM 计的价值就随之增长。\u003c/li>\n\u003cli>\u003cstrong>借款人\u003c/strong>把矿机的 RIG 凭证（NFT）转入自己的“矿机代理”（Rig Agent）合约，借入期限为 7 天或 14 天的 BEM。\u003c/li>\n\u003cli>\u003cstrong>挖矿收益自动还款。\u003c/strong>矿机代理持有凭证期间，矿机每次领取的收益都会支付给代理合约，任何人都可以把这些 BEM 归集（sweep）到资金池：先付费用，再还本金。债务清零后，借款人取回凭证。\u003c/li>\n\u003cli>\u003cstrong>信用规则是一个公开的 TapeOut 电路。\u003c/strong>一笔借款能否发放，由一个在 X Layer 上流片的 NAND 电路在链上执行（eval）判定。任何人都可以读取并验证这条信用规则，没有人能悄悄修改它。\u003c/li>\n\u003cli>\u003cstrong>BEM 价格波动不会触发清算。\u003c/strong>债务以 BEM 计价、以 BEM 偿还，无预言机，无拍卖。产出慢的矿机绝不会被没收；只有在链上被证明受损的矿机（被撤销、已停止、被强制取回或没有基础算力）才可能被没收，而且借款人先有 72 小时补救窗口。详见\u003ca href=\"#late-and-impaired\">逾期贷款与受损矿机\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/zh/loan-flow.png\" alt=\"示意图：BSC 上的矿机挖出 BEM；RIG 凭证存放在 X Layer 上的矿机代理中；信用规则核验通过后发放借款；领取的收益付给代理合约并归集到资金池；债务清零后凭证回到矿工手中。\">\u003cfigcaption>一笔贷款如何运作：在 BSC 上挖矿，在 X Layer 上借贷。\u003c/figcaption>\u003c/figure>\n\u003ch2>从这里开始\u003c/h2>\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"#how-it-works\">\u003cstrong>运作方式\u003c/strong>\u003cp>各个角色、两条链，以及从转入凭证到还款的完整流程。\u003c/p>\u003csmall>阅读概览\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#supply\">\u003cstrong>出借 BEM\u003c/strong>\u003cp>存入 BEM 获得 tpBEM，随时提取闲置 BEM。\u003c/p>\u003csmall>面向出借人\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#borrow\">\u003cstrong>以矿机借款\u003c/strong>\u003cp>第一笔借款的每一步：从可借矿机到发起借款交易。\u003c/p>\u003csmall>面向矿工\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#terms\">\u003cstrong>借贷条款与费用\u003c/strong>\u003cp>债务上限、固定费用、最低金额和计算示例。\u003c/p>\u003csmall>了解数字\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#risks\">\u003cstrong>风险\u003c/strong>\u003cp>出借人和借款人可能遇到的问题，以及谁可以修改什么。\u003c/p>\u003csmall>存入前请阅读\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#status\">\u003cstrong>进展与路线图\u003c/strong>\u003cp>哪些已在主网运行，哪些即将上线。\u003c/p>\u003csmall>查看进展\u003c/small>\u003c/a>\n\u003c/div>\n\u003ch2>适合谁\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">您是\u003c/th>\u003cth class=\"\">TapePool 为您提供\u003c/th>\u003cth class=\"\">从这里开始\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">已将矿机跨链到 X Layer 的 TapeOut 矿工\u003c/td>\u003ctd class=\"\">现在就拿到 BEM，额度取决于矿机在 7 天或 14 天内的预期产出。矿机继续挖矿并偿还贷款。\u003c/td>\u003ctd class=\"\">\u003ca href=\"#eligibility\">我的矿机能借款吗？\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">在 X Layer 上持有 BEM 的用户\u003c/td>\u003ctd class=\"\">通过 tpBEM 分享矿工支付的费用。\u003c/td>\u003ctd class=\"\">\u003ca href=\"#supply\">存入与提取\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">任何人\u003c/td>\u003ctd class=\"\">一条可以自行验证的公开信用规则，以及无需许可、谁都能调用的还款函数。\u003c/td>\u003ctd class=\"\">\u003ca href=\"#credit-rule\">信用规则\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"warn\">TapePool 是一款新软件。存入或借款前，请先阅读\u003ca href=\"#risks\">风险\u003c/a>，并对照\u003ca href=\"#contracts\">合约地址\u003c/a>核对 TapePool 的合约。本文档不构成任何投资建议。\u003c/div>"}},{"id":"how-it-works","group":"Start here","title":"How TapePool works","nav":"How it works","lead":"Rigs mine on BSC, loans live on X Layer. A Rig Agent holds the voucher, a public circuit approves the advance and the rig's own harvests repay it.","body":"\u003ch2>The roles\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Role\u003c/th>\u003cth class=\"\">What they do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>Lender\u003c/strong>\u003c/td>\u003ctd class=\"\">Deposits BEM into the pool and receives tpBEM. Withdraws idle BEM at any time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Miner (borrower)\u003c/strong>\u003c/td>\u003ctd class=\"\">Holds a TapeOut rig's RIG voucher on X Layer. Moves it into a Rig Agent, takes an advance, and takes the voucher back when the debt is cleared.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Rig Agent\u003c/strong>\u003c/td>\u003ctd class=\"\">A small contract owned by one borrower. It holds the vouchers, borrows from the pool, receives the rig's harvests and passes them to the pool.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Anyone\u003c/strong>\u003c/td>\u003ctd class=\"\">Can sweep harvested BEM into the pool, repay any loan, push rig reports, flag a rig proven impaired and seize after the windows. No call needs permission.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Keeper\u003c/strong>\u003c/td>\u003ctd class=\"\">An off-chain bot run by the team that does the routine work on time: harvests, sweeps, report pushes and flags. It holds gas only, never pool funds. See \u003ca href=\"#keeper\">Keeper and guardian\u003c/a>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Two chains\u003c/h2>\n\u003cp>A TapeOut rig is a circuit mining on \u003cstrong>BSC\u003c/strong> through PodMining. When a miner bridges the rig to \u003cstrong>X Layer\u003c/strong>, they receive a \u003cstrong>RIG voucher\u003c/strong> (an ERC-721 token). Whoever holds the voucher when a harvest is sent on BSC receives that harvest's BEM on X Layer, less the 0.5% bridge fee.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Chain\u003c/th>\u003cth class=\"\">What lives there\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">The rig itself, PodMining, the rig vault (\u003ccode>harvest\u003c/code>), and the TapePool reporter that reads rig data.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">RIG vouchers, the bridged BEM token, the TapePool pool (tpBEM), the Rig Agents, the credit-rule circuit, the screen registry and the receiver of rig reports.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>The loop\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>Voucher in\u003c/strong>The miner creates a Rig Agent and moves the rig's voucher into it from their own wallet. Only the borrower can add collateral.\u003c/li>\n\u003cli>\u003cstrong>Fresh rig data\u003c/strong>A report of the rig's state is sent from BSC to X Layer over LayerZero. The credit rule only accepts a report less than 5 minutes old.\u003c/li>\n\u003cli>\u003cstrong>Check: allow\u003c/strong>The agent asks the credit rule. The circuit and a Solidity mirror both have to say yes: term, debt against expected output, fresh data, a healthy rig, an allowed processor, age and a screen pass.\u003c/li>\n\u003cli>\u003cstrong>Advance in BEM\u003c/strong>The pool sends the advance to the borrower's wallet, never to the agent. The flat fee is added to the debt.\u003c/li>\n\u003cli>\u003cstrong>Harvests repay\u003c/strong>Every harvest of the rig now pays BEM to the agent. A permissionless \u003ccode>sweep\u003c/code> moves it into the pool: late fee first (0 today), then the flat fee, then the principal.\u003c/li>\n\u003cli>\u003cstrong>Voucher back\u003c/strong>At debt zero the loan closes, any BEM above the debt goes to the borrower, and the borrower releases the voucher (or borrows again).\u003c/li>\n\u003c/ol>\n\u003ch2>The contracts\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Component\u003c/th>\u003cth class=\"\">Chain\u003c/th>\u003cth class=\"\">Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003ccode>TapePool\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">ERC-4626 vault: asset BEM, share tpBEM. Lends to agents, receives repayments, keeps a loss reserve. The single choke point for every BEM that leaves to a borrower.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>AgentFactory\u003c/code> and \u003ccode>RigAgent\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">One small clone per agent; a borrower may own several. Holds up to 16 vouchers, carries one loan at a time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>CreditPolicy\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">Calls the policy circuit with a gas cap and strict decoding, and checks a Solidity mirror of the rule. Any unexpected result means deny.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Policy circuit\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">TapePool's own TapeOut processor and circuit (44 NAND gates). Output: allow.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigScreen\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">Registry of screen passes: proof that a rig cannot be revoked by PodMining's official test vectors.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Rig data feed\u003c/td>\u003ctd class=\"\">BSC to X Layer\u003c/td>\u003ctd class=\"\">A reporter on BSC reads each rig and sends the report over LayerZero to a receiver on X Layer. Both ends are locked after setup.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>TapeLens\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">Read-only helper that quotes how much a rig can borrow and why a borrow would be refused.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Keeper\u003c/td>\u003ctd class=\"\">off-chain\u003c/td>\u003ctd class=\"\">Harvests, sweeps, report pushes, flags. Its key can pull three emergency brakes; only the owner releases them.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The addresses of TapePool's contracts are on \u003ca href=\"#contracts\">Contract addresses\u003c/a>. Deeper pages: \u003ca href=\"#credit-rule\">credit rule\u003c/a>, \u003ca href=\"#rig-feed\">rig data feed\u003c/a>, \u003ca href=\"#screen\">revocation screen\u003c/a>, \u003ca href=\"#pool-accounting\">pool accounting\u003c/a>.\u003c/p>","zh":{"group":"快速开始","title":"TapePool 如何运作","nav":"运作方式","lead":"矿机在 BSC 上挖矿，贷款在 X Layer 上运行。矿机代理持有凭证，公开电路核验借款，矿机自己领取的收益负责还款。","body":"\u003ch2>角色\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">角色\u003c/th>\u003cth class=\"\">做什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>出借人\u003c/strong>\u003c/td>\u003ctd class=\"\">向资金池存入 BEM，获得 tpBEM，随时提取闲置 BEM。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>矿工（借款人）\u003c/strong>\u003c/td>\u003ctd class=\"\">在 X Layer 上持有 TapeOut 矿机的 RIG 凭证。把凭证转入矿机代理后借款，债务清零后取回凭证。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>矿机代理\u003c/strong>\u003c/td>\u003ctd class=\"\">归属于一位借款人的小型合约。它持有凭证、向资金池借款、接收矿机领取的收益，并把收益转给资金池。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>任何人\u003c/strong>\u003c/td>\u003ctd class=\"\">都可以把已领取的 BEM 归集到资金池、替任何贷款还款、推送矿机数据、标记链上被证明受损的矿机，并在窗口期之后执行没收。所有调用都无需许可。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>keeper\u003c/strong>\u003c/td>\u003ctd class=\"\">团队运行的链下机器人，按时完成日常工作：领取收益、归集、推送矿机数据和标记。它只持有 gas，从不持有资金池资金。详见 \u003ca href=\"#keeper\">keeper 与守护者\u003c/a>。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>两条链\u003c/h2>\n\u003cp>TapeOut 矿机是一个通过 PodMining 在 \u003cstrong>BSC\u003c/strong> 上挖矿的电路。矿工把矿机跨链到 \u003cstrong>X Layer\u003c/strong> 时，会得到一张 \u003cstrong>RIG 凭证\u003c/strong>（ERC-721）。在 BSC 上发起领取的那一刻，谁持有凭证，这次领取的 BEM 就付给谁（到达 X Layer 时扣除 0.5% 跨链费）。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">链\u003c/th>\u003cth class=\"\">上面有什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">矿机本身、PodMining、矿机金库（\u003ccode>harvest\u003c/code>），以及读取矿机数据的 TapePool 报告合约。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">RIG 凭证、跨链后的 BEM 代币、TapePool 资金池（tpBEM）、矿机代理、信用规则电路、筛查登记合约，以及矿机数据的接收合约。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>完整流程\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>凭证转入\u003c/strong>矿工创建矿机代理，并从自己的钱包把矿机凭证转入。只有借款人本人可以添加凭证。\u003c/li>\n\u003cli>\u003cstrong>最新矿机数据\u003c/strong>一份矿机状态报告通过 LayerZero 从 BSC 发送到 X Layer。信用规则只接受 5 分钟以内的报告。\u003c/li>\n\u003cli>\u003cstrong>核验：允许\u003c/strong>矿机代理向信用规则发起核验。电路与 Solidity 镜像必须同时给出“允许”：期限、债务占预期产出、数据新鲜、矿机健康、处理器在允许范围内、矿机年龄和筛查通过。\u003c/li>\n\u003cli>\u003cstrong>发放 BEM\u003c/strong>资金池把借款金额直接发放到借款人的钱包，而不是矿机代理。固定费用计入债务。\u003c/li>\n\u003cli>\u003cstrong>挖矿收益还款\u003c/strong>此后矿机每次领取的 BEM 都付给矿机代理。任何人都可以调用 \u003ccode>sweep\u003c/code> 把它归集到资金池：先付滞纳金（目前为 0），再付固定费用，最后还本金。\u003c/li>\n\u003cli>\u003cstrong>取回凭证\u003c/strong>债务清零后贷款关闭，超出债务的 BEM 归还借款人，借款人取回凭证（或再次借款）。\u003c/li>\n\u003c/ol>\n\u003ch2>合约组成\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">组件\u003c/th>\u003cth class=\"\">链\u003c/th>\u003cth class=\"\">作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003ccode>TapePool\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">ERC-4626 资金池：资产为 BEM，份额为 tpBEM。向矿机代理发放借款、接收还款、保留损失准备金。所有借给借款人的 BEM 都只能从这里流出。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>AgentFactory\u003c/code> 与 \u003ccode>RigAgent\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">每个矿机代理是一个小型克隆合约，一位借款人可以拥有多个。每个代理最多持有 16 张凭证，同一时间只有一笔贷款。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>CreditPolicy\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">以 gas 上限和严格解码调用信用规则电路，并核对规则的 Solidity 镜像。任何异常结果都视为拒绝。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">信用规则电路\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">TapePool 自己的 TapeOut 处理器与电路（44 个 NAND 门），输出“允许”与否。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>RigScreen\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">筛查通过记录的登记合约：证明矿机不会被 PodMining 的官方测试向量撤销。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">矿机数据源\u003c/td>\u003ctd class=\"\">BSC 到 X Layer\u003c/td>\u003ctd class=\"\">BSC 上的报告合约读取每台矿机，通过 LayerZero 把报告发送到 X Layer 上的接收合约。部署完成后两端均已锁定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003ccode>TapeLens\u003c/code>\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">只读辅助合约：报价一台矿机可借多少，以及借款会因何被拒绝。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">keeper\u003c/td>\u003ctd class=\"\">链下\u003c/td>\u003ctd class=\"\">领取收益、归集、推送报告、标记。它的密钥可以拉下三个紧急制动，只有所有者能解除。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>TapePool 各合约的地址见\u003ca href=\"#contracts\">合约地址\u003c/a>。深入阅读：\u003ca href=\"#credit-rule\">信用规则\u003c/a>、\u003ca href=\"#rig-feed\">矿机数据源\u003c/a>、\u003ca href=\"#screen\">撤销风险筛查\u003c/a>、\u003ca href=\"#pool-accounting\">资金池记账与上限\u003c/a>。\u003c/p>"}},{"id":"status","group":"Start here","title":"Status and roadmap","lead":"What is live on X Layer mainnet today, what the app still lacks, and what is planned.","body":"\u003cp>TapePool was built for the OKX X Layer Build X \"TapeOut Accelerate\" hackathon. The contracts were redeployed several times as fixes landed; the current stack went live in November 2026. The app is open at \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>.\u003c/p>\n\u003ch2>Live\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">What\u003c/th>\u003cth class=\"\">Since\u003c/th>\u003cth class=\"\">Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Policy circuit \"Tape Pool Policy\" (circuit ID 1) on X Layer\u003c/td>\u003ctd class=\"\">October 2026\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Live\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">First loan repaid by mined BEM (on an earlier deployment of the pool)\u003c/td>\u003ctd class=\"\">October 24, 2026\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Done\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Rig data feed, BSC to X Layer, deployed and locked\u003c/td>\u003ctd class=\"\">November 16, 2026\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Live\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Pool, Rig Agents, credit policy and screen registry (current stack)\u003c/td>\u003ctd class=\"\">November 16, 2026\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Live\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Borrowing open on the current pool\u003c/td>\u003ctd class=\"\">November 18, 2026\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Live\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Keeper: harvests, sweeps, report pushes, flags, upgrade watch\u003c/td>\u003ctd class=\"\">November 17, 2026 (current stack)\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">Live\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Launch terms\u003c/h2>\n\u003cul>\n\u003cli>BEM fee: 0.25% for 7 days, 0.5% for 14 days, at least 0.001 BEM per loan. See \u003ca href=\"#terms\">Terms and fees\u003c/a>.\u003c/li>\n\u003cli>Operating fee: \u003cstrong>0 OKB\u003c/strong>. Through \u003cstrong>December 31, 2026\u003c/strong>, the keeper wallet covers the LayerZero fees of rig report pushes and scheduled harvests. A borrower's only network cost is X Layer gas.\u003c/li>\n\u003cli>Late fee: \u003cstrong>0\u003c/strong>. The owner committed in public to keep it at 0 until December 7, 2026; any later rate applies to new loans only.\u003c/li>\n\u003c/ul>\n\u003ch2>Planned\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">What\u003c/th>\u003cth class=\"\">Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Telegram alerts for borrowers (flagged or repaid loans). The app shows the card with its button off.\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag soon\">Coming soon\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A FAB pool for FabX rigs, which live on X Layer. Under evaluation; the app shows it as \"Coming soon\".\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">Evaluating\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">USD values in the app. Amounts are shown in BEM and OKB only.\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">Planned\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">WalletConnect and mobile wallets outside the OKX Wallet in-app browser.\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">Planned\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A 30-day term. Deferred until there is more data; it needs a new circuit and a new pool deployment.\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">Deferred\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">Earlier deployments of the pool are retired: their supply cap is 0 and borrows are paused, but anyone who still holds shares in them can withdraw. The contracts in use today are on \u003ca href=\"#contracts\">Contract addresses\u003c/a>.\u003c/div>","zh":{"group":"快速开始","title":"进展与路线图","lead":"哪些已在 X Layer 主网运行，应用还缺什么，以及后续计划。","body":"\u003cp>TapePool 为 OKX X Layer Build X “TapeOut Accelerate” 黑客松而开发。合约随着修复多次重新部署，当前这一版于 2026 年 11 月上线。应用已开放：\u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>。\u003c/p>\n\u003ch2>已上线\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">内容\u003c/th>\u003cth class=\"\">时间\u003c/th>\u003cth class=\"\">状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">信用规则电路 “Tape Pool Policy”（电路 ID 1）在 X Layer 上流片\u003c/td>\u003ctd class=\"\">2026 年 10 月\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已上线\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">第一笔由挖矿产出偿还的贷款（在资金池较早的一次部署上）\u003c/td>\u003ctd class=\"\">2026 年 10 月 24 日\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已完成\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">矿机数据源（BSC 到 X Layer）部署并锁定\u003c/td>\u003ctd class=\"\">2026 年 11 月 16 日\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已上线\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">资金池、矿机代理、信用规则合约与筛查登记合约（当前版本）\u003c/td>\u003ctd class=\"\">2026 年 11 月 16 日\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已上线\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">当前资金池开放借款\u003c/td>\u003ctd class=\"\">2026 年 11 月 18 日\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已上线\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">keeper：领取收益、归集、推送报告、标记、监控合约升级\u003c/td>\u003ctd class=\"\">2026 年 11 月 17 日（当前版本）\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag live\">已上线\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>上线时的条款\u003c/h2>\n\u003cul>\n\u003cli>BEM 固定费用：7 天 0.25%，14 天 0.5%，每笔贷款至少 0.001 BEM。详见\u003ca href=\"#terms\">借贷条款与费用\u003c/a>。\u003c/li>\n\u003cli>运营费：\u003cstrong>0 OKB\u003c/strong>。截至 \u003cstrong>2026 年 12 月 31 日\u003c/strong>，keeper 钱包承担矿机数据推送和计划内领取收益的 LayerZero 费用。借款人只需支付 X Layer 上的 gas。\u003c/li>\n\u003cli>滞纳金：\u003cstrong>0\u003c/strong>。所有者已公开承诺在 2026 年 12 月 7 日前保持为 0；之后若设定费率，只适用于新贷款。\u003c/li>\n\u003c/ul>\n\u003ch2>后续计划\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">内容\u003c/th>\u003cth class=\"\">状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">借款人的 Telegram 提醒（贷款被标记或已还清）。应用中已有该卡片，按钮暂不可用。\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag soon\">即将上线\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">面向 FabX 矿机的 FAB 资金池（FabX 矿机原生运行在 X Layer 上）。仍在评估中，应用中显示为“即将上线”。\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">评估中\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">应用中的美元计价。目前金额只以 BEM 和 OKB 显示。\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">计划中\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">WalletConnect，以及 OKX Wallet 内置浏览器之外的手机钱包。\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">计划中\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">30 天期限。在积累更多数据之前暂缓；它需要新的电路和新的资金池部署。\u003c/td>\u003ctd class=\"\">\u003cspan class=\"tag plan\">暂缓\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"note\">资金池的早期部署均已停用：供应上限为 0，借款已暂停，但仍持有份额的用户可以照常提取。当前正在使用的合约见\u003ca href=\"#contracts\">合约地址\u003c/a>。\u003c/div>"}},{"id":"tutorial","group":"Tutorial","title":"Video tutorial","nav":"Video tutorial","lead":"Watch how to supply BEM and borrow against a rig in the TapePool app.","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge\">Supply and borrow\u003c/span>\u003cspan class=\"badge\">English · 中文\u003c/span>\u003c/div>\n\u003cdiv class=\"video\">\u003ciframe src=\"https://www.youtube-nocookie.com/embed/s8IG_HjWv8Q\" title=\"TapePool Tutorial: Borrow and Supply (EN/中文)\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen>\u003c/iframe>\u003c/div>\n\u003cp>\u003ca href=\"https://youtu.be/s8IG_HjWv8Q\" target=\"_blank\" rel=\"noreferrer\">Watch on YouTube ↗\u003c/a>. The video is in English and 中文.\u003c/p>\n\u003ch2>Read along\u003c/h2>\n\u003cp>The written pages cover the same steps, with the numbers and the rules behind them.\u003c/p>\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"#supply\">\u003cstrong>Lend BEM\u003c/strong>\u003cp>Supply BEM, receive tpBEM, and withdraw idle BEM.\u003c/p>\u003csmall>Supply and withdraw\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#borrow\">\u003cstrong>Borrow against a rig\u003c/strong>\u003cp>Every step of a first advance, from a ready rig to the borrow transaction.\u003c/p>\u003csmall>Borrow\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#terms\">\u003cstrong>Terms and fees\u003c/strong>\u003cp>Debt caps, the flat fee, minimums and worked examples.\u003c/p>\u003csmall>Know the numbers\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#risks\">\u003cstrong>Risks\u003c/strong>\u003cp>What can go wrong for lenders and borrowers, and who can change what.\u003c/p>\u003csmall>Read before you deposit\u003c/small>\u003c/a>\n\u003c/div>\n\u003cdiv class=\"note\">Screens in the video may differ slightly from the app as it is updated. The app is at \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>; check TapePool's contracts against \u003ca href=\"#contracts\">Contract addresses\u003c/a> before you sign.\u003c/div>","zh":{"group":"视频教程","title":"视频教程","nav":"视频教程","lead":"观看如何在 TapePool 应用中存入 BEM，以及以矿机借款。","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge\">出借与借款\u003c/span>\u003cspan class=\"badge\">English · 中文\u003c/span>\u003c/div>\n\u003cdiv class=\"video\">\u003ciframe src=\"https://www.youtube-nocookie.com/embed/s8IG_HjWv8Q\" title=\"TapePool 视频教程：借款与出借（英文与中文）\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen>\u003c/iframe>\u003c/div>\n\u003cp>\u003ca href=\"https://youtu.be/s8IG_HjWv8Q\" target=\"_blank\" rel=\"noreferrer\">在 YouTube 上观看 ↗\u003c/a>。视频提供英文与中文。\u003c/p>\n\u003ch2>对照阅读\u003c/h2>\n\u003cp>文字页面涵盖同样的步骤，并附有数字和背后的规则。\u003c/p>\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"#supply\">\u003cstrong>出借 BEM\u003c/strong>\u003cp>存入 BEM 获得 tpBEM，随时提取闲置 BEM。\u003c/p>\u003csmall>存入与提取\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#borrow\">\u003cstrong>以矿机借款\u003c/strong>\u003cp>第一笔借款的每一步：从可借矿机到发起借款交易。\u003c/p>\u003csmall>借款\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#terms\">\u003cstrong>借贷条款与费用\u003c/strong>\u003cp>债务上限、固定费用、最低金额和计算示例。\u003c/p>\u003csmall>了解数字\u003c/small>\u003c/a>\n\u003ca class=\"card\" href=\"#risks\">\u003cstrong>风险\u003c/strong>\u003cp>出借人和借款人可能遇到的问题，以及谁可以修改什么。\u003c/p>\u003csmall>存入前请阅读\u003c/small>\u003c/a>\n\u003c/div>\n\u003cdiv class=\"note\">应用更新后，视频中的界面可能与当前应用略有不同。应用地址：\u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>；签名前请对照\u003ca href=\"#contracts\">合约地址\u003c/a>核对 TapePool 的合约。\u003c/div>"}},{"id":"app","group":"Use the app","title":"Using the app","nav":"App tour","lead":"A static page that reads the contracts through public RPCs and signs only through your own wallet.","body":"\u003cdiv class=\"badges\">\u003ca class=\"badge live\" href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io ↗\u003c/a>\u003cspan class=\"badge\">No server · no analytics\u003c/span>\u003cspan class=\"badge\">English · 中文\u003c/span>\u003c/div>\n\u003cp>Open the app at \u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>. It is a single static page. It reads X Layer and BSC through their public RPC endpoints, builds each transaction, and sends it to your wallet to sign. It has no server of its own, no key, no analytics and no third-party script. Optionally it talks to the keeper for share-value history and for rig report pushes.\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/dashboard.png\" alt=\"TapePool app Dashboard: supplied BEM, growth since deposit, debt and next maturity, with tables for supplies, loans, assets to supply, borrowing against rigs, and transactions.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The Dashboard: your supplies, your loans and your recent transactions in one place.\u003c/figcaption>\u003c/figure>\n\u003ch2>Pages\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Page\u003c/th>\u003cth class=\"\">What you find there\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>Dashboard\u003c/strong>\u003c/td>\u003ctd class=\"\">Your tpBEM and what you can withdraw now, your open loans, what you can supply and how much you can borrow, and your transactions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Markets\u003c/strong>\u003c/td>\u003ctd class=\"\">Pool totals and the pools table. Opens the BEM pool page: supply, borrow terms, the credit rule and the contracts.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Rigs\u003c/strong>\u003c/td>\u003ctd class=\"\">Every rig voucher you hold, its status and the action it allows: borrow, repay, release, take back, ask for a screen.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Tape\u003c/strong>\u003c/td>\u003ctd class=\"\">A demo game with virtual BEM. See \u003ca href=\"#tape\">Tape demo\u003c/a>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/markets.png\" alt=\"Markets page: total supply, total borrow and available liquidity, and a pools table with the BEM pool and a FAB row marked coming soon.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Markets. The FAB row is a placeholder for a future FabX pool.\u003c/figcaption>\u003c/figure>\n\u003ch2>Connect a wallet\u003c/h2>\n\u003cp>Click \u003cstrong>Connect wallet\u003c/strong>. The dialog lists every wallet your browser announces (EIP-6963), and recommends Binance Wallet, Trust Wallet, Rabby, MetaMask and OKX Wallet when they are not installed. The app asks your wallet to switch to \u003cstrong>X Layer\u003c/strong> (chain 196) and adds it if needed. BSC (chain 56) is used only when you send a transaction there yourself, such as a harvest.\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/connect.png\" alt=\"Connect wallet dialog with installed wallets on the left and an explanation of what a wallet is on the right.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The connect dialog. Wallet names and icons come from your browser; the app never fetches anything from them.\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>You need \u003cstrong>OKB\u003c/strong> on X Layer for gas.\u003c/li>\n\u003cli>WalletConnect is not supported yet. On a phone, use the OKX Wallet in-app browser.\u003c/li>\n\u003cli>Check every request in your wallet before you sign. The app never asks for a seed phrase or a private key.\u003c/li>\n\u003c/ul>\n\u003ch2>The status bar\u003c/h2>\n\u003cp>The bar at the bottom of every page shows the pool's switches, read live from the contracts:\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/statusbar.png\" alt=\"Status bar: Borrows open, Rig data feed on, No credit rule change queued, Deposits open.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Each dot turns amber or red when a brake is on.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Signal\u003c/th>\u003cth class=\"\">What it means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Borrows open / paused\u003c/td>\u003ctd class=\"\">Whether new advances are allowed. A pause never blocks repayments, releases or withdrawals.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Rig data feed on / off\u003c/td>\u003ctd class=\"\">Whether new rig reports are accepted for borrowing. Off means no new borrows; open loans keep repaying.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Credit rule change queued\u003c/td>\u003ctd class=\"\">A new credit rule is waiting out its 7-day public queue. Borrows stay paused meanwhile.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Deposits open / closed\u003c/td>\u003ctd class=\"\">Closed while the supply cap is reached or while a loan is flagged. Withdrawals stay open.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Read-only view\u003c/h2>\n\u003cp>A wallet that cannot connect to a browser (a command-line or hardware-only setup) can still be followed: the app shows any address read-only at \u003ccode>app.tapepool.io/#/app/view/&lt;address&gt;\u003c/code>, with every write control off.\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/view.png\" alt=\"Read-only view of an address showing its supplies, loans and rigs with all buttons disabled.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Read-only view of an address.\u003c/figcaption>\u003c/figure>\n\u003ch2>Language\u003c/h2>\n\u003cp>The \u003cstrong>EN · 中文\u003c/strong> switch in the header changes every label, message and number format. The choice is remembered on your device.\u003c/p>","zh":{"group":"使用应用","title":"使用应用","nav":"应用导览","lead":"应用是一个静态页面：通过公共 RPC 读取合约，只通过您自己的钱包签名。","body":"\u003cdiv class=\"badges\">\u003ca class=\"badge live\" href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io ↗\u003c/a>\u003cspan class=\"badge\">无服务器 · 无数据统计\u003c/span>\u003cspan class=\"badge\">English · 中文\u003c/span>\u003c/div>\n\u003cp>应用地址：\u003ca href=\"https://app.tapepool.io\" target=\"_blank\" rel=\"noreferrer\">app.tapepool.io\u003c/a>。TapePool 应用是一个单一的静态页面。它通过公共 RPC 读取 X Layer 和 BSC，构建每一笔交易，再交给您的钱包签名。应用没有自己的服务器、没有密钥、没有数据统计，也不加载任何第三方脚本。它可以选择性地连接 keeper，以获取份额价值历史和推送矿机数据。\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/dashboard.png\" alt=\"TapePool 应用总览页：已存入的 BEM、存入以来增长、债务和下次到期，以及我的存款、我的贷款、可存入资产、以矿机借款和交易记录。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>总览：您的存款、贷款和最近的交易集中在一页。\u003c/figcaption>\u003c/figure>\n\u003ch2>页面\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">页面\u003c/th>\u003cth class=\"\">内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>总览\u003c/strong>\u003c/td>\u003ctd class=\"\">您的 tpBEM 和当前可提取的金额、进行中的贷款、可存入的资产、可借额度，以及交易记录。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>市场\u003c/strong>\u003c/td>\u003ctd class=\"\">资金池总量和资金池列表。点击进入 BEM 资金池页面：存入、借贷条款、信用规则和合约信息。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>矿机\u003c/strong>\u003c/td>\u003ctd class=\"\">您持有的每张矿机凭证、它的状态以及可执行的操作：借款、还款、取回凭证、申请筛查。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Tape\u003c/strong>\u003c/td>\u003ctd class=\"\">使用虚拟 BEM 的演示游戏。详见 \u003ca href=\"#tape\">Tape 演示\u003c/a>。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/markets.png\" alt=\"市场页：存款总额、借款总额和可用流动性，资金池列表中有 BEM 资金池和标记为即将上线的 FAB 一行。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>市场页。FAB 一行是未来 FabX 资金池的占位。\u003c/figcaption>\u003c/figure>\n\u003ch2>连接钱包\u003c/h2>\n\u003cp>点击\u003cstrong>连接钱包\u003c/strong>。对话框会列出浏览器中已安装的全部钱包（EIP-6963）；未安装时，推荐 Binance Wallet、Trust Wallet、Rabby、MetaMask 和 OKX Wallet。应用会请求钱包切换到 \u003cstrong>X Layer\u003c/strong>（链 ID 196），需要时自动添加该网络。只有当您自己在 BSC（链 ID 56）上发起交易（例如领取收益）时，才会用到 BSC。\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/zh/connect.png\" alt=\"连接钱包对话框：左侧是已安装的钱包，右侧解释什么是钱包。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>连接钱包对话框。钱包名称和图标来自您的浏览器，应用不会从中获取任何数据。\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>您需要在 X Layer 上持有少量 \u003cstrong>OKB\u003c/strong> 支付 gas。\u003c/li>\n\u003cli>目前暂不支持 WalletConnect。手机上请使用 OKX Wallet 内置浏览器。\u003c/li>\n\u003cli>签名前请在钱包中核对每一个请求。应用绝不会索取助记词或私钥。\u003c/li>\n\u003c/ul>\n\u003ch2>底部状态栏\u003c/h2>\n\u003cp>每个页面底部的状态栏实时读取合约，显示资金池的各个开关：\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/statusbar.png\" alt=\"状态栏：借款开放、矿机数据源已开启、信用规则无待生效变更、存款开放。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>有制动开启时，对应的圆点会变成黄色或红色。\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">信号\u003c/th>\u003cth class=\"\">含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">借款开放 / 已暂停\u003c/td>\u003ctd class=\"\">是否允许新的借款。暂停从不影响还款、取回凭证或提取。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">矿机数据源已开启 / 已关闭\u003c/td>\u003ctd class=\"\">是否接受新的矿机数据用于借款。关闭时不能发起新借款，进行中的贷款继续还款。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">信用规则有待生效变更\u003c/td>\u003ctd class=\"\">一条新的信用规则正在 7 天公开队列中等待，期间借款保持暂停。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">存款开放 / 已关闭\u003c/td>\u003ctd class=\"\">达到供应上限或有贷款被标记时关闭。提取始终开放。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>只读查看\u003c/h2>\n\u003cp>无法连接浏览器钱包的地址（命令行或纯硬件钱包）也可以查看：应用在 \u003ccode>app.tapepool.io/#/app/view/&lt;地址&gt;\u003c/code> 以只读方式显示任意地址，所有写入操作均不可用。\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/view.png\" alt=\"某个地址的只读视图：显示其存款、贷款和矿机，所有按钮均不可用。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>地址的只读视图。\u003c/figcaption>\u003c/figure>\n\u003ch2>语言\u003c/h2>\n\u003cp>页面顶部的 \u003cstrong>EN · 中文\u003c/strong> 开关会切换所有标签、提示和数字格式，您的选择会保存在本设备上。\u003c/p>"}},{"id":"tape","group":"Use the app","title":"Tape demo","lead":"A price game in the app that uses virtual BEM only. It never touches your wallet.","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge\">Demo\u003c/span>\u003cspan class=\"badge\">Virtual BEM only\u003c/span>\u003cspan class=\"badge\">No wallet, nothing signed\u003c/span>\u003c/div>\n\u003cp>\u003cstrong>Tape\u003c/strong> is a small game next to the lending pages. It starts you with a demo balance of virtual BEM and shows the live OKB / USD index from OKX's public market data. It has nothing to do with the pool: it never reads your balance, never asks your wallet for anything and keeps its session only in your browser's memory.\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/tape.png\" alt=\"Tape demo: the OKB/USD index price line on the left and a grid of future price cells with multipliers on the right, with a demo balance and stake selector.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Tape: pick a stake, then click a future cell.\u003c/figcaption>\u003c/figure>\n\u003ch2>How a round works\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>Pick a stake\u003c/strong>Choose an amount of virtual BEM.\u003c/li>\n\u003cli>\u003cstrong>Click a future cell\u003c/strong>Each cell is a price band (5 cents tall) and a 5-second window, at least 10 seconds ahead. Its multiplier is shown on the cell.\u003c/li>\n\u003cli>\u003cstrong>Watch the line\u003c/strong>If an observed price touches the band during its window, the ticket wins its multiplier on the stake. Otherwise the stake is lost.\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>Multipliers range from 1.01× to 8×. They follow recent price movement and pay 95% of a fair price for the chance of a touch, so on average a ticket returns less than its stake.\u003c/li>\n\u003cli>Prices come only from OKX's public index (once a second, no account, no cookie). If no fresh price arrives for 5 seconds, the game waits and refuses new tickets.\u003c/li>\n\u003cli>Reloading the page starts a new session. There is no real money in Tape and nothing can be withdrawn from it.\u003c/li>\n\u003c/ul>","zh":{"group":"使用应用","title":"Tape 演示","lead":"应用里的一个价格小游戏，只使用虚拟 BEM，从不接触您的钱包。","body":"\u003cdiv class=\"badges\">\u003cspan class=\"badge\">演示\u003c/span>\u003cspan class=\"badge\">仅限虚拟 BEM\u003c/span>\u003cspan class=\"badge\">无需钱包 · 无需签名\u003c/span>\u003c/div>\n\u003cp>\u003cstrong>Tape\u003c/strong> 是借贷页面旁的一个小游戏。它给您一笔虚拟 BEM 演示余额，并显示来自 OKX 公开行情数据的 OKB / USD 指数价格。它与资金池无关：不读取您的余额，不向钱包请求任何操作，会话只保存在浏览器内存中。\u003c/p>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/tape.png\" alt=\"Tape 演示：左侧是 OKB/USD 指数价格线，右侧是带倍数的未来价格格子，下方是演示余额和下注金额选择。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>Tape：选择金额，然后点击一个未来的格子。\u003c/figcaption>\u003c/figure>\n\u003ch2>一局如何进行\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>选择金额\u003c/strong>选择一笔虚拟 BEM。\u003c/li>\n\u003cli>\u003cstrong>点击未来的格子\u003c/strong>每个格子代表一个价格区间（高 5 美分）和一个 5 秒时间窗口，至少在 10 秒之后。格子上显示它的倍数。\u003c/li>\n\u003cli>\u003cstrong>观察价格线\u003c/strong>若在该时间窗口内有观测价格触及这个区间，这张票按倍数赢得奖励；否则输掉下注金额。\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>倍数在 1.01× 到 8× 之间，随近期价格波动变化，按触及概率的公平价格的 95% 计算，因此平均而言，一张票的回报低于下注金额。\u003c/li>\n\u003cli>价格只来自 OKX 的公开指数（每秒一次，无需账户，不发送 cookie）。如果 5 秒内没有新价格，游戏会等待并拒绝新的下注。\u003c/li>\n\u003cli>刷新页面会开始新的会话。Tape 中没有真实资金，也无法从中提取任何东西。\u003c/li>\n\u003c/ul>"}},{"id":"supply","group":"Lend BEM","title":"Supply and withdraw","lead":"Deposit BEM, receive tpBEM, and withdraw idle BEM whenever you want.","body":"\u003cp>The pool is an ERC-4626 vault. Its asset is the bridged \u003cstrong>BEM\u003c/strong> token on X Layer; its share is \u003cstrong>tpBEM\u003c/strong>. When you supply, you receive tpBEM at the current share value. When you withdraw, you return tpBEM and receive BEM at the share value of that moment.\u003c/p>\n\u003ch2>What you need\u003c/h2>\n\u003cul>\u003cli>BEM on X Layer.\u003c/li>\u003cli>A little OKB on X Layer for gas.\u003c/li>\u003cli>A wallet connected to X Layer. See \u003ca href=\"#app\">Using the app\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2>Supply BEM\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003col class=\"steps\">\n\u003cli>\u003cstrong>Open the BEM pool\u003c/strong>\u003cem>Markets\u003c/em> → \u003cem>BEM\u003c/em> → \u003cem>Supply\u003c/em>, or \u003cem>Dashboard\u003c/em> → \u003cem>Supply\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Enter an amount\u003c/strong>The panel shows the tpBEM you receive, the current tpBEM value and the room left under the supply cap.\u003c/li>\n\u003cli>\u003cstrong>1 · Allow BEM\u003c/strong>An approval transaction, so the pool may pull exactly what you supply.\u003c/li>\n\u003cli>\u003cstrong>2 · Supply BEM\u003c/strong>The deposit transaction. tpBEM arrives in your wallet.\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/supply.png\" alt=\"Supply BEM dialog: amount 2.0000 BEM, you receive about 1.9828 tpBEM, tpBEM value 1.0087 BEM, supply cap after and room left after, with buttons 1 Allow BEM and 2 Supply BEM.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Supply: approve once, then deposit.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>Withdraw\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>Open \u003cem>Withdraw\u003c/em>, enter an amount of BEM (or \u003cem>MAX\u003c/em>) and confirm one transaction. You can withdraw up to the pool's \u003cstrong>idle BEM\u003c/strong>: the BEM that is not lent out. The app shows it as \u003cem>Withdrawable now\u003c/em>.\u003c/p>\n\u003cp>Caps, the borrow pause and the feed switch never block a withdrawal. If most of the pool is lent out, you may wait for repayments; loans repay from mining over 7 or 14 days.\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/withdraw.png\" alt=\"Withdraw dialog showing the BEM amount, the tpBEM burned and the BEM withdrawable now.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Withdraw: limited only by idle BEM.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>The BEM pool page\u003c/h2>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/pool-supply.png\" alt=\"Supply card of the BEM pool page: total supplied against the supply cap, tpBEM value and idle BEM available to withdraw.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The pool's Supply card. \"Caps only block new deposits, never withdrawals.\"\u003c/figcaption>\u003c/figure>\n\u003ch2>When deposits close\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>The supply cap is reached.\u003c/strong> The owner sets it; the app shows the room left.\u003c/li>\n\u003cli>\u003cstrong>A loan is flagged.\u003c/strong> While any loan is marked doubtful, new deposits stop. Otherwise someone who expects the loan to be repaid could buy shares at the marked-down price and sell them after the repayment. Withdrawals keep working, at the lower price. See \u003ca href=\"#share-value\">Share value, fees and losses\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003ch2>How much stays idle\u003c/h2>\n\u003cp>New borrows can take at most \u003cstrong>70% of pool assets\u003c/strong>, so at least 30% stays idle when each loan is made. The share can drift after withdrawals, because caps check new borrows only. The pool also limits total lending to the current value of the owner's seed shares (the \u003cem>backstop\u003c/em>), so other lenders' withdrawals are covered by idle BEM unless a loss lowers that seed. See \u003ca href=\"#pool-accounting\">Pool accounting and caps\u003c/a>.\u003c/p>","zh":{"group":"出借 BEM","title":"存入与提取","lead":"存入 BEM 获得 tpBEM，随时提取闲置 BEM。","body":"\u003cp>资金池是一个 ERC-4626 金库，资产是 X Layer 上跨链后的 \u003cstrong>BEM\u003c/strong> 代币，份额是 \u003cstrong>tpBEM\u003c/strong>。存入时，您按当前份额价值获得 tpBEM；提取时，您交回 tpBEM，按当时的份额价值收到 BEM。\u003c/p>\n\u003ch2>您需要\u003c/h2>\n\u003cul>\u003cli>X Layer 上的 BEM。\u003c/li>\u003cli>X Layer 上少量 OKB，用于支付 gas。\u003c/li>\u003cli>已连接到 X Layer 的钱包。详见\u003ca href=\"#app\">使用应用\u003c/a>。\u003c/li>\u003c/ul>\n\u003ch2>存入 BEM\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003col class=\"steps\">\n\u003cli>\u003cstrong>打开 BEM 资金池\u003c/strong>\u003cem>市场\u003c/em> → \u003cem>BEM\u003c/em> → \u003cem>存入\u003c/em>，或\u003cem>总览\u003c/em> → \u003cem>存入\u003c/em>。\u003c/li>\n\u003cli>\u003cstrong>输入金额\u003c/strong>面板会显示您将获得的 tpBEM、当前 tpBEM 价值以及供应上限剩余的额度。\u003c/li>\n\u003cli>\u003cstrong>1 · 授权 BEM\u003c/strong>一笔授权交易，让资金池只能转走您要存入的金额。\u003c/li>\n\u003cli>\u003cstrong>2 · 存入 BEM\u003c/strong>存款交易。tpBEM 会到达您的钱包。\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/supply.png\" alt=\"存入 BEM 对话框：金额、预计获得的 tpBEM、tpBEM 价值、存入后的上限占用和剩余额度，以及“授权 BEM”和“存入 BEM”两个按钮。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>存入：先授权，再存入。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>提取\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>打开\u003cem>提取\u003c/em>，输入 BEM 数量（或点击 \u003cem>MAX\u003c/em>），确认一笔交易即可。您最多可以提取资金池的\u003cstrong>闲置 BEM\u003c/strong>，也就是尚未借出的部分，应用中显示为\u003cem>当前可提取\u003c/em>。\u003c/p>\n\u003cp>上限、借款暂停和数据源开关都不会阻止提取。提款由未借出的 BEM 支付；如果资金池大部分已借出，您可能需要等待还款，还款来自挖矿产出，期限为 7 天或 14 天。\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/withdraw.png\" alt=\"提取对话框：BEM 数量、需要交回的 tpBEM，以及当前可提取的 BEM。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>提取：只受闲置 BEM 限制。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>BEM 资金池页面\u003c/h2>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/zh/pool-supply.png\" alt=\"BEM 资金池页面的存入卡片：已存入总额与供应上限、tpBEM 价值，以及可提取的闲置 BEM。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>资金池的存入卡片。上限只限制新的存款，从不限制提取。\u003c/figcaption>\u003c/figure>\n\u003ch2>存款何时关闭\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>达到供应上限。\u003c/strong>上限由所有者设定，应用会显示剩余额度。\u003c/li>\n\u003cli>\u003cstrong>有贷款被标记。\u003c/strong>只要有贷款被记为存疑，新的存款就会暂停。否则，预期这笔贷款会被还清的人就能以被下调的价格买入份额，并在还款后卖出。提取照常进行，但按下调后的价格计算。详见\u003ca href=\"#share-value\">份额价值、费用与损失\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>有多少保持闲置\u003c/h2>\n\u003cp>新的借款最多只能占用\u003cstrong>资金池资产的 70%\u003c/strong>，因此每笔贷款发放时，至少 30% 的资金池保持闲置。由于上限只检查新的借款，这个比例在有人提取后可能变化。资金池还把借出总额限制在所有者种子份额（\u003cem>兜底份额\u003c/em>）的当前价值以内：只要没有损失使这部分种子缩水，其他出借人的提款就由闲置 BEM 覆盖。详见\u003ca href=\"#pool-accounting\">资金池记账与上限\u003c/a>。\u003c/p>"}},{"id":"share-value","group":"Lend BEM","title":"Share value, fees and losses","nav":"Share value & losses","lead":"How fees reach tpBEM, why income is released over 7 days, and what happens when a loan goes bad.","body":"\u003ch2>Where the value comes from\u003c/h2>\n\u003cp>Borrowers pay a flat BEM fee on every advance. When a fee is paid:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>20% goes to the loss reserve\u003c/strong>, until the reserve reaches 5% of pool assets (measured when the loan began).\u003c/li>\n\u003cli>\u003cstrong>The rest is income for tpBEM holders.\u003c/strong> It reaches the share value gradually over \u003cstrong>7 days\u003c/strong>, never in the block it is paid.\u003c/li>\n\u003c/ol>\n\u003cp>Fees are counted when they are paid, never when they are owed. BEM from seized vouchers and any other BEM sent to the pool is released the same way.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Why 7 days?\u003c/strong> Releasing income over time means nobody can deposit just before a large repayment and leave right after it with a share of income they did not wait for.\u003c/div>\n\u003ch2>The share value\u003c/h2>\n\u003cpre>\u003ccode>idle         = BEM held by the pool − loss reserve\ntotal assets = idle + principal lent out − doubtful principal − income not yet released\ntpBEM value  = total assets ÷ tpBEM supply\u003c/code>\u003c/pre>\n\u003cp>tpBEM has 14 decimals (6 more than BEM), which protects the first deposits against share-price manipulation. A small \"dead\" seed of 0.01 BEM sent at launch to an address no one controls keeps the share supply above zero.\u003c/p>\n\u003ch2>When a loan goes bad\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Event\u003c/th>\u003cth class=\"\">Effect on lenders\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">A loan runs past maturity\u003c/td>\u003ctd class=\"\">Nothing changes. The rig keeps repaying. The late fee is 0 today, so a late loan earns lenders nothing extra.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A loan is flagged (rig proven impaired)\u003c/td>\u003ctd class=\"\">Its remaining principal is marked \u003cstrong>doubtful\u003c/strong> and leaves the share value at once. Income not yet released absorbs the loss first. New deposits close.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">The borrower repays during the 72-hour cure window\u003c/td>\u003ctd class=\"\">The doubtful mark is removed and the value comes back. Deposits reopen.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">The loan is seized\u003c/td>\u003ctd class=\"\">The principal is written off. The loss reserve covers as much as it holds, and that cover returns to the share value at the seize. The seized vouchers keep mining for the pool.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The loss reserve never leaves the pool except to absorb a write-off.\u003c/p>\n\u003cdiv class=\"warn\">\u003cstrong>No return is promised.\u003c/strong> Everything is counted in BEM: fees, losses and the share value. Nothing in TapePool protects you from a fall in the BEM price. A few miners hold most of the eligible rigs, so trouble at one large miner can reach a large part of the pool. See \u003ca href=\"#risks\">Risks\u003c/a>.\u003c/div>","zh":{"group":"出借 BEM","title":"份额价值、费用与损失","nav":"份额价值与损失","lead":"费用如何进入 tpBEM，收入为何分 7 天释放，以及贷款出问题时会发生什么。","body":"\u003ch2>价值从哪里来\u003c/h2>\n\u003cp>借款人每笔借款都要支付固定的 BEM 费用。费用支付时：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>20% 进入损失准备金\u003c/strong>，直到准备金达到资金池资产的 5%（按贷款开始时计算）。\u003c/li>\n\u003cli>\u003cstrong>其余部分是 tpBEM 持有人的收入。\u003c/strong>它在 \u003cstrong>7 天\u003c/strong>内逐步计入份额价值，绝不会在支付当个区块一次性计入。\u003c/li>\n\u003c/ol>\n\u003cp>费用在实际支付时才入账，应付未付的费用从不计为资产。被没收凭证产生的 BEM，以及任何直接转入资金池的 BEM，都按同样方式释放。\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>为什么是 7 天？\u003c/strong>收入分期释放，就没有人能在一笔大额还款前存入、还款后立即离开，拿走自己并未等待的那部分收入。\u003c/div>\n\u003ch2>份额价值\u003c/h2>\n\u003cpre>\u003ccode>闲置 BEM   = 资金池持有的 BEM − 损失准备金\n资产总额   = 闲置 BEM + 已借出本金 − 存疑本金 − 尚未释放的收入\ntpBEM 价值 = 资产总额 ÷ tpBEM 总量\u003c/code>\u003c/pre>\n\u003cp>tpBEM 有 14 位小数（比 BEM 多 6 位），可防止早期存款被操纵份额价格。上线时还向一个无人控制的地址存入了 0.01 BEM 的“死种子”，使份额总量始终大于零。\u003c/p>\n\u003ch2>贷款出问题时\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">事件\u003c/th>\u003cth class=\"\">对出借人的影响\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">贷款逾期\u003c/td>\u003ctd class=\"\">没有变化，矿机继续还款。目前滞纳金为 0，因此逾期贷款不会给出借人带来额外收入。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">贷款被标记（矿机被证明受损）\u003c/td>\u003ctd class=\"\">剩余本金被记为\u003cstrong>存疑\u003c
