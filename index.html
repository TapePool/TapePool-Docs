/strong>，立即从份额价值中扣除；尚未释放的收入先承担损失。新存款暂停。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">借款人在 72 小时补救窗口内还款\u003c/td>\u003ctd class=\"\">存疑标记解除，价值恢复，存款重新开放。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">贷款被没收\u003c/td>\u003ctd class=\"\">本金核销。损失准备金在其余额范围内承担损失，这部分在没收时回到份额价值中。被没收的凭证继续为资金池挖矿。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>损失准备金只在核销时用于承担损失，除此之外绝不离开资金池。\u003c/p>\n\u003cdiv class=\"warn\">\u003cstrong>不承诺任何回报。\u003c/strong>费用、损失和份额价值都以 BEM 计算，这里没有任何机制能保护您免受 BEM 价格下跌的影响。少数矿工持有大部分符合条件的矿机，一位大矿工出问题，仍可能影响资金池的很大一部分。详见\u003ca href=\"#risks\">风险\u003c/a>。\u003c/div>"}},{"id":"eligibility","group":"Borrow against a rig","title":"Is my rig eligible?","nav":"Eligibility","lead":"The checks a rig must pass before it can back an advance, and every status the Rigs page can show.","body":"\u003ch2>The conditions\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003col>\n\u003cli>\u003cstrong>Bridged to your wallet.\u003c/strong> The rig is bridged to X Layer and its RIG voucher is in your own wallet. Bridge on \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">tapeout.net\u003c/a> to your wallet, never directly to an agent.\u003c/li>\n\u003cli>\u003cstrong>Supported processor:\u003c/strong> TapeOut, Behemoth or RefBench.\u003c/li>\n\u003cli>\u003cstrong>At least 3 days old\u003c/strong>, counted from when the rig started mining.\u003c/li>\n\u003cli>\u003cstrong>Screen pass in effect.\u003c/strong> The rig matches every official test vector of its task, and the pass was recorded on chain at least 48 hours ago. See \u003ca href=\"#screen\">Revocation screen\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Healthy:\u003c/strong> mining, not stopped, not revoked, not rescued, still in the rig vault, with base power above 0.\u003c/li>\n\u003cli>\u003cstrong>Voucher in sync.\u003c/strong> The voucher on X Layer matches the rig on BSC. If it shows \"not synced\", harvest once on tapeout.net.\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/rig-rules.png\" alt=\"Card \"When a rig can borrow\" listing processor, age, official test vectors and screen pass, and base power conditions.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The same rules, as the Rigs page states them.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cp>At the moment of borrowing, the credit rule also needs a \u003cstrong>rig report less than 5 minutes old\u003c/strong>; the app asks the keeper to send one. Then the debt has to fit the term's cap (85% or 80% of expected base output), and the pool needs room: borrows open, the feed on, and enough idle BEM, borrow-cap room and per-borrower room.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Only base power counts.\u003c/strong> A rig's design bonus is left out of every number, because it is usually lost within hours (a median of 0.44 days). Base power is the rig's verified weight without that bonus.\u003c/div>\n\u003ch2>Rig statuses\u003c/h2>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/rigs-top.png\" alt=\"Rigs page: totals for debt, rigs in a loan, next keeper harvest and rigs ready to borrow, then rig cards with statuses such as Active, Seized, Moving to the pool, In your Rig Agent, Debt cleared and not collateral.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The Rigs page shows one card per voucher, with a status and the action it allows.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Status\u003c/th>\u003cth class=\"\">Meaning\u003c/th>\u003cth class=\"\">What you can do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>Ready\u003c/strong>\u003c/td>\u003ctd class=\"\">Passes every check. Shows how much it can borrow for 7 days.\u003c/td>\u003ctd class=\"\">Borrow\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Active\u003c/strong>\u003c/td>\u003ctd class=\"\">In an open loan.\u003c/td>\u003ctd class=\"\">Repay, view the loan\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Debt cleared\u003c/strong>\u003c/td>\u003ctd class=\"\">The loan closed; the voucher is still in the agent.\u003c/td>\u003ctd class=\"\">Release the voucher, or borrow again\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>In your Rig Agent\u003c/strong>\u003c/td>\u003ctd class=\"\">In an agent with no open loan.\u003c/td>\u003ctd class=\"\">Borrow again, take back\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Not collateral\u003c/strong>\u003c/td>\u003ctd class=\"\">Reached an agent without being registered (for example by a plain transfer). It counts nowhere.\u003c/td>\u003ctd class=\"\">Register it, or take it back\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Screen passed\u003c/strong>\u003c/td>\u003ctd class=\"\">A pass was recorded; it counts 48 hours later.\u003c/td>\u003ctd class=\"\">Wait for the time shown\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Not screened\u003c/strong>\u003c/td>\u003ctd class=\"\">No screen pass yet.\u003c/td>\u003ctd class=\"\">Ask for a screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Screen suspended / changed\u003c/strong>\u003c/td>\u003ctd class=\"\">The pass is suspended, or the rig changed and no longer matches it.\u003c/td>\u003ctd class=\"\">Ask for a new screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Too new\u003c/strong>\u003c/td>\u003ctd class=\"\">Mining for less than 3 days.\u003c/td>\u003ctd class=\"\">Wait for the date shown\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>No base power\u003c/strong>\u003c/td>\u003ctd class=\"\">Base power is 0. Design bonuses do not count.\u003c/td>\u003ctd class=\"\">None\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Not mining\u003c/strong>\u003c/td>\u003ctd class=\"\">Stopped, revoked or not in custody on BSC.\u003c/td>\u003ctd class=\"\">None\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Processor not supported\u003c/strong>\u003c/td>\u003ctd class=\"\">Not TapeOut, Behemoth or RefBench.\u003c/td>\u003ctd class=\"\">None\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Voucher not synced / mismatch\u003c/strong>\u003c/td>\u003ctd class=\"\">The voucher on X Layer does not match the rig on BSC yet.\u003c/td>\u003ctd class=\"\">Harvest once on tapeout.net\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>No data yet\u003c/strong>\u003c/td>\u003ctd class=\"\">No report about this rig has reached X Layer.\u003c/td>\u003ctd class=\"\">Wait, or refresh rig data\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>Seized\u003c/strong>, \u003cstrong>Moving to the pool\u003c/strong>\u003c/td>\u003ctd class=\"\">Taken by the pool after an impairment; the voucher now mines for lenders.\u003c/td>\u003ctd class=\"\">None\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Ask for a screen\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>A rig without a pass shows \u003cstrong>Ask for a screen\u003c/strong>. The screen only reads data: you send no transaction. The TapePool team runs it and, if the rig passes, records the pass on chain; it counts 48 hours later. Reach the team on \u003ca href=\"https://x.com/Tape_Pool\" target=\"_blank\" rel=\"noreferrer\">X, @Tape_Pool\u003c/a>.\u003c/p>\n\u003cp>A rig whose task cannot be proven gets no pass, so it cannot borrow.\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/screen-note.png\" alt=\"Ask for a screen dialog explaining that the screen checks the rig against every official vector of its task and sends no transaction.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The \"Ask for a screen\" note.\u003c/figcaption>\u003c/figure>\n\u003c/div>","zh":{"group":"矿机借款","title":"我的矿机能借款吗？","nav":"借款资格","lead":"矿机在作为借款依据之前必须通过的检查，以及矿机页面可能显示的每一种状态。","body":"\u003ch2>条件\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003col>\n\u003cli>\u003cstrong>已跨链到您的钱包。\u003c/strong>矿机已跨链到 X Layer，RIG 凭证在您自己的钱包中。请在 \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">tapeout.net\u003c/a> 上跨链到自己的钱包，切勿直接跨链到矿机代理。\u003c/li>\n\u003cli>\u003cstrong>处理器受支持：\u003c/strong>TapeOut、Behemoth 或 RefBench。\u003c/li>\n\u003cli>\u003cstrong>至少 3 天\u003c/strong>，从矿机开始挖矿时算起。\u003c/li>\n\u003cli>\u003cstrong>筛查已生效。\u003c/strong>矿机与其任务的全部官方测试向量一致，且通过记录已在链上登记满 48 小时。详见\u003ca href=\"#screen\">撤销风险筛查\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>矿机健康：\u003c/strong>正在挖矿，未停止、未被撤销、未被强制取回，仍由矿机金库托管，基础算力大于 0。\u003c/li>\n\u003cli>\u003cstrong>凭证已同步。\u003c/strong>X Layer 上的凭证与 BSC 上的矿机一致。如果显示“未同步”，请在 tapeout.net 上领取一次收益。\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/rig-rules.png\" alt=\"“矿机可借条件”卡片：列出处理器、上线天数、官方测试向量与筛查、基础算力等条件。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>矿机页面上列出的同一组规则。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cp>发起借款时，信用规则还需要一份 \u003cstrong>5 分钟以内的矿机数据报告\u003c/strong>，应用会请 keeper 代为推送。此外，债务必须在该期限的上限内（预期基础产出的 85% 或 80%），资金池也要有额度：借款开放、数据源开启，并且闲置 BEM、借款上限和单个借款人上限都有剩余。\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>只计算基础算力。\u003c/strong>矿机的设计加成不计入任何数字，因为它通常不到一天就会消失（中位数为 0.44 天）。基础算力是矿机去掉设计加成后的已验证权重。\u003c/div>\n\u003ch2>矿机状态\u003c/h2>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/rigs-top.png\" alt=\"矿机页面：顶部是总债务、贷款中的矿机、下次 keeper 领取和可借矿机，下方是每台矿机的卡片和状态，例如进行中、已没收、已还清、在您的矿机代理中等。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>矿机页面为每张凭证显示一张卡片，包含状态和可执行的操作。\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">状态\u003c/th>\u003cth class=\"\">含义\u003c/th>\u003cth class=\"\">您可以\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">\u003cstrong>可借\u003c/strong>\u003c/td>\u003ctd class=\"\">通过全部检查，并显示 7 天期限可借多少。\u003c/td>\u003ctd class=\"\">借款\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>进行中\u003c/strong>\u003c/td>\u003ctd class=\"\">在一笔进行中的贷款里。\u003c/td>\u003ctd class=\"\">还款、查看贷款\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>已还清\u003c/strong>\u003c/td>\u003ctd class=\"\">贷款已关闭，凭证仍在矿机代理中。\u003c/td>\u003ctd class=\"\">取回凭证，或再次借款\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>在您的矿机代理中\u003c/strong>\u003c/td>\u003ctd class=\"\">在矿机代理中，没有进行中的贷款。\u003c/td>\u003ctd class=\"\">再次借款、取回凭证\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>未登记\u003c/strong>\u003c/td>\u003ctd class=\"\">未经登记就进入了矿机代理（例如普通转账），不计入任何计算。\u003c/td>\u003ctd class=\"\">登记凭证，或取回\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>筛查已通过\u003c/strong>\u003c/td>\u003ctd class=\"\">通过记录已登记，48 小时后生效。\u003c/td>\u003ctd class=\"\">等待显示的时间\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>尚未筛查\u003c/strong>\u003c/td>\u003ctd class=\"\">还没有筛查通过记录。\u003c/td>\u003ctd class=\"\">申请筛查\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>筛查已暂停 / 已变更\u003c/strong>\u003c/td>\u003ctd class=\"\">通过记录被暂停，或矿机已变化、与记录不再一致。\u003c/td>\u003ctd class=\"\">重新申请筛查\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>太新\u003c/strong>\u003c/td>\u003ctd class=\"\">挖矿不足 3 天。\u003c/td>\u003ctd class=\"\">等待显示的日期\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>没有基础算力\u003c/strong>\u003c/td>\u003ctd class=\"\">基础算力为 0，设计加成不计入。\u003c/td>\u003ctd class=\"\">无\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>未在挖矿\u003c/strong>\u003c/td>\u003ctd class=\"\">在 BSC 上已停止、被撤销或不在托管中。\u003c/td>\u003ctd class=\"\">无\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>处理器不受支持\u003c/strong>\u003c/td>\u003ctd class=\"\">不是 TapeOut、Behemoth 或 RefBench。\u003c/td>\u003ctd class=\"\">无\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>凭证未同步 / 不一致\u003c/strong>\u003c/td>\u003ctd class=\"\">X Layer 上的凭证与 BSC 上的矿机尚不一致。\u003c/td>\u003ctd class=\"\">在 tapeout.net 上领取一次收益\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>暂无数据\u003c/strong>\u003c/td>\u003ctd class=\"\">这台矿机的报告还没有到达 X Layer。\u003c/td>\u003ctd class=\"\">等待，或刷新矿机数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">\u003cstrong>已没收\u003c/strong>、\u003cstrong>正在转入资金池\u003c/strong>\u003c/td>\u003ctd class=\"\">因受损被资金池收走，凭证现在为出借人挖矿。\u003c/td>\u003ctd class=\"\">无\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>申请筛查\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>没有通过记录的矿机会显示\u003cstrong>申请筛查\u003c/strong>。筛查只读取数据，您无需发起交易。TapePool 团队执行筛查，通过后把结果记录在链上，48 小时后生效。请通过 \u003ca href=\"https://x.com/Tape_Pool\" target=\"_blank\" rel=\"noreferrer\">X 上的 @Tape_Pool\u003c/a> 联系团队。\u003c/p>\n\u003cp>任务无法被证明的矿机不会获得通过记录，因此不能借款。\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/screen-note.png\" alt=\"申请筛查对话框：说明筛查会核对矿机与其任务的全部官方测试向量，且无需发起交易。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>“申请筛查”说明。\u003c/figcaption>\u003c/figure>\n\u003c/div>"}},{"id":"borrow","group":"Borrow against a rig","title":"Take an advance, step by step","nav":"Borrow step by step","lead":"From a ready rig to BEM in your wallet: create an agent, move the voucher in, refresh rig data and borrow.","body":"\u003ch2>Before you start\u003c/h2>\n\u003cul>\n\u003cli>The rig shows \u003cstrong>Ready\u003c/strong> on the Rigs page. See \u003ca href=\"#eligibility\">Is my rig eligible?\u003c/a>\u003c/li>\n\u003cli>You hold its voucher in the wallet you connect, and some OKB on X Layer for gas.\u003c/li>\n\u003cli>You have read \u003ca href=\"#terms\">Terms and fees\u003c/a> and \u003ca href=\"#late-and-impaired\">Late loans and impairment\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/flow-fresh.png\" alt=\"Rig page for rig 4127: rig facts, term and amount selection, the borrow quote and the four steps with the Borrow button.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The rig page holds the whole flow: the rig, the term and amount, the quote and the steps.\u003c/figcaption>\u003c/figure>\n\u003ch2>The steps\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>Pick the rig, the term and the amount\u003c/strong>Open \u003cem>Rigs\u003c/em> and click \u003cem>Borrow\u003c/em> on a ready rig. Choose 7 or 14 days, then an amount with the field, the slider or \u003cem>MAX\u003c/em>. The maximum already accounts for the fee.\u003c/li>\n\u003cli>\u003cstrong>Create a Rig Agent\u003c/strong>One transaction on X Layer. The app gives each rig its own agent, so a problem with one rig never reaches your other rigs. An empty agent you already own can be reused.\u003c/li>\n\u003cli>\u003cstrong>Move the voucher into the agent\u003c/strong>One transaction per rig, sent from your wallet, which registers the voucher as collateral. Until you borrow you can take it back at any time (\u003cem>Take back\u003c/em>).\u003c/li>\n\u003cli>\u003cstrong>Refresh rig data\u003c/strong>The credit rule needs a report from BSC that is less than 5 minutes old. The keeper sends it for you: no transaction and no BNB. A countdown shows how long the report stays valid.\u003c/li>\n\u003cli>\u003cstrong>Borrow\u003c/strong>One transaction. The agent checks the credit rule, and the pool sends the advance straight to your wallet.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"pair\">\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/quote.png\" alt=\"Borrow quote: you receive 0.6400 BEM, BEM fee flat 0.0016 BEM (0.25%), debt to repay 0.6416 BEM, operating fee 0 OKB (sponsored), minimum fee 0.001 BEM, late fee 0% per day, maturity, and debt against expected output 67.3% of max 85%.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>\"Your borrow\": every cost before you sign.\u003c/figcaption>\u003c/figure>\n\u003cdiv>\u003ch3>Read the quote\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>You receive:\u003c/strong> the advance, sent to your wallet.\u003c/li>\n\u003cli>\u003cstrong>BEM fee, flat:\u003c/strong> the whole cost of the advance. Repaying early does not reduce it.\u003c/li>\n\u003cli>\u003cstrong>Debt to repay:\u003c/strong> advance plus fee.\u003c/li>\n\u003cli>\u003cstrong>Operating fee:\u003c/strong> 0 OKB while the keeper sponsors cross-chain costs.\u003c/li>\n\u003cli>\u003cstrong>Debt vs expected output:\u003c/strong> how close the debt is to the term's cap (85% or 80%).\u003c/li>\n\u003cli>\u003cstrong>How it is repaid:\u003c/strong> when the keeper will harvest.\u003c/li>\n\u003c/ul>\n\u003cp>Your transaction carries the fee and late-fee rate from the quote as limits. If a parameter changed in between, the borrow fails instead of costing more.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch2>BEM already mined\u003c/h2>\n\u003cp>A harvest pays whoever holds the voucher \u003cem>when the harvest is sent on BSC\u003c/em>. So BEM your rig mined before the loan, if it is not harvested first, is paid to the agent once the voucher is there, and repays the loan. The app asks you to choose before you move the voucher:\u003c/p>\n\u003cdiv class=\"pair\">\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/harvest-card.png\" alt=\"Steps card: 0.4080 BEM is mined and not harvested yet, with two choices: Harvest it to my wallet first (about 0.00165 BNB on BSC) or Keep it in this loan.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Harvest first, or let past rewards repay this loan.\u003c/figcaption>\u003c/figure>\n\u003cdiv>\u003cul>\n\u003cli>\u003cstrong>Harvest it to my wallet first:\u003c/strong> a harvest on BSC that you pay in BNB (the bridge message fee plus gas), or on tapeout.net. The BEM reaches your wallet on X Layer in about a minute, less the 0.5% bridge fee.\u003c/li>\n\u003cli>\u003cstrong>Keep it in this loan:\u003c/strong> that BEM repays the loan first. The flat fee stays owed in full.\u003c/li>\n\u003c/ul>\n\u003cp>Either way, any BEM above the debt comes back to you when the loan closes.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/diagrams/reward-paths.png\" alt=\"Illustration: two choices for already-mined BEM: harvest first to your wallet before the voucher transfer, or keep it in the loan after the transfer.\">\u003cfigcaption>Two choices for past rewards. The OKB operating fee it mentions is 0 today.\u003c/figcaption>\u003c/figure>\n\u003ch2>Several rigs in one loan\u003c/h2>\n\u003cp>An agent can hold up to 16 vouchers and borrow against all of them in one loan (\u003cem>Borrow against several rigs in one loan\u003c/em>, an advanced option). Every rig in it must pass the checks. If one of them is impaired, the whole loan can be seized, with all its vouchers.\u003c/p>\n\u003ch2>If something blocks the borrow\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Message\u003c/th>\u003cth class=\"\">What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Borrows paused / feed off\u003c/td>\u003ctd class=\"\">A brake is on (see the status bar). Wait; repayments are not affected.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">No room in the pool for you\u003c/td>\u003ctd class=\"\">The pool is near its borrow cap, your per-borrower cap or its idle BEM. Try a smaller amount or later.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Report expired\u003c/td>\u003ctd class=\"\">Refresh rig data again; the report is valid for 5 minutes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Credit rule: deny\u003c/td>\u003ctd class=\"\">The app says which input failed: amount above the cap, rig not eligible, data not fresh.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","zh":{"group":"矿机借款","title":"分步完成一笔借款","nav":"借款步骤","lead":"从可借矿机到 BEM 到账：创建矿机代理、转入凭证、刷新矿机数据、发起借款。","body":"\u003ch2>开始之前\u003c/h2>\n\u003cul>\n\u003cli>矿机在矿机页面上显示为\u003cstrong>可借\u003c/strong>。详见\u003ca href=\"#eligibility\">我的矿机能借款吗？\u003c/a>\u003c/li>\n\u003cli>凭证在您连接的钱包中，并且您在 X Layer 上有少量 OKB 支付 gas。\u003c/li>\n\u003cli>您已阅读\u003ca href=\"#terms\">借贷条款与费用\u003c/a>和\u003ca href=\"#late-and-impaired\">逾期贷款与受损矿机\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/flow-fresh.png\" alt=\"矿机 4127 的页面：矿机信息、期限与金额选择、借款摘要，以及带有借款按钮的四个操作步骤。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>整个借款流程都在矿机页面上完成：矿机信息、期限与金额、借款摘要和操作步骤。\u003c/figcaption>\u003c/figure>\n\u003ch2>操作步骤\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>选择矿机、期限和金额\u003c/strong>打开\u003cem>矿机\u003c/em>，在可借矿机上点击\u003cem>借款\u003c/em>。选择 7 天或 14 天，再通过输入框、滑块或 \u003cem>MAX\u003c/em> 选择金额。显示的最高额度已经扣除了费用。\u003c/li>\n\u003cli>\u003cstrong>创建矿机代理\u003c/strong>在 X Layer 上发起一笔交易。应用会为每台矿机创建独立的矿机代理，一台矿机出问题不会牵连您的其他矿机。已有的空矿机代理可以重复使用。\u003c/li>\n\u003cli>\u003cstrong>把凭证转入矿机代理\u003c/strong>每台矿机一笔交易，从您的钱包发出，凭证随即登记为借款依据。借款前，您可以随时取回（\u003cem>取回凭证\u003c/em>）。\u003c/li>\n\u003cli>\u003cstrong>刷新矿机数据\u003c/strong>信用规则需要一份来自 BSC、5 分钟以内的报告。keeper 会替您推送：无需交易，也无需 BNB。倒计时显示这份报告还能使用多久。\u003c/li>\n\u003cli>\u003cstrong>借款\u003c/strong>一笔交易。矿机代理核验信用规则，资金池把借款金额直接发放到您的钱包。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"pair\">\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/quote.png\" alt=\"借款摘要：到账金额、固定费用（0.25%）、应还债务、运营费 0 OKB（由赞助方支付）、最低费用 0.001 BEM、滞纳金费率每天 0%、到期时间，以及债务占预期产出的比例。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>“借款摘要”：签名前列出每一项成本。\u003c/figcaption>\u003c/figure>\n\u003cdiv>\u003ch3>看懂借款摘要\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>到账金额：\u003c/strong>借款金额，直接发放到您的钱包。\u003c/li>\n\u003cli>\u003cstrong>固定费用：\u003c/strong>费用就是全部成本，提前还款不会减少费用。\u003c/li>\n\u003cli>\u003cstrong>应还债务：\u003c/strong>借款金额加固定费用。\u003c/li>\n\u003cli>\u003cstrong>运营费：\u003c/strong>keeper 承担跨链成本期间为 0 OKB。\u003c/li>\n\u003cli>\u003cstrong>债务占预期产出：\u003c/strong>债务距离该期限上限（85% 或 80%）还有多远。\u003c/li>\n\u003cli>\u003cstrong>还款方式：\u003c/strong>keeper 何时领取收益。\u003c/li>\n\u003c/ul>\n\u003cp>您的交易会把摘要中的费用和滞纳金费率作为上限一并提交。如果期间参数发生变化，借款会失败，而不会让您多付。\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch2>借款前已挖出的 BEM\u003c/h2>\n\u003cp>领取收益时，BEM 付给\u003cem>在 BSC 上发起领取那一刻\u003c/em>的凭证持有人。因此，矿机在借款前已挖出、但尚未领取的 BEM，在凭证转入矿机代理后会付给代理合约，并用于偿还这笔贷款。转入凭证之前，应用会请您选择：\u003c/p>\n\u003cdiv class=\"pair\">\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/harvest-card.png\" alt=\"操作步骤卡片：有 0.4080 BEM 已挖出尚未领取，两个选项：先领取到我的钱包（BSC 上约 0.00165 BNB），或保留在本笔贷款中。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>先领取，或让已挖出的 BEM 偿还这笔贷款。\u003c/figcaption>\u003c/figure>\n\u003cdiv>\u003cul>\n\u003cli>\u003cstrong>先领取到我的钱包：\u003c/strong>在 BSC 上发起一次领取，您用 BNB 支付跨链消息费和 gas，也可以在 tapeout.net 上领取。BEM 通常约一分钟后到达您在 X Layer 上的钱包，扣除 0.5% 跨链费。\u003c/li>\n\u003cli>\u003cstrong>保留在本笔贷款中：\u003c/strong>这部分 BEM 优先用于还款，固定费用仍需全额支付。\u003c/li>\n\u003c/ul>\n\u003cp>无论选择哪种，贷款关闭时超出债务的 BEM 都会退还给您。\u003c/p>\u003c/div>\n\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/reward-paths.png\" alt=\"示意图：已挖出 BEM 的两种处理方式：转入凭证前先领取到钱包，或转入后保留在贷款中用于还款。\">\u003cfigcaption>已挖出收益的两种处理方式（图为英文）。图中提到的 OKB 运营费目前为 0。\u003c/figcaption>\u003c/figure>\n\u003ch2>多台矿机合并为一笔贷款\u003c/h2>\n\u003cp>一个矿机代理最多可以持有 16 张凭证，并以全部凭证合并借款（\u003cem>以多台矿机借一笔贷款\u003c/em>，属于高级选项）。其中每台矿机都必须通过检查。只要其中一台受损，整笔贷款连同全部凭证都可能被没收。\u003c/p>\n\u003ch2>借款受阻时\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">提示\u003c/th>\u003cth class=\"\">怎么办\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">借款已暂停 / 数据源已关闭\u003c/td>\u003ctd class=\"\">有制动开启（见底部状态栏）。请稍候，还款不受影响。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">资金池没有可借给您的额度\u003c/td>\u003ctd class=\"\">资金池接近借款上限、您的单个借款人上限或闲置 BEM 不足。请尝试更小的金额或稍后再试。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">报告已过期\u003c/td>\u003ctd class=\"\">再次刷新矿机数据，报告有效期为 5 分钟。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">信用规则：拒绝\u003c/td>\u003ctd class=\"\">应用会说明哪一项未通过：金额超过上限、矿机不符合条件，或数据不够新。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}},{"id":"terms","group":"Borrow against a rig","title":"Terms and fees","lead":"Two terms, a flat BEM fee, a debt cap measured against what the rig is expected to mine, and worked examples.","body":"\u003ch2>The term table\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Term\u003c/th>\u003cth class=\"\">Max debt (share of expected base output over the term)\u003c/th>\u003cth class=\"\">Flat BEM fee\u003c/th>\u003cth class=\"\">Maturity\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"\">85%\u003c/td>\u003ctd class=\"\">0.25%\u003c/td>\u003ctd class=\"\">start + 7 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">14 days\u003c/td>\u003ctd class=\"\">80%\u003c/td>\u003ctd class=\"\">0.5%\u003c/td>\u003ctd class=\"\">start + 14 days\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"source\">Source: TapePool specification §4.1 and the launch values of November 16, 2026.\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/pool-borrow.png\" alt=\"Borrow card of the BEM pool page: total borrowed against the borrow cap, term table with 7 days 0.25% fee and 85% debt cap, 14 days 0.5% and 80%, operating fee 0 OKB sponsored, minimum advance 0.01 and fee 0.001 BEM, late fee 0% per day, per-borrower cap 40% of pool assets.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The pool page states the live terms, read from the contract.\u003c/figcaption>\u003c/figure>\n\u003ch2>Every number\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Item\u003c/th>\u003cth class=\"\">Value today\u003c/th>\u003cth class=\"\">Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Minimum advance\u003c/td>\u003ctd class=\"\">0.01 BEM\u003c/td>\u003ctd class=\"\">\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Minimum fee\u003c/td>\u003ctd class=\"\">0.001 BEM\u003c/td>\u003ctd class=\"\">Applies to 7-day advances below 0.4 BEM and 14-day advances below 0.2 BEM.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Late fee\u003c/td>\u003ctd class=\"\">0% per day\u003c/td>\u003ctd class=\"\">Kept at 0 until at least December 7, 2026. A later rate goes through the 48-hour queue and applies to new loans only.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Operating fee\u003c/td>\u003ctd class=\"\">0 OKB (sponsored)\u003c/td>\u003ctd class=\"\">If ever above 0, it is paid in OKB with the borrow and never refunded.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Repaying early\u003c/td>\u003ctd class=\"\">Allowed any time\u003c/td>\u003ctd class=\"\">The flat fee stays the same.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">30-day term\u003c/td>\u003ctd class=\"\">Not offered\u003c/td>\u003ctd class=\"\">Deferred; it needs a new circuit and pool deployment.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The fee, the late-fee rate and the maturity are fixed when you borrow and stored in your loan. A later parameter change never affects an open loan.\u003c/p>\n\u003ch2>How the fee is computed\u003c/h2>\n\u003cpre>\u003ccode>fee  = max( advance × rate, minimum fee )     rounded up to the last BEM unit\ndebt = advance + fee\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"num\">Advance\u003c/th>\u003cth class=\"\">Term\u003c/th>\u003cth class=\"num\">Fee\u003c/th>\u003cth class=\"num\">Debt\u003c/th>\u003cth class=\"num\">Effective fee\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"num\">0.01 BEM\u003c/td>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"num\">0.001 BEM\u003c/td>\u003ctd class=\"num\">0.011 BEM\u003c/td>\u003ctd class=\"num\">10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.1 BEM\u003c/td>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"num\">0.001 BEM\u003c/td>\u003ctd class=\"num\">0.101 BEM\u003c/td>\u003ctd class=\"num\">1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.5 BEM\u003c/td>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"num\">0.00125 BEM\u003c/td>\u003ctd class=\"num\">0.50125 BEM\u003c/td>\u003ctd class=\"num\">0.25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.5 BEM\u003c/td>\u003ctd class=\"\">14 days\u003c/td>\u003ctd class=\"num\">0.0025 BEM\u003c/td>\u003ctd class=\"num\">0.5025 BEM\u003c/td>\u003ctd class=\"num\">0.5%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">1 BEM\u003c/td>\u003ctd class=\"\">14 days\u003c/td>\u003ctd class=\"num\">0.005 BEM\u003c/td>\u003ctd class=\"num\">1.005 BEM\u003c/td>\u003ctd class=\"num\">0.5%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>How much a rig can borrow\u003c/h2>\n\u003cp>The cap applies to the whole debt (advance plus fee), so even a tiny loan cannot owe more than its rig is expected to mine. It is measured against \u003cstrong>expected base output\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode>expected = base power × 7,128 BEM/day × term days × dilution × 0.995\n           ÷ total verified weight of the network\n\ndilution: 0.9907 for 7 days, 0.9815 for 14 days\nmax debt: 85% (7 days) or 80% (14 days) of expected\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>7,128 BEM/day\u003c/strong> is the 7,200 BEM daily emission × 99% that goes to verified weight.\u003c/li>\n\u003cli>\u003cstrong>Dilution\u003c/strong> assumes the network keeps growing about 0.27% a day, so the rig's share shrinks during the term.\u003c/li>\n\u003cli>\u003cstrong>0.995\u003c/strong> removes the 0.5% bridge fee on harvested BEM.\u003c/li>\n\u003cli>The network weight comes from each live rig report, so the same rig can borrow a little less as the network grows. Every step rounds down, in the pool's favor.\u003c/li>\n\u003c/ul>\n\u003ch3>Example\u003c/h3>\n\u003cp>Illustrative only, with a network verified weight of 1,650,000 H:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Rig\u003c/th>\u003cth class=\"\">Term\u003c/th>\u003cth class=\"num\">Expected output\u003c/th>\u003cth class=\"num\">Max debt\u003c/th>\u003cth class=\"num\">Max advance\u003c/th>\u003cth class=\"num\">Fee\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">20 H\u003c/td>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"num\">0.5962 BEM\u003c/td>\u003ctd class=\"num\">0.5068 BEM\u003c/td>\u003ctd class=\"num\">0.5055 BEM\u003c/td>\u003ctd class=\"num\">0.0013 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">20 H\u003c/td>\u003ctd class=\"\">14 days\u003c/td>\u003ctd class=\"num\">1.1813 BEM\u003c/td>\u003ctd class=\"num\">0.9450 BEM\u003c/td>\u003ctd class=\"num\">0.9403 BEM\u003c/td>\u003ctd class=\"num\">0.0047 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">1 H\u003c/td>\u003ctd class=\"\">7 days\u003c/td>\u003ctd class=\"num\">0.0298 BEM\u003c/td>\u003ctd class=\"num\">0.0253 BEM\u003c/td>\u003ctd class=\"num\">0.0243 BEM\u003c/td>\u003ctd class=\"num\">0.001 BEM (minimum)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Even a 1 H rig fits a 7-day loan above the 0.01 BEM minimum. Pool limits can lower what you can take: see the caps below.\u003c/p>\n\u003ch2>Pool limits on a borrow\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Limit\u003c/th>\u003cth class=\"\">Rule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Borrow cap\u003c/td>\u003ctd class=\"\">Total principal lent out stays at or below 70% of pool assets, and below an absolute limit the owner sets.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Per-borrower cap\u003c/td>\u003ctd class=\"\">One wallet's principal, across all its agents, stays at or below 40% of pool assets, and below an absolute limit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Idle BEM\u003c/td>\u003ctd class=\"\">An advance can only come from BEM that is not lent out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Backstop\u003c/td>\u003ctd class=\"\">Total principal stays at or below the current value of the owner's seed shares.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The app shows the binding limit and your room as \u003cem>Available to borrow\u003c/em>.\u003c/p>\n\u003ch2>Other costs\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>X Layer gas, in OKB:\u003c/strong> creating an agent, moving a voucher, borrowing, repaying and releasing. X Layer gas is small (a base fee around 0.02 gwei).\u003c/li>\n\u003cli>\u003cstrong>BSC gas, in BNB:\u003c/strong> only if you harvest yourself or push a report yourself.\u003c/li>\n\u003cli>Through December 31, 2026, the keeper wallet pays the LayerZero fees for report pushes and scheduled harvests.\u003c/li>\n\u003c/ul>\n\u003cp>No loan can run across the first BEM halving: a borrow is refused when its term would end within 30 days of it (August 2030).\u003c/p>","zh":{"group":"矿机借款","title":"借贷条款与费用","lead":"两种期限、一笔固定 BEM 费用、以矿机预期产出衡量的债务上限，以及计算示例。","body":"\u003ch2>期限表\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">期限\u003c/th>\u003cth class=\"\">债务上限（占预期基础产出的比例）\u003c/th>\u003cth class=\"\">固定费用（BEM）\u003c/th>\u003cth class=\"\">到期\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"\">85%\u003c/td>\u003ctd class=\"\">0.25%\u003c/td>\u003ctd class=\"\">借款时间 + 7 天\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">14 天\u003c/td>\u003ctd class=\"\">80%\u003c/td>\u003ctd class=\"\">0.5%\u003c/td>\u003ctd class=\"\">借款时间 + 14 天\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"source\">来源：TapePool 规范 §4.1 及 2026 年 11 月 16 日上线时的参数。\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/zh/pool-borrow.png\" alt=\"BEM 资金池页面的借款卡片：已借出总额与借款上限，期限表（7 天费用 0.25%、债务上限 85%；14 天 0.5%、80%），运营费 0 OKB，最低借款 0.01 与最低费用 0.001 BEM，滞纳金每天 0%，单个借款人上限为资金池资产的 40%。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>资金池页面直接读取合约，显示当前条款。\u003c/figcaption>\u003c/figure>\n\u003ch2>全部数字\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">项目\u003c/th>\u003cth class=\"\">当前值\u003c/th>\u003cth class=\"\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">最低借款金额\u003c/td>\u003ctd class=\"\">0.01 BEM\u003c/td>\u003ctd class=\"\">\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">最低费用\u003c/td>\u003ctd class=\"\">0.001 BEM\u003c/td>\u003ctd class=\"\">适用于 7 天期限下低于 0.4 BEM、14 天期限下低于 0.2 BEM 的借款。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">滞纳金\u003c/td>\u003ctd class=\"\">每天 0%\u003c/td>\u003ctd class=\"\">至少在 2026 年 12 月 7 日前保持为 0。之后若调整，需经过 48 小时公开队列，并且只适用于新贷款。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">运营费\u003c/td>\u003ctd class=\"\">0 OKB（由赞助方支付）\u003c/td>\u003ctd class=\"\">若将来大于 0，会以 OKB 在借款时支付，且不予退还。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">提前还款\u003c/td>\u003ctd class=\"\">随时可以\u003c/td>\u003ctd class=\"\">固定费用不变。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">30 天期限\u003c/td>\u003ctd class=\"\">暂不提供\u003c/td>\u003ctd class=\"\">已暂缓，需要新的电路和资金池部署。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>费用、滞纳金费率和到期时间都在借款时确定并写入您的贷款。之后的任何参数变更都不会影响进行中的贷款。\u003c/p>\n\u003ch2>费用如何计算\u003c/h2>\n\u003cpre>\u003ccode>费用 = max( 借款金额 × 费率, 最低费用 )     向上取整到 BEM 最小单位\n债务 = 借款金额 + 固定费用\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"num\">借款金额\u003c/th>\u003cth class=\"\">期限\u003c/th>\u003cth class=\"num\">费用\u003c/th>\u003cth class=\"num\">债务\u003c/th>\u003cth class=\"num\">实际费率\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"num\">0.01 BEM\u003c/td>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"num\">0.001 BEM\u003c/td>\u003ctd class=\"num\">0.011 BEM\u003c/td>\u003ctd class=\"num\">10%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.1 BEM\u003c/td>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"num\">0.001 BEM\u003c/td>\u003ctd class=\"num\">0.101 BEM\u003c/td>\u003ctd class=\"num\">1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.5 BEM\u003c/td>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"num\">0.00125 BEM\u003c/td>\u003ctd class=\"num\">0.50125 BEM\u003c/td>\u003ctd class=\"num\">0.25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">0.5 BEM\u003c/td>\u003ctd class=\"\">14 天\u003c/td>\u003ctd class=\"num\">0.0025 BEM\u003c/td>\u003ctd class=\"num\">0.5025 BEM\u003c/td>\u003ctd class=\"num\">0.5%\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"num\">1 BEM\u003c/td>\u003ctd class=\"\">14 天\u003c/td>\u003ctd class=\"num\">0.005 BEM\u003c/td>\u003ctd class=\"num\">1.005 BEM\u003c/td>\u003ctd class=\"num\">0.5%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>一台矿机能借多少\u003c/h2>\n\u003cp>上限针对整笔债务（借款金额加费用），因此即使是很小的贷款，所欠金额也不会超过矿机的预期产出。它以\u003cstrong>预期基础产出\u003c/strong>衡量：\u003c/p>\n\u003cpre>\u003ccode>预期产出 = 基础算力 × 7,128 BEM/天 × 期限天数 × 稀释系数 × 0.995\n           ÷ 全网已验证总权重\n\n稀释系数：7 天 0.9907，14 天 0.9815\n债务上限：预期产出的 85%（7 天）或 80%（14 天）\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>7,128 BEM/天\u003c/strong> 是每日 7,200 BEM 排放中分配给已验证权重的 99%。\u003c/li>\n\u003cli>\u003cstrong>稀释系数\u003c/strong>假设全网每天增长约 0.27%，因此矿机在期限内的占比会逐渐下降。\u003c/li>\n\u003cli>\u003cstrong>0.995\u003c/strong> 扣除领取收益时 0.5% 的跨链费。\u003c/li>\n\u003cli>全网权重来自每一份实时报告，因此全网增长时，同一台矿机可借的金额会略微减少。每一步都向下取整，偏向资金池一方。\u003c/li>\n\u003c/ul>\n\u003ch3>示例\u003c/h3>\n\u003cp>仅为示例，假设全网已验证总权重为 1,650,000 H：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">矿机\u003c/th>\u003cth class=\"\">期限\u003c/th>\u003cth class=\"num\">预期产出\u003c/th>\u003cth class=\"num\">债务上限\u003c/th>\u003cth class=\"num\">最高借款金额\u003c/th>\u003cth class=\"num\">费用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">20 H\u003c/td>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"num\">0.5962 BEM\u003c/td>\u003ctd class=\"num\">0.5068 BEM\u003c/td>\u003ctd class=\"num\">0.5055 BEM\u003c/td>\u003ctd class=\"num\">0.0013 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">20 H\u003c/td>\u003ctd class=\"\">14 天\u003c/td>\u003ctd class=\"num\">1.1813 BEM\u003c/td>\u003ctd class=\"num\">0.9450 BEM\u003c/td>\u003ctd class=\"num\">0.9403 BEM\u003c/td>\u003ctd class=\"num\">0.0047 BEM\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">1 H\u003c/td>\u003ctd class=\"\">7 天\u003c/td>\u003ctd class=\"num\">0.0298 BEM\u003c/td>\u003ctd class=\"num\">0.0253 BEM\u003c/td>\u003ctd class=\"num\">0.0243 BEM\u003c/td>\u003ctd class=\"num\">0.001 BEM（最低费用）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>即使是 1 H 的矿机，也能在 0.01 BEM 最低金额之上借一笔 7 天贷款。资金池的额度限制可能进一步降低可借金额，见下文。\u003c/p>\n\u003ch2>资金池对借款的限制\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">限制\u003c/th>\u003cth class=\"\">规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">借款上限\u003c/td>\u003ctd class=\"\">已借出本金总额不超过资金池资产的 70%，并且不超过所有者设定的绝对上限。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">单个借款人上限\u003c/td>\u003ctd class=\"\">一个钱包在其全部矿机代理中的本金合计不超过资金池资产的 40%，并且不超过绝对上限。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">闲置 BEM\u003c/td>\u003ctd class=\"\">借款只能来自尚未借出的 BEM。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">兜底份额\u003c/td>\u003ctd class=\"\">已借出本金总额不超过所有者种子份额的当前价值。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>应用会显示起作用的那一项限制，以及您的\u003cem>可借额度\u003c/em>。\u003c/p>\n\u003ch2>其他成本\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>X Layer gas（OKB）：\u003c/strong>创建矿机代理、转入凭证、借款、还款和取回凭证。X Layer 的 gas 很低（基础费用约 0.02 gwei）。\u003c/li>\n\u003cli>\u003cstrong>BSC gas（BNB）：\u003c/strong>只有在您自己领取收益或自己推送报告时才需要。\u003c/li>\n\u003cli>截至 2026 年 12 月 31 日，keeper 钱包承担报告推送和计划内领取收益的 LayerZero 费用。\u003c/li>\n\u003c/ul>\n\u003cp>任何贷款都不能跨越 BEM 的第一次减半：如果借款期限会在减半前 30 天之内结束（2030 年 8 月），借款会被拒绝。\u003c/p>"}},{"id":"repay","group":"Borrow against a rig","title":"Repayment and release","lead":"Harvests repay the loan on their own. You can repay with BEM at any time, then take your voucher back.","body":"\u003cfigure class=\"\">\u003cimg src=\"img/app/loan-active.png\" alt=\"Loan page for rig 3871: debt now 0.3080 BEM, repayment progress, a timeline from start to maturity, where repayment comes from, and actions Repay with BEM, Release voucher and Apply harvested BEM now.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>An active loan: what is repaid, what is mined but not harvested yet, and when the keeper harvests.\u003c/figcaption>\u003c/figure>\n\u003ch2>Automatic repayment\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>The rig mines on BSC\u003c/strong>Mined BEM waits in the rig until a harvest. Mined but not harvested is not repaid yet.\u003c/li>\n\u003cli>\u003cstrong>A harvest pays the agent\u003c/strong>While the agent holds the voucher, every harvest sends the rig's BEM to the agent on X Layer, less the 0.5% bridge fee.\u003c/li>\n\u003cli>\u003cstrong>A sweep pays the pool\u003c/strong>Anyone can call \u003ccode>sweep\u003c/code> (the app's \u003cem>Apply harvested BEM now\u003c/em>). It pays, in order: late fee (0 today), flat fee, principal. The keeper checks every 10 minutes.\u003c/li>\n\u003c/ol>\n\u003ch3>When the keeper harvests\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>As soon as the rig's output covers the debt\u003c/strong>, with a 1% margin and the bridge fee counted. The keeper checks every 10 minutes.\u003c/li>\n\u003cli>Otherwise \u003cstrong>in the last hour before maturity\u003c/strong>.\u003c/li>\n\u003cli>Then \u003cstrong>every 72 hours\u003c/strong> while a shortfall remains.\u003c/li>\n\u003c/ul>\n\u003cp>You can harvest earlier yourself on \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">tapeout.net\u003c/a>, paying the BNB gas on BSC.\u003c/p>\n\u003ch2>Repay with BEM\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>You can repay all or part of the debt with BEM at any time: \u003cem>Repay with BEM\u003c/em>. The flat fee stays the same; there is no discount for repaying early.\u003c/p>\n\u003cp>Anyone can repay any loan. A repayment never pulls more than the debt left after the BEM already in the agent, so a third party's payment never turns into a surplus for the borrower.\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/repay.png\" alt=\"Repay dialog with the debt now, the BEM already in the agent and an amount field.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>Repay with BEM.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>Take your voucher back\u003c/h2>\n\u003cp>When the debt reaches 0 the loan closes and any BEM above the debt goes to your wallet. The voucher stays in the agent as collateral until you choose:\u003c/p>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cul>\n\u003cli>\u003cstrong>Release voucher\u003c/strong> (one transaction) sends it back to your wallet.\u003c/li>\n\u003cli>Or leave it in the agent and \u003cstrong>borrow again\u003c/strong> without moving it.\u003c/li>\n\u003c/ul>\n\u003cp>Only you can release your vouchers. If anyone could, a stranger could empty your agent between your deposit and your borrow and keep you from ever borrowing.\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/release-card.png\" alt=\"Actions card with the Release voucher button: returns the voucher to your wallet; use Claim late BEM for harvests still on the way.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>After the debt is cleared.\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/repayment-release.png\" alt=\"Illustration: rig harvest, Rig Agent, debt 0, you take back the voucher, voucher home; BEM arriving after the loan is claimed with Claim late BEM.\">\u003cfigcaption>Debt cleared: the loan closes, then you release the voucher.\u003c/figcaption>\u003c/figure>\n\u003ch2>BEM that arrives after the loan\u003c/h2>\n\u003cp>A harvest sent on BSC while the agent held the voucher still pays the agent, even if it lands after the loan closed or after you released the voucher. \u003cstrong>Claim late BEM\u003c/strong> sends that BEM to you. The Rigs page shows a banner when an empty agent holds some.\u003c/p>\n\u003cdiv class=\"note\">Harvest before every hand-over. A harvest pays the holder at the time it was sent on BSC, not when it lands.\u003c/div>","zh":{"group":"矿机借款","title":"还款与取回凭证","lead":"矿机领取的收益会自动还款。您也可以随时用 BEM 还款，然后取回凭证。","body":"\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/loan-active.png\" alt=\"矿机 3871 的贷款页面：当前债务 0.3080 BEM、还款进度、从借款到到期的时间线、还款来源，以及“用 BEM 还款”“取回凭证”“立即归集已领取的 BEM”等操作。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>进行中的贷款：已还多少、已挖出待领取多少，以及 keeper 何时领取。\u003c/figcaption>\u003c/figure>\n\u003ch2>挖矿收益自动还款\u003c/h2>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>矿机在 BSC 上挖矿\u003c/strong>挖出的 BEM 留在矿机中，直到被领取。已挖出待领取的 BEM 尚未还款。\u003c/li>\n\u003cli>\u003cstrong>领取收益付给矿机代理\u003c/strong>矿机代理持有凭证期间，每次领取都会把矿机的 BEM 付给 X Layer 上的代理合约，扣除 0.5% 跨链费。\u003c/li>\n\u003cli>\u003cstrong>归集到资金池\u003c/strong>任何人都可以调用 \u003ccode>sweep\u003c/code>（即应用中的\u003cem>立即归集已领取的 BEM\u003c/em>），依次支付：滞纳金（目前为 0）、固定费用、本金。keeper 每 10 分钟检查一次。\u003c/li>\n\u003c/ol>\n\u003ch3>keeper 何时领取\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>矿机的产出足以还清债务时立即领取\u003c/strong>（已计入 1% 余量和跨链费），keeper 每 10 分钟检查一次。\u003c/li>\n\u003cli>否则在\u003cstrong>到期前最后一小时\u003c/strong>领取。\u003c/li>\n\u003cli>之后只要仍有欠款，\u003cstrong>每 72 小时\u003c/strong>领取一次。\u003c/li>\n\u003c/ul>\n\u003cp>您也可以在 \u003ca href=\"https://tapeout.net\" target=\"_blank\" rel=\"noreferrer\">tapeout.net\u003c/a> 上提前自行领取，需用 BNB 支付 BSC 上的 gas。\u003c/p>\n\u003ch2>用 BEM 还款\u003c/h2>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cp>您可以随时用 BEM 偿还全部或部分债务：\u003cem>用 BEM 还款\u003c/em>。固定费用不变，提前还款没有折扣。\u003c/p>\n\u003cp>任何人都可以替任何贷款还款。一次还款从不会转走多于“扣除代理合约中已有 BEM 后剩余的债务”，因此第三方的还款绝不会变成借款人的盈余。\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/repay.png\" alt=\"还款对话框：当前债务、矿机代理中已有的 BEM，以及金额输入框。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>用 BEM 还款。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003ch2>取回凭证\u003c/h2>\n\u003cp>债务清零后贷款关闭，超出债务的 BEM 转入您的钱包。凭证会继续留在矿机代理中，直到您做出选择：\u003c/p>\n\u003cdiv class=\"pair\">\n\u003cdiv>\u003cul>\n\u003cli>\u003cstrong>取回凭证\u003c/strong>（一笔交易）：把凭证转回您的钱包。\u003c/li>\n\u003cli>或者把凭证留在矿机代理中，无需转移即可\u003cstrong>再次借款\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>只有您本人可以取回凭证。如果任何人都能调用，陌生人就可以在您转入凭证与发起借款之间清空您的矿机代理，让您永远无法借款。\u003c/p>\u003c/div>\n\u003cfigure class=\"narrow\">\u003cimg src=\"img/app/zh/release-card.png\" alt=\"操作卡片中的“取回凭证”按钮：把凭证转回您的钱包；仍在途中的收益请使用“领取迟到的 BEM”。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>债务还清之后。\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/repayment-release.png\" alt=\"示意图：矿机领取收益、矿机代理、债务为 0、您取回凭证、凭证回到钱包；贷款结束后到账的 BEM 可通过“领取迟到的 BEM”领取。\">\u003cfigcaption>债务还清：贷款关闭，然后由您取回凭证（图为英文）。\u003c/figcaption>\u003c/figure>\n\u003ch2>贷款结束后到账的 BEM\u003c/h2>\n\u003cp>矿机代理持有凭证期间在 BSC 上发起的领取，即使在贷款关闭或您取回凭证之后才到账，仍然会付给矿机代理。\u003cstrong>领取迟到的 BEM\u003c/strong> 会把这部分 BEM 转给您。空的矿机代理中有余额时，矿机页面会显示提示。\u003c/p>\n\u003cdiv class=\"note\">每次转移凭证之前，请先领取收益。领取的收益付给 BSC 上发起领取时的持有人，而不是到账时的持有人。\u003c/div>"}},{"id":"late-and-impaired","group":"Borrow against a rig","title":"Late loans and impairment","nav":"Late loans & impairment","lead":"A slow rig is never seized. Only a rig proven impaired on chain can be, and only after 72 hours to repay.","body":"\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/no-price-liquidations.png\" alt=\"Illustration: when the BEM price falls, the debt stays in BEM and mining repays it; when a rig is flagged as impaired, on-chain evidence is required, the borrower has 72 hours to repay, then seizure is possible.\">\u003cfigcaption>Price moves never trigger liquidation. Impairment, proven on chain, can.\u003c/figcaption>\u003c/figure>\n\u003ch2>The BEM price never triggers liquidation\u003c/h2>\n\u003cp>The debt is counted in BEM and repaid in BEM. There is no price oracle and no auction, so a fall in the BEM price changes nothing about your loan.\u003c/p>\n\u003ch2>Late is not default\u003c/h2>\n\u003cp>A rig mines less when the network grows, so a loan can still owe something at maturity. That is \u003cstrong>not\u003c/strong> a default. The voucher stays in the agent and keeps repaying, and the keeper harvests every 72 hours until the debt is cleared. The late fee is 0 today; any future rate applies only to loans opened after it.\u003c/p>\n\u003ch2>What counts as impaired\u003c/h2>\n\u003cp>A rig in a loan is impaired when on-chain evidence shows at least one of these:\u003c/p>\n\u003cul>\n\u003cli>it was \u003cstrong>revoked\u003c/strong> by PodMining (its status is no longer active);\u003c/li>\n\u003cli>it was \u003cstrong>stopped\u003c/strong>;\u003c/li>\n\u003cli>it was \u003cstrong>rescued\u003c/strong> by the TapeOut Safe, or is no longer in the rig vault's custody;\u003c/li>\n\u003cli>it has \u003cstrong>no base power\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>The evidence is either a fresh rig report that shows it, or the voucher record on X Layer showing power 0. Stale or missing data is never evidence. An upgrade of the voucher or vault contracts is not a seize trigger: the keeper pauses new borrows instead.\u003c/p>\n\u003ch2>The timeline after a flag\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Phase\u003c/th>\u003cth class=\"\">Length\u003c/th>\u003cth class=\"\">What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Flag\u003c/td>\u003ctd class=\"\">one transaction\u003c/td>\u003ctd class=\"\">Anyone (usually the keeper) flags the loan with the evidence. Its remaining principal is marked doubtful for lenders, and new deposits close.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Cure window\u003c/td>\u003ctd class=\"\">72 hours\u003c/td>\u003ctd class=\"\">Repay the debt in full to keep your rigs. Repaying clears the flag.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Seize window\u003c/td>\u003ctd class=\"\">24 hours\u003c/td>\u003ctd class=\"\">Anyone can seize with evidence that the rig is still impaired.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Seize\u003c/td>\u003ctd class=\"\">one transaction\u003c/td>\u003ctd class=\"\">The pool takes every collateral voucher in that agent, and the agent closes for good. The vouchers keep mining for lenders.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/loan-flagged.png\" alt=\"Flagged loan: rig 3871 is flagged because it stopped on BSC; repay the debt within the cure window to keep the rig, after which a 24-hour seize window opens.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>A flagged loan shows the deadline and a Repay button.\u003c/figcaption>\u003c/figure>\n\u003cp>If nobody seizes during the seize window, the flag expires. The loan then stays marked doubtful until it is repaid, cleared with evidence that the rig is healthy again, or flagged again with new evidence. While the rig data feed is switched off, the expiry clock of a live flag pauses, and after the feed returns at least 24 hours of seize time remain.\u003c/p>\n\u003ch2>Keep rigs apart\u003c/h2>\n\u003cp>A seize takes every voucher that backs the loan. The app gives each rig its own agent, so one rig's problem does not reach your other rigs. Grouping rigs in one loan is possible, but then they are seized together.\u003c/p>","zh":{"group":"矿机借款","title":"逾期贷款与受损矿机","nav":"逾期与受损","lead":"产出慢的矿机绝不会被没收。只有在链上被证明受损的矿机才可能被没收，而且借款人先有 72 小时还款。","body":"\u003cfigure class=\"\">\u003cimg src=\"img/diagrams/no-price-liquidations.png\" alt=\"示意图：BEM 价格下跌时，债务仍以 BEM 计价并由挖矿偿还；矿机被标记为受损时，需要链上证据，借款人有 72 小时还款，之后才可能被没收。\">\u003cfigcaption>BEM 价格波动不会触发清算；经链上证明的受损才可能导致没收（图为英文）。\u003c/figcaption>\u003c/figure>\n\u003ch2>BEM 价格波动不会触发清算\u003c/h2>\n\u003cp>债务以 BEM 计价、以 BEM 偿还。无预言机，无拍卖，因此 BEM 价格下跌不会改变您贷款的任何条件。\u003c/p>\n\u003ch2>逾期不等于违约\u003c/h2>\n\u003cp>全网算力增长时，矿机产出会减少，所以到期时贷款可能仍有欠款。这\u003cstrong>不是\u003c/strong>违约：凭证留在矿机代理中继续还款，keeper 每 72 小时领取一次，直到债务还清。目前滞纳金为 0；将来若设定费率，只适用于设定之后开立的贷款。\u003c/p>\n\u003ch2>什么算受损\u003c/h2>\n\u003cp>贷款中的矿机，只要链上证据显示以下任意一种情况，即为受损矿机：\u003c/p>\n\u003cul>\n\u003cli>被 PodMining \u003cstrong>撤销\u003c/strong>（状态不再是正常挖矿）；\u003c/li>\n\u003cli>已\u003cstrong>停止\u003c/strong>；\u003c/li>\n\u003cli>被 TapeOut 多签\u003cstrong>强制取回\u003c/strong>（rescue），或不再由矿机金库托管；\u003c/li>\n\u003cli>\u003cstrong>没有基础算力\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>证据要么是一份显示上述情况的最新矿机报告，要么是 X Layer 上显示算力为 0 的凭证记录。过期或缺失的数据从不构成证据。凭证或金库合约的升级不会触发没收，keeper 会改为暂停新的借款。\u003c/p>\n\u003ch2>被标记之后的时间线\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">阶段\u003c/th>\u003cth class=\"\">时长\u003c/th>\u003cth class=\"\">会发生什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">标记\u003c/td>\u003ctd class=\"\">一笔交易\u003c/td>\u003ctd class=\"\">任何人（通常是 keeper）凭证据标记这笔贷款。剩余本金对出借人记为存疑，新存款暂停。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">补救窗口\u003c/td>\u003ctd class=\"\">72 小时\u003c/td>\u003ctd class=\"\">全额还款即可保住您的矿机，还款后标记解除。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">没收窗口\u003c/td>\u003ctd class=\"\">24 小时\u003c/td>\u003ctd class=\"\">任何人都可以凭矿机仍然受损的证据执行没收。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">没收\u003c/td>\u003ctd class=\"\">一笔交易\u003c/td>\u003ctd class=\"\">资金池收走该矿机代理中全部已登记的凭证，矿机代理永久关闭。这些凭证继续为出借人挖矿。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"\">\u003cimg src=\"img/app/zh/loan-flagged.png\" alt=\"被标记的贷款：矿机 3871 因在 BSC 上停止而被标记；在补救窗口内还清债务即可保住矿机，之后进入 24 小时没收窗口。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>被标记的贷款会显示截止时间和还款按钮。\u003c/figcaption>\u003c/figure>\n\u003cp>如果没收窗口内无人执行没收，标记就会过期。此后这笔贷款仍记为存疑，直到它被还清、凭矿机恢复健康的证据解除，或凭新证据再次被标记。矿机数据源关闭期间，进行中标记的过期计时会暂停；数据源恢复后，至少还剩 24 小时的没收时间。\u003c/p>\n\u003ch2>让矿机彼此独立\u003c/h2>\n\u003cp>没收会收走这笔贷款依据的全部凭证。应用为每台矿机创建独立的矿机代理，一台矿机出问题不会牵连您的其他矿机。合并多台矿机借一笔贷款也可以，但它们会被一起没收。\u003c/p>"}},{"id":"credit-rule","group":"Mechanism","title":"The credit rule","lead":"Every advance must pass a public NAND circuit taped out on X Layer. It fails closed.","body":"\u003cp>The rule that decides whether an advance is allowed is a \u003cstrong>TapeOut circuit\u003c/strong>: TapePool's own processor, \u003cstrong>Tape Pool Policy\u003c/strong> (TPPOL), with circuit ID \u003cstrong>1\u003c/strong>, 44 NAND gates. It is evaluated on chain for every borrow. Anyone can read the netlist and check the rule, and the contracts pin its hash, so it cannot change quietly.\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/pool-credit.png\" alt=\"Credit rule card: each loan must pass a public TapeOut circuit on X Layer; processor Tape Pool Policy (TPPOL), circuit ID 1, 44 NAND gates, netlist hash, 7-day queue to change it, and a Verify on the explorer button.\">\u003cfigcaption>\u003cspan class=\"sample\">Sample data\u003c/span>The pool page links the circuit on the explorer.\u003c/figcaption>\u003c/figure>\n\u003ch2>The inputs\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Bits\u003c/th>\u003cth class=\"\">Input\u003c/th>\u003cth class=\"\">Set to 1 when\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">0–1\u003c/td>\u003ctd class=\"\">Term code\u003c/td>\u003ctd class=\"\">0 = 7 days, 1 = 14 days (2 and 3 always deny)\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">2–6\u003c/td>\u003ctd class=\"\">Debt bucket\u003c/td>\u003ctd class=\"\">The debt as a share of expected base output, in 5% steps (below)\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">7\u003c/td>\u003ctd class=\"\">Fresh\u003c/td>\u003ctd class=\"\">Every rig's report is under 5 minutes old and consistent\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">8\u003c/td>\u003ctd class=\"\">Unimpaired\u003c/td>\u003ctd class=\"\">Every rig is active, not stopped, in custody, has base power, matches its voucher and sits in the agent\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">9\u003c/td>\u003ctd class=\"\">Processor allowed\u003c/td>\u003ctd class=\"\">Every rig runs on TapeOut, Behemoth or RefBench\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">10\u003c/td>\u003ctd class=\"\">Old enough\u003c/td>\u003ctd class=\"\">Every rig has mined for at least 3 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">11\u003c/td>\u003ctd class=\"\">Screened\u003c/td>\u003ctd class=\"\">Every rig has a screen pass in effect\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>The rule\u003c/h2>\n\u003cpre>\u003ccode>allow = fresh AND unimpaired AND processor AND age AND screened\n        AND ( (term = 7 days AND bucket ≤ 17) OR (term = 14 days AND bucket ≤ 16) )\u003c/code>\u003c/pre>\n\u003ch3>The debt bucket\u003c/h3>\n\u003cpre>\u003ccode>debt share = ceil( debt × 10,000 ÷ expected )      in basis points\nbucket     = min( 31, ceil( debt share ÷ 500 ) )   5% steps\u003c/code>\u003c/pre>\n\u003cp>85% and 80% fall exactly on bucket edges: bucket 17 means at most 85%, bucket 16 at most 80%. Both roundings go toward deny. For example, on a 1 H rig over 7 days, a debt of exactly 85% of expected output is allowed, and one raw BEM unit more is denied.\u003c/p>\n\u003ch2>Fail closed\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>CreditPolicy\u003c/code> calls the circuit's \u003ccode>eval\u003c/code> as a read-only call with a 1,000,000 gas cap, checks the circuit's size and netlist hash, and decodes the answer strictly.\u003c/li>\n\u003cli>It also computes the same rule in Solidity. The advance is allowed only if \u003cstrong>both\u003c/strong> say yes.\u003c/li>\n\u003cli>A revert, a missing report, an out-of-range value or any unexpected output means deny.\u003c/li>\n\u003c/ul>\n\u003ch2>Changing the rule\u003c/h2>\n\u003cp>A new rule needs a new circuit and a new \u003ccode>CreditPolicy\u003c/code>. The owner queues it publicly for \u003cstrong>7 days\u003c/strong>, a full loan cycle, and new borrows stay paused while it waits. After that, anyone can activate it. The 30-day term is not encoded in the current circuit on purpose: its threshold is not decided, and a circuit that published an undecided rule would mislead.\u003c/p>","zh":{"group":"运行机制","title":"信用规则","lead":"每一笔借款都必须通过一个在 X Layer 上流片的公开 NAND 电路。异常即拒绝。","body":"\u003cp>判定一笔借款能否发放的规则是一个 \u003cstrong>TapeOut 电路\u003c/strong>：TapePool 自己的处理器 \u003cstrong>Tape Pool Policy\u003c/strong>（TPPOL），电路 ID 为 \u003cstrong>1\u003c/strong>，共 44 个 NAND 门。每次借款都会在链上执行它。任何人都可以读取网表、核对规则；合约固定了网表的哈希值，因此它不能被悄悄修改。\u003c/p>\n\u003cfigure class=\"medium\">\u003cimg src=\"img/app/zh/pool-credit.png\" alt=\"信用规则卡片：每笔贷款都必须通过 X Layer 上的公开 TapeOut 电路；处理器 Tape Pool Policy（TPPOL）、电路 ID 1、44 个 NAND 门、网表哈希、修改需 7 天队列，以及“在区块浏览器中验证”按钮。\">\u003cfigcaption>\u003cspan class=\"sample\">示例数据\u003c/span>资金池页面提供电路在区块浏览器上的链接。\u003c/figcaption>\u003c/figure>\n\u003ch2>输入\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">位\u003c/th>\u003cth class=\"\">输入\u003c/th>\u003cth class=\"\">何时为 1\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">0–1\u003c/td>\u003ctd class=\"\">期限代码\u003c/td>\u003ctd class=\"\">0 = 7 天，1 = 14 天（2 和 3 一律拒绝）\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">2–6\u003c/td>\u003ctd class=\"\">债务分档\u003c/td>\u003ctd class=\"\">债务占预期基础产出的比例，按 5% 分档（见下文）\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">7\u003c/td>\u003ctd class=\"\">数据新鲜\u003c/td>\u003ctd class=\"\">每台矿机的报告都在 5 分钟以内，且数据自洽\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">8\u003c/td>\u003ctd class=\"\">未受损\u003c/td>\u003ctd class=\"\">每台矿机都处于正常状态、未停止、在托管中、有基础算力、与凭证一致且在矿机代理中\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">9\u003c/td>\u003ctd class=\"\">处理器允许\u003c/td>\u003ctd class=\"\">每台矿机都运行在 TapeOut、Behemoth 或 RefBench 上\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">10\u003c/td>\u003ctd class=\"\">年龄足够\u003c/td>\u003ctd class=\"\">每台矿机都已挖矿至少 3 天\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">11\u003c/td>\u003ctd class=\"\">已筛查\u003c/td>\u003ctd class=\"\">每台矿机都有已生效的筛查通过记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>规则\u003c/h2>\n\u003cpre>\u003ccode>允许 = 数据新鲜 且 未受损 且 处理器允许 且 年龄足够 且 已筛查\n       且 ( (期限 = 7 天 且 分档 ≤ 17) 或 (期限 = 14 天 且 分档 ≤ 16) )\u003c/code>\u003c/pre>\n\u003ch3>债务分档\u003c/h3>\n\u003cpre>\u003ccode>债务占比 = ceil( 债务 × 10,000 ÷ 预期产出 )      单位：基点\n分档     = min( 31, ceil( 债务占比 ÷ 500 ) )     每档 5%\u003c/code>\u003c/pre>\n\u003cp>85% 和 80% 恰好落在分档边界上：分档 17 表示不超过 85%，分档 16 表示不超过 80%。两次取整都偏向拒绝。例如，一台 1 H 矿机借 7 天，债务恰好等于预期产出的 85% 时允许，多出一个 BEM 最小单位即被拒绝。\u003c/p>\n\u003ch2>异常即拒绝\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>CreditPolicy\u003c/code> 以只读调用执行电路的 \u003ccode>eval\u003c/code>，gas 上限为 1,000,000，核对电路规模与网表哈希，并严格解码返回结果。\u003c/li>\n\u003cli>它还用 Solidity 计算同一条规则。只有两者\u003cstrong>都\u003c/strong>给出“允许”，借款才会发放。\u003c/li>\n\u003cli>任何回滚、缺失的报告、超出范围的数值或意外的输出，都视为拒绝。\u003c/li>\n\u003c/ul>\n\u003ch2>修改规则\u003c/h2>\n\u003cp>新规则需要一个新的电路和一个新的 \u003ccode>CreditPolicy\u003c/code>。所有者须将其公开排队 \u003cstrong>7 天\u003c/strong>，即一个完整的贷款周期，等待期间新的借款保持暂停。期满后，任何人都可以激活它。当前电路有意没有编码 30 天期限：它的阈值尚未确定，把一条未定的规则写进公开电路会误导读者。\u003c/p>"}},{"id":"rig-feed","group":"Mechanism","title":"Rig data feed","lead":"Rigs mine on BSC and loans live on X Layer. A locked reporter carries each rig's state across over LayerZero.","body":"\u003ch2>What a report carries\u003c/h2>\n\u003cp>The \u003cstrong>reporter\u003c/strong> on BSC reads PodMining and the rig vault for each rig and sends a report to the \u003cstrong>receiver\u003c/strong> on X Layer, which keeps the newest report per rig:\u003c/p>\n\u003cul>\n\u003cli>base power (verified weight without the design bonus) and the network's total verified weight;\u003c/li>\n\u003cli>status, stop block and whether the vault still holds the rig;\u003c/li>\n\u003cli>the rig's circuit and processor, and when it started mining;\u003c/li>\n\u003cli>when the reading was taken on BSC.\u003c/li>\n\u003c/ul>\n\u003cp>One message carries up to 16 rigs. For borrowing, a report is valid for \u003cstrong>5 minutes\u003c/strong> (LayerZero usually delivers in well under a minute).\u003c/p>\n\u003ch2>Nobody can vouch for rig data\u003c/h2>\n\u003cul>\n\u003cli>After setup, both ends were \u003cstrong>locked\u003c/strong>: owner and LayerZero delegate set to zero, libraries pinned. No key can change them.\u003c/li>\n\u003cli>Their verifier (DVN) settings mirror the BEM bridge's, so the feed trusts LayerZero only as far as the BEM repayments already must.\u003c/li>\n\u003cli>A custody read that fails or answers zero never becomes a report.\u003c/li>\n\u003c/ul>\n\u003cp>The current feed was deployed and locked on November 16, 2026.\u003c/p>\n\u003ch2>Who sends reports\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>The keeper\u003c/strong> pushes a report when you click \u003cem>Refresh rig data\u003c/em>, rate-limited to 3 pushes per rig per UTC day and 10 per rolling 7 days. Through December 31, 2026 it pays the LayerZero fee.\u003c/li>\n\u003cli>\u003cstrong>Anyone\u003c/strong> can push reports on BSC, paying the LayerZero fee in BNB. If the keeper does not answer, the app offers to do it from your wallet. A 16-rig push cost about 0.002 BNB in LayerZero fees in November 2026.\u003c/li>\n\u003c/ul>\n\u003ch2>If the feed stops\u003c/h2>\n\u003cp>New borrows stop: they need a fresh report. Open loans keep repaying, because repayment depends on harvests and sweeps, not on reports. The guardian can switch the feed off as a brake; after the owner switches it back on, lending waits 6 more minutes so that a report from before the brake cannot be used.\u003c/p>","zh":{"group":"运行机制","title":"矿机数据源","lead":"矿机在 BSC 上挖矿，贷款在 X Layer 上运行。一个已锁定的报告合约通过 LayerZero 把每台矿机的状态传过来。","body":"\u003ch2>报告包含什么\u003c/h2>\n\u003cp>BSC 上的\u003cstrong>报告合约\u003c/strong>读取 PodMining 和矿机金库中每台矿机的数据，把报告发送到 X Layer 上的\u003cstrong>接收合约\u003c/strong>，接收合约为每台矿机保留最新的一份报告：\u003c/p>\n\u003cul>\n\u003cli>基础算力（去掉设计加成后的已验证权重）和全网已验证总权重；\u003c/li>\n\u003cli>状态、停止区块，以及金库是否仍托管该矿机；\u003c/li>\n\u003cli>矿机的电路和处理器，以及开始挖矿的时间；\u003c/li>\n\u003cli>这次读取在 BSC 上发生的时间。\u003c/li>\n\u003c/ul>\n\u003cp>一条消息最多包含 16 台矿机。用于借款时，报告的有效期为 \u003cstrong>5 分钟\u003c/strong>（LayerZero 通常在一分钟内送达）。\u003c/p>\n\u003ch2>没有任何人能为矿机数据担保\u003c/h2>\n\u003cul>\n\u003cli>部署完成后，两端都已\u003cstrong>锁定\u003c/strong>：所有者和 LayerZero 委托人均设为零地址，所用的库已固定。没有任何密钥能再修改它们。\u003c/li>\n\u003cli>它们的验证者（DVN）配置与 BEM 跨链桥相同，因此数据源对 LayerZero 的信任，不超过 BEM 还款本来就需要的程度。\u003c/li>\n\u003cli>托管读取失败或返回零时，绝不会生成报告。\u003c/li>\n\u003c/ul>\n\u003cp>当前数据源于 2026 年 11 月 16 日部署并锁定。\u003c/p>\n\u003ch2>谁来发送报告\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>keeper\u003c/strong>：在您点击\u003cem>刷新矿机数据\u003c/em>时推送报告，限额为每台矿机每个 UTC 日 3 次、任意连续 7 天内 10 次。截至 2026 年 12 月 31 日，由它支付 LayerZero 费用。\u003c/li>\n\u003cli>\u003cstrong>任何人\u003c/strong>：都可以在 BSC 上推送报告，用 BNB 支付 LayerZero 费用。如果 keeper 没有响应，应用会提示您从自己的钱包推送。2026 年 11 月，一次推送 16 台矿机的 LayerZero 费用约为 0.002 BNB。\u003c/li>\n\u003c/ul>\n\u003ch2>数据源停止时\u003c/h2>\n\u003cp>新的借款会停止，因为借款需要新鲜的报告。进行中的贷款继续还款，因为还款依赖领取收益和归集，而不依赖报告。守护者可以把关闭数据源作为一种制动；所有者重新开启后，借款还需再等待 6 分钟，以免使用制动之前的报告。\u003c/p>"}},{"id":"screen","group":"Mechanism","title":"Revocation screen","lead":"Revocation is the main way a loan can fail. Every rig must prove, before it borrows, that the official test vectors cannot revoke it.","body":"\u003ch2>Why a screen\u003c/h2>\n\u003cp>PodMining revokes a rig only through \u003ccode>challenge\u003c/code>, using one of the official test vectors frozen for the rig's task. A revoked rig stops earning, and a loan against it can default. So TapePool requires proof, in advance, that the rig matches \u003cstrong>every\u003c/strong> official vector.\u003c/p>\n\u003ch2>How a rig is screened\u003c/h2>\n\u003col>\n\u003cli>A read-only screen tool evaluates the rig's circuit against every official vector of its task.\u003c/li>\n\u003cli>It also simulates PodMining's own \u003ccode>challenge\u003c/code> with each vector; each must fail to revoke.\u003c/li>\n\u003cli>Where the circuit is small enough (input bits × cycles ≤ 20), it proves full equivalence with the task's reference circuit, and checks that no registered counterexample fails.\u003c/li>\n\u003cli>The result is published as an artifact bundle; its hash is recorded on chain with the pass, so anyone can re-run it.\u003c/li>\n\u003c/ol>\n\u003ch2>On chain\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Action\u003c/th>\u003cth class=\"\">Who\u003c/th>\u003cth class=\"\">Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Record a pass\u003c/td>\u003ctd class=\"\">owner\u003c/td>\u003ctd class=\"\">Takes effect \u003cstrong>48 hours\u003c/strong> later, so anyone can object first. Recording again restarts the 48 hours.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Suspend a pass\u003c/td>\u003ctd class=\"\">guardian or owner\u003c/td>\u003ctd class=\"\">Instant. A suspended pass does not count.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Lift a suspension\u003c/td>\u003ctd class=\"\">owner\u003c/td>\u003ctd class=\"\">Instant; restores a pass that was already public and past its delay.\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Revoke a pass\u003c/td>\u003ctd class=\"\">owner\u003c/td>\u003ctd class=\"\">Permanent. Adding it back is a new record with the full 48-hour delay.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The keeper pauses borrows if PodMining or the BSC circuit evaluator changes, and every pass is checked again before borrows reopen. Every rig bridged when the screen first ran passed it.\u003c/p>\n\u003cdiv class=\"warn\">\u003cstrong>Disclosed trust.\u003c/strong> An on-chain pass is the owner's attestation of an off-chain proof, not a proof the chain checks. The 48-hour delay and the published artifacts let anyone object before a pass counts. A screen lowers the risk of revocation; it does not remove it.\u003c/div>","zh":{"group":"运行机制","title":"撤销风险筛查","nav":"筛查","lead":"被撤销是贷款出问题的主要原因。每台矿机在借款前都必须证明，官方测试向量无法撤销它。","body":"\u003ch2>为什么要筛查\u003c/h2>\n\u003cp>PodMining 只会通过 \u003ccode>challenge\u003c/code> 撤销一台矿机，而且只能使用为该矿机任务冻结的官方测试向量之一。被撤销的矿机不再产生收益，以它为依据的贷款就可能违约。因此，TapePool 要求事先证明矿机与\u003cstrong>全部\u003c/strong>官方测试向量一致。\u003c/p>\n\u003ch2>如何筛查\u003c/h2>\n\u003col>\n\u003cli>一个只读的筛查工具，用该任务的每一个官方测试向量评估矿机的电路。\u003c/li>\n\u003cli>它还用每个向量模拟 PodMining 自身的 \u003ccode>challenge\u003c/code>，每一次都必须无法撤销。\u003c/li>\n\u003cli>如果电路足够小（输入位数 × 周期数 ≤ 20），它还会证明矿机与任务参考电路完全等价，并确认没有任何已登记的反例失败。\u003c/li>\n\u003cli>结果作为一组产物公开发布，其哈希值随通过记录一起写入链上，任何人都可以重新运行验证。\u003c/li>\n\u003c/ol>\n\u003ch2>链上操作\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">操作\u003c/th>\u003cth class=\"\">谁\u003c/th>\u003cth class=\"\">效果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">登记通过记录\u003c/td>\u003ctd class=\"\">所有者\u003c/td>\u003ctd class=\"\">\u003cstrong>48 小时\u003c/strong>后生效，让任何人都能先提出异议。重新登记会重新开始 48 小时计时。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">暂停通过记录\u003c/td>\u003ctd class=\"\">守护者或所有者\u003c/td>\u003ctd class=\"\">立即生效。被暂停的记录不计入。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">解除暂停\u003c/td>\u003ctd class=\"\">所有者\u003c/td>\u003ctd class=\"\">立即生效；恢复一条已经公开且已过等待期的记录。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">撤销通过记录\u003c/td>\u003ctd class=\"\">所有者\u003c/td>\u003ctd class=\"\">永久生效。重新添加视为一条新记录，需完整等待 48 小时。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果 PodMining 或 BSC 上的电路执行合约发生变化，keeper 会暂停借款；重新开放借款之前，每条通过记录都会重新核验。筛查首次运行时已跨链的每台矿机都通过了筛查。\u003c/p>\n\u003cdiv class=\"warn\">\u003cstrong>信任说明。\u003c/strong>链上的通过记录是所有者对一项链下证明的声明，并不是由链本身验证的证明。48 小时等待期和公开发布的产物，让任何人都能在记录生效前提出异议。筛查能降低被撤销的风险，但不能消除风险。\u003c/div>"}},{"id":"pool-accounting","group":"Mechanism","title":"Pool accounting and caps","nav":"Pool accounting & caps","lead":"How the vault counts its assets, the caps on new deposits and borrows, and the backstop rule.","body":"\u003ch2>Assets\u003c/h2>\n\u003cpre>\u003ccode>idle         = tracked BEM − loss reserve\ntotal assets = idle + principal lent out − doubtful principal − income not yet released\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Tracked BEM\u003c/strong> is what the pool has booked. BEM sent to the pool directly is booked at the next pool call and released over 7 days like any income.\u003c/li>\n\u003cli>\u003cstrong>Lending moves idle to principal lent out\u003c/strong>, so a borrow does not change total assets.\u003c/li>\n\u003cli>\u003cstrong>Withdrawals use idle BEM only.\u003c/strong> \u003ccode>maxWithdraw\u003c/code> and \u003ccode>maxRedeem\u003c/code> are capped to it, and every rounding favors the vault.\u003c/li>\n\u003c/ul>\n\u003ch2>Caps\u003c/h2>\n\u003cp>Caps only block \u003cstrong>new\u003c/strong> deposits and \u003cstrong>new\u003c/strong> borrows. They never block a repayment, a sweep or a withdrawal.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Cap\u003c/th>\u003cth class=\"\">Rule\u003c/th>\u003cth class=\"\">Who sets it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Supply cap\u003c/td>\u003ctd class=\"\">Total assets after a deposit stay at or below the cap. \u003ccode>maxDeposit\u003c/code> reports the room left, and 0 while a loan is doubtful.\u003c/td>\u003ctd class=\"\">Owner, within a hard bound in code\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Borrow cap\u003c/td>\u003ctd class=\"\">Principal lent out ≤ 70% of total assets, and ≤ an absolute limit.\u003c/td>\u003ctd class=\"\">Owner, within hard bounds\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Per-borrower cap\u003c/td>\u003ctd class=\"\">One wallet's principal, summed across its agents, ≤ 40% of total assets, and ≤ an absolute limit.\u003c/td>\u003ctd class=\"\">Owner, within hard bounds\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Liquidity\u003c/td>\u003ctd class=\"\">An advance ≤ idle BEM.\u003c/td>\u003ctd class=\"\">Fixed\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Backstop\u003c/td>\u003ctd class=\"\">Principal lent out ≤ the current value of the backstop's shares.\u003c/td>\u003ctd class=\"\">Fixed at deploy\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Per rig\u003c/td>\u003ctd class=\"\">Debt ≤ 85% (7 days) or 80% (14 days) of expected base output.\u003c/td>\u003ctd class=\"\">The credit rule\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>These are admission checks, not standing ratios: lowering a cap below what is already lent leaves those loans alone, and percentages can drift after withdrawals.\u003c/p>\n\u003ch2>The backstop\u003c/h2>\n\u003cp>The \u003cstrong>backstop\u003c/strong> is the address that holds the owner's seed shares, fixed when the pool was deployed. Total lending can never exceed the current value of those shares, so while the seed stays in, other lenders' withdrawals are covered by idle BEM. A loss lowers the seed's value first in that comparison and can make withdrawals wait for repayments or a top-up.\u003c/p>\n\u003ch2>Fee split and reserve\u003c/h2>\n\u003cul>\n\u003cli>20% of each fee (flat and late) goes to the loss reserve, up to 5% of the total assets measured when the loan began. These shares are stored per loan, so later changes apply to later loans only.\u003c/li>\n\u003cli>The rest is booked as income and released over 7 days.\u003c/li>\n\u003cli>At a seize, the reserve covers the written-off principal as far as it can.\u003c/li>\n\u003c/ul>\n\u003ch2>Seized vouchers\u003c/h2>\n\u003cp>A seized voucher goes to the pool and stays there: the pool has no function that transfers vouchers out. Its harvests pay the pool directly, and the keeper keeps harvesting them weekly.\u003c/p>","zh":{"group":"运行机制","title":"资金池记账与上限","nav":"记账与上限","lead":"资金池如何计算资产、对新存款和新借款的上限，以及兜底份额规则。","body":"\u003ch2>资产\u003c/h2>\n\u003cpre>\u003ccode>闲置 BEM = 已入账 BEM − 损失准备金\n资产总额 = 闲置 BEM + 已借出本金 − 存疑本金 − 尚未释放的收入\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>已入账 BEM\u003c/strong> 是资金池已记账的部分。直接转入资金池的 BEM 会在下一次资金池调用时入账，并像其他收入一样分 7 天释放。\u003c/li>\n\u003cli>\u003cstrong>借款把闲置 BEM 转为已借出本金\u003c/strong>，因此一笔借款不会改变资产总额。\u003c/li>\n\u003cli>\u003cstrong>提款只使用闲置 BEM。\u003c/strong>\u003ccode>maxWithdraw\u003c/code> 和 \u003ccode>maxRedeem\u003c/code> 都以它为上限，所有取整都偏向资金池。\u003c/li>\n\u003c/ul>\n\u003ch2>上限\u003c/h2>\n\u003cp>上限只限制\u003cstrong>新的\u003c/strong>存款和\u003cstrong>新的\u003c/strong>借款，从不限制还款、归集或提取。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">上限\u003c/th>\u003cth class=\"\">规则\u003c/th>\u003cth class=\"\">由谁设定\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">供应上限\u003c/td>\u003ctd class=\"\">存入后资产总额不超过上限。\u003ccode>maxDeposit\u003c/code> 返回剩余额度；有存疑贷款时返回 0。\u003c/td>\u003ctd class=\"\">所有者，在代码中的硬性边界之内\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">借款上限\u003c/td>\u003ctd class=\"\">已借出本金 ≤ 资产总额的 70%，且 ≤ 一个绝对上限。\u003c/td>\u003ctd class=\"\">所有者，在硬性边界之内\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">单个借款人上限\u003c/td>\u003ctd class=\"\">一个钱包在其全部矿机代理中的本金合计 ≤ 资产总额的 40%，且 ≤ 一个绝对上限。\u003c/td>\u003ctd class=\"\">所有者，在硬性边界之内\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">流动性\u003c/td>\u003ctd class=\"\">单笔借款 ≤ 闲置 BEM。\u003c/td>\u003ctd class=\"\">固定\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">兜底份额\u003c/td>\u003ctd class=\"\">已借出本金 ≤ 兜底地址所持份额的当前价值。\u003c/td>\u003ctd class=\"\">部署时固定\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">单台矿机\u003c/td>\u003ctd class=\"\">债务 ≤ 预期基础产出的 85%（7 天）或 80%（14 天）。\u003c/td>\u003ctd class=\"\">信用规则\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些是准入检查，而不是持续生效的比例：把上限调低到已借出金额以下，不会影响已有贷款；提款之后，各项比例也可能变化。\u003c/p>\n\u003ch2>兜底份额\u003c/h2>\n\u003cp>\u003cstrong>兜底地址\u003c/strong>是持有所有者种子份额的地址，在资金池部署时即已固定。借出总额永远不能超过这部分份额的当前价值，因此只要种子份额留在池中，其他出借人的提款就由闲置 BEM 覆盖。出现损失时，这部分种子份额的价值在这项比较中首先下降，提款可能需要等待还款或补充资金。\u003c/p>\n\u003ch2>费用分配与准备金\u003c/h2>\n\u003cul>\n\u003cli>每笔费用（固定费用和滞纳金）的 20% 进入损失准备金，上限为贷款开始时资产总额的 5%。这些比例按每笔贷款单独保存，之后的调整只适用于之后的贷款。\u003c/li>\n\u003cli>其余部分记为收入，分 7 天释放。\u003c/li>\n\u003cli>没收时，准备金在其余额范围内承担被核销的本金。\u003c/li>\n\u003c/ul>\n\u003ch2>被没收的凭证\u003c/h2>\n\u003cp>被没收的凭证转入资金池后会一直留在那里：资金池没有任何把凭证转出的函数。这些凭证领取的收益直接支付给资金池，keeper 每周领取一次。\u003c/p>"}},{"id":"keeper","group":"Mechanism","title":"Keeper and guardian","lead":"An off-chain bot does the routine work on time. Its key can pull three brakes and nothing else.","body":"\u003ch2>What the keeper does\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">Job\u003c/th>\u003cth class=\"\">Chain\u003c/th>\u003cth class=\"\">When\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">Harvest rigs in a loan\u003c/td>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">Once their output covers the debt (checked every 10 minutes), otherwise in the last hour before maturity, then every 72 hours while a shortfall remains\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Harvest seized vouchers\u003c/td>\u003ctd class=\"\">BSC\u003c/td>\u003ctd class=\"\">Weekly\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Sweep agents into the pool\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">Every 10 minutes when BEM is waiting\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Push rig reports\u003c/td>\u003ctd class=\"\">BSC to X Layer\u003c/td>\u003ctd class=\"\">When a borrower asks, rate-limited\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Flag impaired loans\u003c/td>\u003ctd class=\"\">X Layer\u003c/td>\u003ctd class=\"\">When evidence permits\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Watch TapeOut contracts\u003c/td>\u003ctd class=\"\">both\u003c/td>\u003ctd class=\"\">Compares implementation slots with reviewed values, using finalized reads\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">Alert the owner\u003c/td>\u003ctd class=\"\">off-chain\u003c/td>\u003ctd class=\"\">Through a Telegram bot\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>It runs on a hosted service and holds only gas (BNB and OKB), never pool funds. It also serves the app read-only data: share-value history and positions.\u003c/p>\n\u003ch2>The guardian brakes\u003c/h2>\n\u003cp>The keeper's key is also the \u003cstrong>guardian\u003c/strong>. It can do three things, each instantly, and only the owner can undo them:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Pause borrows.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Suspend a rig's screen pass.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Switch off the rig data feed.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth class=\"\">The keeper detects\u003c/th>\u003cth class=\"\">It does at once\u003c/th>\u003cth class=\"\">The owner then\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">A change of the voucher, rig vault or PodMining implementation\u003c/td>\u003ctd class=\"\">Pauses borrows and switches off the feed\u003c/td>\u003ctd class=\"\">Reviews the change and restores when the data is trusted again\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A change of the BSC circuit evaluator\u003c/td>\u003ctd class=\"\">Pauses borrows\u003c/td>\u003ctd class=\"\">Reviews the evaluator and the screen assumptions\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">A rescue of one rig\u003c/td>\u003ctd class=\"\">Suspends that rig's pass, pushes a report and flags any loan that holds it\u003c/td>\u003ctd class=\"\">Revokes the pass, or lifts the suspension after a false alarm\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Open loans continue in every case. No brake ever touches repayments, withdrawals, flags or seizes.\u003c/p>\n\u003ch2>If the keeper stops\u003c/h2>\n\u003cp>Nothing it does needs its key except the brakes. Anyone can harvest a rig (
